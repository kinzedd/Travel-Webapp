<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Sapporo Snow — Travel App</title>

  <!-- App CSS (optional; you can keep your own file) -->
  <link rel="stylesheet" href="./assets/app.css" />

  <!-- Vue (global build) -->
  <script src="./assets/vue.global.prod.js"></script>

  <!-- Supabase JS v2 (UMD global: window.supabase) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{
      --bg:#0b1220;
      --card: rgba(255,255,255,.06);
      --card2: rgba(255,255,255,.04);
      --stroke: rgba(255,255,255,.10);
      --stroke2: rgba(255,255,255,.14);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.70);
      --ok: rgba(191,255,209,.95);
      --danger: rgba(255,180,180,.95);
      --shadow: 0 18px 60px rgba(0,0,0,.55);
      --radius: 22px;
      --radius2: 18px;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      color:var(--text);
      background: var(--bg);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      overflow-x:hidden;
    }

    /* bg.jpg is OUTSIDE assets folder (same folder as this html) */
    body::before{
      content:"";
      position:fixed; inset:0;
      background:
        radial-gradient(1200px 800px at 20% 10%, rgba(54,130,255,.18), transparent 60%),
        radial-gradient(900px 700px at 80% 0%, rgba(0,255,210,.10), transparent 55%),
        radial-gradient(900px 800px at 20% 100%, rgba(255,255,255,.10), transparent 60%),
        url("./bg.jpg");
      background-size: cover;
      background-position: center;
      filter: saturate(1.02) contrast(1.02);
      opacity:.55;
      z-index:-2;
    }
    body::after{
      content:"";
      position:fixed; inset:0;
      background: linear-gradient(180deg, rgba(11,18,32,.70), rgba(11,18,32,.92));
      z-index:-1;
    }

    a{ color:inherit; text-decoration:none; }
    .muted{ color:var(--muted); }
    .mono{ font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono","Courier New", monospace; font-size:12px; }
    .btn{ cursor:pointer; user-select:none; -webkit-tap-highlight-color: transparent; }
    .btn:active{ transform: translateY(1px); }

    .wrap{
      max-width: 560px;
      margin: 0 auto;
      padding: 14px 14px 110px; /* bottom toolbar space */
    }

    .card{
      background: var(--card);
      border:1px solid var(--stroke);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }
    .cardInner{
      background: var(--card2);
      border:1px solid rgba(255,255,255,.08);
      border-radius: var(--radius2);
    }

    .header{
      padding: 14px;
      position: relative;
    }
    .kicker{
      letter-spacing:.26em;
      font-size:12px;
      color: rgba(255,255,255,.62);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .titleRow{
      display:flex;
      align-items:flex-start;
      gap:12px;
      margin-top:8px;
    }
    .appTitle{
      font-weight: 900;
      font-size: 44px;
      line-height: 0.95;
    }
    .subTitle{
      margin-top:10px;
      font-weight: 700;
      color: rgba(255,255,255,.72);
      font-size: 18px;
    }

    .headerRight{
      margin-left:auto;
      display:flex;
      flex-direction:column;
      gap:10px;
      align-items:flex-end;
      min-width: 160px;
    }
    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:.42rem .72rem;
      border-radius: 999px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.18);
      white-space:nowrap;
    }
    .pill.ok{ border-color: rgba(191,255,209,.35); color: var(--ok); }
    .pill.bad{ border-color: rgba(255,180,180,.35); color: var(--danger); }

    .miniBtn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:40px; height:40px;
      border-radius: 999px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.18);
    }

    .weatherLine{
      display:flex; gap:10px; align-items:center; justify-content:flex-end;
    }
    .weatherLine .wmain{ font-weight:800; }
    .weatherLine .wsub{ font-size:12px; color: rgba(255,255,255,.70); }

    /* Top actions (small) */
    .topActions{
      display:flex;
      gap:10px;
      margin-top:12px;
      flex-wrap:wrap;
    }
    .chipBtn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding: .55rem .85rem;
      border-radius: 999px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      font-weight: 800;
      color: rgba(255,255,255,.92);
    }

    /* Plan area */
    .section{
      margin-top: 12px;
      padding: 12px;
    }
    .sectionHead{
      display:flex;
      align-items:center;
      gap:10px;
      padding: 6px 2px 10px;
    }
    .sectionTitle{
      font-weight: 900;
      font-size: 22px;
      letter-spacing:.02em;
    }
    .sectionHead .right{
      margin-left:auto;
      display:flex;
      gap:10px;
    }

    /* Days slider: thin cards, 2 rows max layout */
    .daysSlider{
      display:flex;
      gap:12px;
      overflow-x:auto;
      padding: 10px 2px 6px;
      scroll-snap-type: x mandatory;
    }
    .daysSlider::-webkit-scrollbar{ height:8px; }
    .daysSlider::-webkit-scrollbar-thumb{ background: rgba(255,255,255,.12); border-radius: 999px; }
    .dayCard{
      scroll-snap-align: start;
      min-width: 210px;
      max-width: 210px;
      padding: 10px 12px;
      border-radius: 18px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.05);
      position: relative;
    }
    .dayCard.active{
      border-color: rgba(191,255,209,.35);
      background: rgba(191,255,209,.06);
    }
    .dayTop{
      display:flex;
      align-items:center;
      gap:10px;
    }
    .dayBadge{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding: .25rem .6rem;
      border-radius: 999px;
      border:1px solid rgba(255,255,255,.14);
      font-weight: 900;
    }
    .dayDate{
      margin-left:auto;
      font-weight: 800;
      color: rgba(255,255,255,.70);
    }
    .penBtn{
      margin-left:auto;
      width:34px; height:34px;
      border-radius: 999px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.18);
      display:inline-flex;
      align-items:center;
      justify-content:center;
    }
    .penBtn svg{ width:16px; height:16px; opacity:.95; }
    .dayTitle{
      margin-top:10px;
      font-size: 18px;
      font-weight: 900;
      line-height: 1.15;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    /* Period blocks */
    .periodCard{
      margin-top: 12px;
      padding: 12px;
    }
    .periodHead{
      display:flex;
      align-items:center;
      gap:10px;
      padding: 4px 2px 10px;
    }
    .periodName{
      font-weight: 900;
      font-size: 20px;
    }
    .periodHead .right{
      margin-left:auto;
      display:flex;
      gap:10px;
    }

    .list{
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .itemCard{
      padding: 12px;
      border-radius: 18px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.04);
      position: relative;
      overflow:hidden;
    }
    .itemTop{
      display:flex;
      align-items:flex-start;
      gap:10px;
    }
    .itemIcon{
      width:28px; height:28px;
      display:flex; align-items:center; justify-content:center;
      border-radius: 10px;
      background: rgba(0,0,0,.18);
      border:1px solid rgba(255,255,255,.10);
      flex: 0 0 auto;
      font-size: 16px;
    }
    .itemMain{
      flex: 1 1 auto;
      min-width:0;
    }
    .itemTitle{
      font-weight: 950;
      font-size: 18px;
      line-height:1.15;
      word-break: break-word;
    }
    .itemNote{
      margin-top:8px;
      color: rgba(255,255,255,.72);
      white-space: pre-wrap;
      line-height: 1.35;
    }
    .mapsLink{
      margin-top: 8px;
      display:inline-flex;
      gap:8px;
      align-items:center;
      padding: .35rem .6rem;
      border-radius: 999px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.16);
      color: rgba(255,255,255,.85);
      font-weight: 800;
      font-size: 13px;
    }

    /* Flights */
    .flightList{ display:flex; flex-direction:column; gap:12px; }
    .flightCard{
      background: rgba(255,255,255,.94);
      color: rgba(0,0,0,.88);
      border-radius: 18px;
      padding: 14px;
      border: 1px solid rgba(0,0,0,.06);
      box-shadow: 0 10px 30px rgba(0,0,0,.20);
      overflow:hidden;
    }
    .flightTop{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      color: rgba(0,0,0,.55);
      font-weight:700;
      font-size: 13px;
    }
    .flightRoute{
      margin-top:8px;
      display:flex;
      align-items:baseline;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
    }
    .flightRoute .big{
      font-size: 26px;
      font-weight: 900;
      color: #135c57;
    }
    .flightMid{
      margin-top: 10px;
      display:flex;
      align-items:center;
      gap:12px;
    }
    .flightMid .code{
      font-weight: 900;
      font-size: 28px;
      color:#135c57;
      min-width: 64px;
    }
    .flightMid .time{
      font-size: 44px;
      font-weight: 900;
      letter-spacing:.02em;
      color: rgba(0,0,0,.86);
      line-height:1;
    }
    .flightMid .term{
      margin-top:6px;
      color: rgba(0,0,0,.60);
      font-weight: 700;
    }
    .flightLine{
      flex:1 1 auto;
      height: 4px;
      background: rgba(0,0,0,.10);
      border-radius:999px;
      position:relative;
      margin: 0 6px;
    }
    .flightLine::after{
      content:"";
      position:absolute;
      right:-6px; top:50%;
      width:14px; height:14px;
      transform: translateY(-50%);
      border-radius:999px;
      background: rgba(0,0,0,.16);
    }
    .plane{
      position:absolute;
      left: 18%;
      top: 50%;
      transform: translateY(-55%) rotate(0deg);
      font-size: 18px;
    }
    .flightDur{
      text-align:center;
      color: rgba(0,0,0,.55);
      font-weight: 800;
      font-size: 14px;
      margin-top: 2px;
    }
    .flightActions{
      margin-top: 10px;
      display:flex;
      justify-content:flex-end;
      gap:10px;
    }
    .lightBtn{
      display:inline-flex; align-items:center; justify-content:center;
      padding:.5rem .8rem;
      border-radius: 999px;
      border:1px solid rgba(0,0,0,.10);
      background: rgba(0,0,0,.04);
      font-weight: 900;
      color: rgba(0,0,0,.75);
    }

    /* Shopping */
    .shopRow{
      display:flex; align-items:flex-start; gap:10px;
    }
    .checkbox{
      width:22px; height:22px; margin-top:2px;
      accent-color: #19c37d;
    }
    .strike{
      text-decoration: line-through;
      opacity: .70;
    }

    /* Expenses */
    .expLine{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
    }
    .amountPill{
      margin-left:auto;
      padding:.35rem .6rem;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.16);
      font-weight: 900;
    }

    /* Bottom toolbar */
    .toolbar{
      position:fixed;
      left:0; right:0;
      bottom: 10px;
      padding: 0 14px;
      z-index: 50;
      pointer-events:none;
    }
    .toolbarInner{
      pointer-events:auto;
      max-width:560px;
      margin:0 auto;
      padding: 10px;
      border-radius: 22px;
      background: rgba(0,0,0,.22);
      border:1px solid rgba(255,255,255,.10);
      backdrop-filter: blur(14px);
      display:flex;
      gap:10px;
      justify-content:space-between;
    }
    .tabBtn{
      flex:1 1 0;
      border-radius: 18px;
      padding: 10px 8px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.06);
      text-align:center;
      font-weight: 900;
      color: rgba(255,255,255,.88);
      min-width: 0;
    }
    .tabBtn.active{
      border-color: rgba(191,255,209,.35);
      background: rgba(191,255,209,.10);
    }
    .tabBtn .ico{ font-size:18px; display:block; }
    .tabBtn .lbl{ font-size:12px; opacity:.9; margin-top:4px; }

    /* Debug tiny button + drawer */
    .debugBtn{
      position:fixed;
      right: 16px;
      bottom: 86px;
      z-index: 60;
      width: 46px;
      height: 46px;
      border-radius: 999px;
      background: rgba(0,0,0,.24);
      border:1px solid rgba(255,255,255,.14);
      backdrop-filter: blur(14px);
      display:flex; align-items:center; justify-content:center;
      font-size: 18px;
    }
    .debugDrawer{
      position:fixed;
      right: 16px;
      bottom: 140px;
      width: min(520px, calc(100vw - 32px));
      max-height: 60vh;
      overflow:auto;
      z-index: 60;
      padding: 12px;
    }
    .debugRow{
      display:flex; gap:10px; flex-wrap:wrap; align-items:center;
    }

    /* Modal (edit) */
    .overlay{
      position:fixed; inset:0;
      background: rgba(0,0,0,.55);
      z-index: 80;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 14px;
    }
    .modal{
      width: min(560px, 96vw);
      max-height: 86vh;
      overflow:auto;
      padding: 14px;
    }
    .modalHead{
      display:flex;
      align-items:center;
      gap:10px;
      margin-bottom: 10px;
    }
    .modalTitle{
      font-size: 18px;
      font-weight: 950;
    }
    .modalHead .right{ margin-left:auto; display:flex; gap:10px; }
    .grid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 10px;
    }
    .grid .full{ grid-column: 1 / -1; }
    label{
      display:block;
      font-size: 12px;
      color: rgba(255,255,255,.72);
      margin-bottom: 6px;
      font-weight: 800;
    }
    input, textarea, select{
      width:100%;
      border-radius: 14px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.20);
      color: rgba(255,255,255,.92);
      padding: .65rem .75rem;
      outline:none;
    }
    textarea{ min-height: 96px; resize: vertical; }
    .modalActions{
      display:flex;
      gap:10px;
      margin-top: 12px;
    }
    .dangerBtn{
      border-color: rgba(255,180,180,.35) !important;
      color: var(--danger) !important;
    }

    /* Mobile tighten */
    @media (max-width: 420px){
      .appTitle{ font-size: 40px; }
      .headerRight{ min-width: 140px; }
      .dayCard{ min-width: 190px; max-width: 190px; }
    }
  </style>
</head>

<body>
<div id="app"></div>

<script>
(() => {
  const { createApp } = Vue;

  // ============
  // CONFIG
  // ============
  const SUPABASE_URL = "https://qvogojdyykgotuitjkhj.supabase.co";
  const SUPABASE_KEY = "sb_publishable_9rQ7sJQ3bZ_uhnT2hxRUKQ_MJv1icIF";

  const sb = window.supabase?.createClient?.(SUPABASE_URL, SUPABASE_KEY);
  if (!sb) console.error("Supabase init failed: window.supabase missing");

  // Ensure Supabase is available before any DB calls; if the CDN is blocked we surface
  // a clear error instead of throwing TypeErrors from undefined clients.
  const getSb = () => {
    if (!sb) throw new Error("Supabase client unavailable. Check network / CDN access.");
    return sb;
  };

  // ============
  // Helpers
  // ============
  const safeStr = (v) => (v == null ? "" : String(v));

  const parseDT = (s) => {
    if (!s) return null;
    // Accept timestamptz or plain strings.
    const d = new Date(s);
    if (isNaN(d.getTime())) return null;
    return d;
  };

  const fmtDate = (d) => {
    if (!d) return "";
    try {
      return new Intl.DateTimeFormat("en-GB", { timeZone: "Asia/Hong_Kong", weekday:"short", day:"2-digit", month:"short", year:"numeric" }).format(d);
    } catch(e){
      return d.toISOString().slice(0,10);
    }
  };

  const fmtTimeHM = (d) => {
    if (!d) return "";
    try {
      return new Intl.DateTimeFormat("en-GB", { timeZone: "Asia/Hong_Kong", hour:"2-digit", minute:"2-digit", hour12:false }).format(d);
    } catch(e){
      return d.toTimeString().slice(0,5);
    }
  };

  const durHM = (a, b) => {
    if (!a || !b) return "";
    const mins = Math.max(0, Math.round((b - a) / 60000));
    const h = Math.floor(mins / 60);
    const m = mins % 60;
    return `${h}h ${m}m`;
  };

  const mapsDirUrl = (query) => {
    const q = (query || "").trim();
    if (!q) return "";
    // open Google Maps directions from current location
    return `https://www.google.com/maps/dir/?api=1&origin=Current+Location&destination=${encodeURIComponent(q)}`;
  };

  // time buckets (use time_label in DB; we normalize to 3 buckets)
  const periodKey = (timeLabel) => {
    const s = (timeLabel || "").trim();
    if (["上午","早上","凌晨"].includes(s)) return "am";
    if (["下午","中午"].includes(s)) return "pm";
    if (["晚上","夜晚"].includes(s)) return "night";
    // fallback: try contains
    if (s.includes("上")) return "am";
    if (s.includes("下") || s.includes("中")) return "pm";
    if (s.includes("晚") || s.includes("夜")) return "night";
    return "am";
  };

  const periodLabel = (k) => ({ am:"上午", pm:"下午", night:"晚上" }[k] || "上午");

  const isMeal = (row) => {
    const k = (row?.kind || "").toLowerCase();
    // you used kind like "food" earlier; accept both.
    return k === "food" || k === "meal" || k === "用餐";
  };

  const isWear = (row) => {
    const k = (row?.kind || "").toLowerCase();
    return k === "wear" || k === "衣著";
  };

  const iconForItem = (row) => {
    if (isWear(row)) return "👗";
    if (isMeal(row)) return "🍽️";
    // destination/activity
    return "📍";
  };

  const zhKindOptions = [
    { value:"activity", label:"行程" },
    { value:"food", label:"用餐" },
    { value:"wear", label:"衣著" },
    { value:"transport", label:"交通" },
    { value:"hotel", label:"酒店" },
  ];

  const periodOptions = [
    { value:"am", label:"上午" },
    { value:"pm", label:"下午" },
    { value:"night", label:"晚上" },
  ];

  // ============
  // App
  // ============
  createApp({
    data(){
      return {
        view: "plan", // plan | flights | expenses | shopping

        // status
        statusText: "ready",
        lastError: null,
        connected: false,
        loading: false,

        // data
        days: [],
        selectedDayId: null,
        planItems: [],
        flights: [],
        shopping: [],
        expenses: [],

        // weather
        weather: { ok:false, temp:null, wind:null, code:null, lat:null, lon:null },

        // debug
        showDebug: false,

        // modal
        editing: null, // { table, mode, title, row, showDelete }
      };
    },

    computed: {
      selectedDay(){
        return this.days.find(d => d.id === this.selectedDayId) || null;
      },

      selectedDayNo(){
        const d = this.selectedDay;
        return d?.day_no ?? null;
      },

      // group plan items (selected day only)
      selectedPlanItems(){
        if (!this.selectedDayId) return [];
        return (this.planItems || []).filter(x => x.day_id === this.selectedDayId);
      },

      // separate wear items outside periods
      wearItems(){
        return this.selectedPlanItems
          .filter(x => isWear(x))
          .sort((a,b) => (a.order_no ?? 0) - (b.order_no ?? 0));
      },

      periodGroups(){
        const base = this.selectedPlanItems.filter(x => !isWear(x));
        const groups = { am:[], pm:[], night:[] };

        for (const it of base){
          const pk = periodKey(it.time_label);
          if (!groups[pk]) groups[pk] = [];
          groups[pk].push(it);
        }

        // For each period: destinations first (many), then ONLY one meal (first by order)
        const out = {};
        for (const k of ["am","pm","night"]){
          const items = (groups[k] || []).slice().sort((a,b) => (a.order_no ?? 0) - (b.order_no ?? 0));

          const dest = items.filter(x => !isMeal(x));
          const meal = items.filter(x => isMeal(x));
          const mealOne = meal.length ? [meal[0]] : [];

          out[k] = { dest, meal: mealOne };
        }
        return out;
      }
    },

    methods: {
      penSvg(){
        return `
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M13.5 6.5l4 4" stroke="white" stroke-width="2" stroke-linecap="round"/>
            <path d="M4 20l4.5-1 10-10a2 2 0 0 0 0-2.8l-.7-.7a2 2 0 0 0-2.8 0l-10 10L4 20Z" stroke="white" stroke-width="2" stroke-linejoin="round"/>
          </svg>
        `;
      },

      setErr(e){
        this.lastError = (e && (e.message || e.error_description)) ? e : { message: String(e) };
        this.statusText = "ERR: " + safeStr(this.lastError.message || this.lastError);
        console.error(e);
      },

      async ping(){
        try {
          const client = getSb();
          const { data, error, status } = await client
            .from("days")
            .select("id,day_no")
            .order("day_no", { ascending:true })
            .limit(1);

          if (error) throw error;
          this.connected = true;
          this.statusText = `OK (${status})`;
          return data;
        } catch (e){
          this.connected = false;
          this.setErr(e);
          return null;
        }
      },

      async loadAll(){
        this.loading = true;
        this.lastError = null;
        this.statusText = "loading...";

        try{
          const client = getSb();

          const qDays = await client
            .from("days")
            .select("id,day_no,date,title,note,sort_order,created_at,updated_at")
            .order("day_no", { ascending:true });

          if (qDays.error) throw qDays.error;
          this.days = qDays.data || [];
          if (!this.selectedDayId && this.days.length) this.selectedDayId = this.days[0].id;

          const qPlan = await client
            .from("plan_items")
            .select("id,day_id,time_label,kind,title,note,maps_query,order_no,created_at,updated_at")
            .order("order_no", { ascending:true });

          if (qPlan.error) throw qPlan.error;
          this.planItems = qPlan.data || [];

          const qFlights = await client
            .from("flights")
            .select("id,seg_no,flight_no,carrier,depart_airport,arrive_airport,depart_time,arrive_time,note,created_at,updated_at")
            .order("seg_no", { ascending:true });

          if (qFlights.error) throw qFlights.error;
          this.flights = qFlights.data || [];

          const qShop = await client
            .from("shopping_items")
            .select("id,name,location,price_text,note,done,order_no,created_at,updated_at")
            .order("order_no", { ascending:true });

          if (qShop.error) throw qShop.error;
          this.shopping = qShop.data || [];

          const qExp = await client
            .from("expenses")
            .select("id,day_id,happened_on,category,merchant,amount,currency,paid_by,note,created_at,updated_at")
            .order("happened_on", { ascending:true });

          if (qExp.error) throw qExp.error;
          this.expenses = qExp.data || [];

          this.connected = true;
          this.statusText = "loaded";
        } catch(e){
          this.connected = false;
          this.setErr(e);
        } finally {
          this.loading = false;
        }
      },

      // ============
      // Weather (browser fetch)
      // ============
      async loadWeather(){
        try{
          // HK default fallback
          const fallback = { lat:22.28, lon:114.19 };

          const getPos = () => new Promise((resolve) => {
            if (!navigator.geolocation) return resolve(null);
            navigator.geolocation.getCurrentPosition(
              (p) => resolve({ lat: p.coords.latitude, lon: p.coords.longitude }),
              () => resolve(null),
              { enableHighAccuracy:false, timeout: 3500, maximumAge: 5 * 60 * 1000 }
            );
          });

          const pos = (await getPos()) || fallback;
          this.weather.lat = +pos.lat.toFixed(2);
          this.weather.lon = +pos.lon.toFixed(2);

          const url = `https://api.open-meteo.com/v1/forecast?latitude=${encodeURIComponent(pos.lat)}&longitude=${encodeURIComponent(pos.lon)}&current_weather=true&timezone=Asia%2FHong_Kong`;
          const r = await fetch(url, { cache:"no-store" });
          if (!r.ok) throw new Error("weather fetch failed");
          const j = await r.json();
          const cw = j.current_weather || null;

          this.weather.ok = !!cw;
          this.weather.temp = cw ? cw.temperature : null;
          this.weather.wind = cw ? cw.windspeed : null;
          this.weather.code = cw ? cw.weathercode : null;
        } catch(e){
          this.weather.ok = false;
        }
      },

      wEmoji(){
        // super simple mapping
        const c = this.weather.code;
        if (c == null) return "☁️";
        if ([0].includes(c)) return "☀️";
        if ([1,2,3].includes(c)) return "⛅️";
        if ([45,48].includes(c)) return "🌫️";
        if ([51,53,55,61,63,65,80,81,82].includes(c)) return "🌧️";
        if ([71,73,75,85,86].includes(c)) return "❄️";
        if ([95,96,99].includes(c)) return "⛈️";
        return "☁️";
      },

      // ============
      // UI actions
      // ============
      selectDay(id){
        this.selectedDayId = id;
      },

      openNew(table){
        const blank = {
          plan_items: { day_no: this.selectedDayNo || 1, period:"am", kind:"activity", title:"", note:"", maps_query:"" },
          days: { day_no: (this.days?.length ? (Math.max(...this.days.map(d=>d.day_no||0))+1) : 1), date:"", title:"", note:"", sort_order: (this.days?.length ? (Math.max(...this.days.map(d=>d.sort_order||0))+1) : 1) },
          flights: { seg_no: (this.flights?.length ? (Math.max(...this.flights.map(f=>f.seg_no||0))+1) : 1), carrier:"", flight_no:"", depart_airport:"", arrive_airport:"", depart_time:"", arrive_time:"", note:"" },
          shopping_items: { name:"", location:"", price_text:"", note:"", done:false, order_no: (this.shopping?.length ? (Math.max(...this.shopping.map(s=>s.order_no||0))+1) : 1) },
          expenses: { day_no: this.selectedDayNo || 1, happened_on:"", category:"", merchant:"", amount:null, currency:"JPY", paid_by:"", note:"" },
        }[table] || {};

        const title = ({
          plan_items: "新增行程項目",
          days: "新增 Day",
          flights: "新增航班",
          shopping_items: "新增購物項目",
          expenses: "新增記帳",
        })[table] || "新增";

        this.editing = { table, mode:"insert", title, row: JSON.parse(JSON.stringify(blank)), showDelete:false };
      },

      openEdit(table, row){
        const clone = JSON.parse(JSON.stringify(row || {}));

        // Inject day_no + period for plan_items / expenses for nicer editing
        if (table === "plan_items"){
          const d = this.days.find(x => x.id === clone.day_id);
          clone.day_no = d?.day_no ?? (this.selectedDayNo || 1);
          clone.period = periodKey(clone.time_label); // store in form
        }
        if (table === "expenses"){
          const d = this.days.find(x => x.id === clone.day_id);
          clone.day_no = d?.day_no ?? (this.selectedDayNo || 1);
        }

        const title = ({
          plan_items: "編輯行程項目",
          days: "編輯 Day",
          flights: "編輯航班",
          shopping_items: "編輯購物項目",
          expenses: "編輯記帳",
        })[table] || "編輯";

        this.editing = { table, mode:"update", title, row: clone, showDelete:false };
      },

      closeEdit(){
        this.editing = null;
      },

      toggleDelete(){
        if (!this.editing) return;
        this.editing.showDelete = !this.editing.showDelete;
      },

      dayIdByNo(dayNo){
        const n = Number(dayNo);
        const d = this.days.find(x => Number(x.day_no) === n);
        return d ? d.id : null;
      },

      async saveEdit(){
        if (!this.editing) return;
        const { table } = this.editing;
        const row = this.editing.row || {};

        this.loading = true;
        this.lastError = null;

        try{
          const payload = { ...row };
          delete payload.created_at;
          delete payload.updated_at;

          if (table === "plan_items"){
            // convert day_no -> day_id
            const dayId = this.dayIdByNo(payload.day_no);
            if (!dayId) throw new Error("Day number 不存在，請先新增 Day。");
            payload.day_id = dayId;
            delete payload.day_no;

            // convert period -> time_label (存入 DB)
            payload.time_label = ({ am:"上午", pm:"下午", night:"晚上" }[payload.period] || "上午");
            delete payload.period;

            // Hide order_no from UI; still keep stable ordering:
            // If insert and no order_no, auto append to end within day+period bucket.
            if (!payload.id){
              const within = this.planItems
                .filter(x => x.day_id === payload.day_id && periodKey(x.time_label) === periodKey(payload.time_label))
                .map(x => x.order_no || 0);
              const max = within.length ? Math.max(...within) : 0;
              payload.order_no = max + 1;
            }
          }

          if (table === "expenses"){
            const dayId = this.dayIdByNo(payload.day_no);
            if (!dayId) throw new Error("Day number 不存在，請先新增 Day。");
            payload.day_id = dayId;
            delete payload.day_no;
          }

          if (table === "shopping_items"){
            payload.done = !!payload.done;
          }

          const client = getSb();
          const { error } = await client.from(table).upsert(payload);
          if (error) throw error;

          this.statusText = "saved";
          this.closeEdit();
          await this.loadAll();
        } catch(e){
          this.setErr(e);
        } finally {
          this.loading = false;
        }
      },

      async delRow(table, id){
        if (!id) return;
        this.loading = true;
        this.lastError = null;
        try{
          const client = getSb();
          const { error } = await client.from(table).delete().eq("id", id);
          if (error) throw error;
          this.statusText = "deleted";
          this.closeEdit();
          await this.loadAll();
        } catch(e){
          this.setErr(e);
        } finally {
          this.loading = false;
        }
      },

      // Shopping checkbox quick update
      async toggleShopDone(item){
        try{
          const client = getSb();
          const { error } = await client.from("shopping_items").upsert({ id: item.id, done: !item.done });
          if (error) throw error;
          item.done = !item.done;
        } catch(e){
          this.setErr(e);
        }
      },

      // Map link label: use maps_query first, else title
      mapQueryFor(row){
        return (row?.maps_query || row?.title || "").trim();
      },

      mapHrefFor(row){
        const q = this.mapQueryFor(row);
        return mapsDirUrl(q);
      },

      // Flights display helpers
      flightDateLine(f){
        const d = parseDT(f?.depart_time) || parseDT(f?.arrive_time);
        const dateStr = d ? fmtDate(d) : "";
        const code = `${safeStr(f?.carrier)}${safeStr(f?.flight_no)}`.trim();
        return `${dateStr}${dateStr && code ? "  |  " : ""}${code}`;
      },

      flightTitle(f){
        const from = safeStr(f?.depart_airport || "").toUpperCase();
        const to = safeStr(f?.arrive_airport || "").toUpperCase();
        return `${from} → ${to}`.trim();
      },

      flightTimes(f){
        const a = parseDT(f?.depart_time);
        const b = parseDT(f?.arrive_time);
        return { a, b, ahm: fmtTimeHM(a), bhm: fmtTimeHM(b), dur: durHM(a,b) };
      },

      // ============
      // View switching
      // ============
      setView(v){
        this.view = v;
        // keep scroll a bit nicer on mobile
        window.scrollTo({ top: 0, behavior: "smooth" });
      },

      // Debug toggle (🛠 replaces DB YES)
      toggleDebug(){
        this.showDebug = !this.showDebug;
      },

      async reloadAll(){
        await this.ping();
        await this.loadAll();
        await this.loadWeather();
      }
    },

    async mounted(){
      await this.ping();
      await this.loadAll();
      await this.loadWeather();
    },

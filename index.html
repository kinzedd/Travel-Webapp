<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Sapporo Snow — Travel App</title>

  <!-- Vue (global build) -->
  <script src="./assets/vue.global.prod.js"></script>

  <!-- Supabase JS v2 (UMD global: window.supabase) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{
      --bg:#0b1220;
      --card: rgba(255,255,255,.07);
      --card2: rgba(255,255,255,.05);
      --line: rgba(255,255,255,.10);
      --line2: rgba(255,255,255,.14);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.68);
      --ok: #bfffd1;
      --danger: #ffb4b4;
      --shadow: 0 18px 40px rgba(0,0,0,.45);
      --r: 22px;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, "PingFang HK", "Noto Sans TC", "Microsoft JhengHei", Arial;
      color:var(--text);
      background: var(--bg);
      overflow-x:hidden;
    }

    /* bg.jpg at repo root (not /assets) */
    body::before{
      content:"";
      position:fixed; inset:0;
      background:
        radial-gradient(1200px 600px at 30% 10%, rgba(61,130,255,.18), transparent 55%),
        radial-gradient(1000px 700px at 70% 40%, rgba(0,255,190,.08), transparent 60%),
        url("./bg.jpg") center/cover no-repeat;
      filter:saturate(1.05) contrast(1.05);
      opacity:.92;
      z-index:-2;
    }
    body::after{
      content:"";
      position:fixed; inset:0;
      background: linear-gradient(to bottom, rgba(11,18,32,.72), rgba(11,18,32,.85));
      z-index:-1;
    }

    a{ color:inherit; text-decoration:none; }

    .wrap{
      max-width: 520px;
      margin: 0 auto;
      padding: 14px 12px 110px; /* bottom bar space */
    }

    .card{
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--r);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .header{
      padding: 14px;
      display:flex;
      gap:12px;
      align-items:flex-start;
      justify-content:space-between;
    }
    .kicker{
      letter-spacing:.28em;
      font-size:12px;
      color:var(--muted);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width: 62vw;
    }
    .appTitle{
      font-weight:900;
      font-size:44px;
      line-height: .95;
      margin-top:6px;
    }
    .subTitle{
      color:var(--muted);
      font-weight:600;
      margin-top:6px;
      letter-spacing:.06em;
    }
    .headerRight{
      display:flex;
      flex-direction:column;
      gap:10px;
      align-items:flex-end;
      min-width: 110px;
    }

    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--line2);
      background: rgba(255,255,255,.06);
      backdrop-filter: blur(10px);
      font-weight:700;
      color: rgba(255,255,255,.86);
      white-space:nowrap;
    }
    .pill.ok{ border-color: rgba(191,255,209,.35); color: var(--ok); }
    .pill.bad{ border-color: rgba(255,180,180,.35); color: var(--danger); }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid var(--line2);
      background: rgba(255,255,255,.06);
      cursor:pointer;
      user-select:none;
      font-weight:800;
    }
    .btn:active{ transform: translateY(1px); }
    .btn.small{ padding:8px 12px; font-weight:800; }
    .btn.ghost{ background: rgba(0,0,0,.10); }

    .grid2{ display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
    .muted{ color:var(--muted); }
    .mono{ font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }

    /* Top actions */
    .topActions{
      margin-top: 10px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    /* Day slider */
    .section{
      margin-top: 12px;
      padding: 12px;
    }
    .sectionTitleRow{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom: 10px;
    }
    .sectionTitle{
      font-weight:900;
      font-size:22px;
      letter-spacing:.05em;
    }

    .dayRail{
      display:flex;
      gap:10px;
      overflow:auto;
      padding-bottom: 6px;
      scroll-snap-type: x mandatory;
    }
    .dayRail::-webkit-scrollbar{ height: 6px; }
    .dayRail::-webkit-scrollbar-thumb{ background: rgba(255,255,255,.16); border-radius:999px; }

    .dayCard{
      flex: 0 0 auto;
      width: 235px;            /* keep thin + stable */
      padding: 10px 12px;      /* thin */
      border-radius: 18px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.05);
      scroll-snap-align: start;
      display:flex;
      flex-direction:column;
      gap:8px;
      position:relative;
      min-height: 86px;
    }
    .dayCard.active{
      border-color: rgba(191,255,209,.40);
      background: rgba(191,255,209,.06);
    }
    .dayTop{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }
    .dayTag{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.12);
      font-weight:900;
      min-width: 68px;
      justify-content:center;
    }
    .dayDate{
      font-weight:900;
      font-size: 20px;
      letter-spacing:.04em;
      color: rgba(255,255,255,.82);
    }
    .dayName{
      font-weight:900;
      font-size: 22px;
      line-height:1.12;
      overflow:hidden;
      display:-webkit-box;
      -webkit-line-clamp:2;
      -webkit-box-orient:vertical;
    }

    .iconBtn{
      width: 36px;
      height: 36px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.12);
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      flex:0 0 auto;
    }
    .iconBtn:active{ transform: translateY(1px); }
    .penSvg{ width:16px; height:16px; opacity:.92; }

    /* Period blocks */
    .periodCard{
      margin-top: 10px;
      padding: 12px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.10);
    }
    .periodHead{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom: 10px;
    }
    .periodTitle{
      font-weight:950;
      font-size: 22px;
      letter-spacing:.08em;
    }
    .periodBtns{
      display:flex;
      gap:10px;
      align-items:center;
    }

    /* Items */
    .itemCard{
      padding: 12px 12px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.06);
      margin-top: 10px;
      position:relative;
      overflow:hidden;
    }
    .itemTop{
      display:flex;
      gap:10px;
      align-items:flex-start;
      justify-content:space-between;
    }
    .itemEmoji{
      font-size: 18px;
      line-height: 1;
      margin-top: 2px;
      width: 22px;
      text-align:center;
      flex:0 0 auto;
    }
    .itemMain{
      flex:1;
      min-width:0;
    }
    .itemTitle{
      font-weight:950;
      font-size: 22px;
      line-height:1.15;
      word-break: break-word;
    }
    .itemNote{
      margin-top: 8px;
      color: rgba(255,255,255,.72);
      white-space: pre-wrap;
      line-height:1.35;
    }
    .itemMeta{
      margin-top: 8px;
      color: rgba(255,255,255,.62);
      font-size: 12px;
    }

    .linkHint{
      margin-top:8px;
      display:inline-flex;
      gap:8px;
      align-items:center;
      padding:6px 10px;
      border-radius:999px;
      border:1px dashed rgba(255,255,255,.18);
      color: rgba(255,255,255,.78);
      font-weight:800;
      font-size: 12px;
      max-width: 100%;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    /* Flights */
    .flightWrap{ display:flex; flex-direction:column; gap:12px; margin-top:10px; }
    .flightCard{
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 22px;
      padding: 14px;
      position:relative;
      overflow:hidden;
    }
    .flightTop{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      color: rgba(255,255,255,.78);
      font-weight:900;
    }
    .flightRoute{
      margin-top: 8px;
      font-size: 26px;
      font-weight: 950;
      letter-spacing:.03em;
    }
    .flightRow{
      margin-top: 12px;
      display:grid;
      grid-template-columns: 1fr 34px 1fr;
      align-items:center;
      gap:10px;
    }
    .airport{
      font-weight: 950;
      font-size: 26px;
    }
    .time{
      font-weight: 950;
      font-size: 40px;
      letter-spacing:.02em;
    }
    .terminal{
      margin-top: 4px;
      color: rgba(255,255,255,.70);
      font-weight:800;
    }
    .planeLine{
      position:relative;
      height: 4px;
      background: rgba(255,255,255,.18);
      border-radius:999px;
    }
    .planeLine::after{
      content:"";
      position:absolute;
      right: -2px;
      top:50%;
      transform: translateY(-50%);
      width: 10px; height: 10px;
      border-radius:999px;
      background: rgba(255,255,255,.22);
    }
    .plane{
      font-size: 22px;
      position:absolute;
      left: 10px;
      top:50%;
      transform: translateY(-55%);
      filter: drop-shadow(0 10px 12px rgba(0,0,0,.45));
    }

    /* Expenses */
    .list{ display:flex; flex-direction:column; gap:10px; margin-top:10px; }
    .expRow{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
    }
    .expTitle{
      font-weight:950;
      font-size: 18px;
      line-height:1.2;
    }

    /* Shopping */
    .shopRow{
      display:flex;
      align-items:flex-start;
      gap:10px;
    }
    .chk{
      width: 22px; height: 22px;
      accent-color: #9ef6c2;
      margin-top: 3px;
      flex:0 0 auto;
    }
    .strike{
      text-decoration: line-through;
      opacity:.55;
    }

    /* Bottom nav */
    .bottomBar{
      position:fixed;
      left:0; right:0;
      bottom: 0;
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
      z-index: 50;
    }
    .bottomInner{
      max-width: 520px;
      margin: 0 auto;
      display:grid;
      grid-template-columns: repeat(4, 1fr);
      gap:10px;
      padding: 10px;
      border-radius: 22px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }
    .navBtn{
      padding: 10px 8px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.10);
      display:flex;
      flex-direction:column;
      gap:6px;
      align-items:center;
      justify-content:center;
      font-weight:900;
      cursor:pointer;
      user-select:none;
      min-height: 62px;
    }
    .navBtn.active{
      background: rgba(191,255,209,.10);
      border-color: rgba(191,255,209,.38);
    }
    .navEmoji{ font-size: 20px; }
    .navText{ font-size: 13px; opacity:.9; }

    /* Modal */
    .modalMask{
      position:fixed;
      inset:0;
      background: rgba(0,0,0,.55);
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 14px;
      z-index: 80;
    }
    .modal{
      width: min(520px, 96vw);
      max-height: 86vh;
      overflow:auto;
      border-radius: 22px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(18,24,40,.78);
      backdrop-filter: blur(14px);
      box-shadow: var(--shadow);
      padding: 14px;
    }
    .modalHead{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom: 10px;
    }
    .modalTitle{
      font-weight:950;
      font-size: 20px;
      letter-spacing:.06em;
    }
    .field{
      display:flex;
      flex-direction:column;
      gap:6px;
      margin-top: 10px;
    }
    label{
      color: rgba(255,255,255,.76);
      font-weight:900;
      font-size: 13px;
      letter-spacing:.04em;
    }
    input, textarea, select{
      width:100%;
      padding: 12px 12px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.18);
      color: var(--text);
      outline:none;
      font-size: 16px;
    }
    textarea{ min-height: 110px; resize: vertical; }
    .modalBtns{
      display:flex;
      gap:10px;
      margin-top: 14px;
      flex-wrap:wrap;
    }
    .dangerBtn{
      border-color: rgba(255,180,180,.35);
      color: var(--danger);
    }

    /* Debug drawer */
    .debugFab{
      position:fixed;
      right: 12px;
      top: 12px;
      z-index: 70;
      display:flex;
      gap:10px;
      align-items:center;
    }
    .tinyFab{
      width: 44px;
      height: 44px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.18);
      backdrop-filter: blur(10px);
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      box-shadow: 0 12px 30px rgba(0,0,0,.35);
    }
    .debugDrawer{
      position:fixed;
      right: 12px;
      top: 62px;
      width: min(360px, calc(100vw - 24px));
      max-height: 70vh;
      overflow:auto;
      z-index: 70;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(12,16,28,.82);
      backdrop-filter: blur(14px);
      box-shadow: var(--shadow);
      padding: 12px;
    }
    .debugRow{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      padding: 8px 10px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.08);
      background: rgba(255,255,255,.05);
      margin-top: 8px;
      font-weight:900;
    }

    /* Keep layout not too narrow on mobile */
    @media (max-width: 360px){
      .appTitle{ font-size: 40px; }
      .dayCard{ width: 220px; }
      .time{ font-size: 36px; }
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <script>
  (() => {
    const { createApp } = Vue;

    // ============
    // Supabase config
    // ============
    const SUPABASE_URL = "https://qvogojdyykgotuitjkhj.supabase.co";
    const SUPABASE_KEY = "sb_publishable_9rQ7sJQ3bZ_uhnT2hxRUKQ_MJv1icIF";

    const sb = window.supabase?.createClient?.(SUPABASE_URL, SUPABASE_KEY);
    if (!sb) console.error("Supabase init failed: window.supabase missing?");

    const safeStr = (v) => (v == null ? "" : String(v));

    // ===== Weather (Open-Meteo) =====
    async function fetchWeather(lat, lon){
      try{
        // current weather + windspeed
        const url =
          "https://api.open-meteo.com/v1/forecast"
          + "?latitude=" + encodeURIComponent(lat)
          + "&longitude=" + encodeURIComponent(lon)
          + "&current=temperature_2m,wind_speed_10m,weather_code"
          + "&timezone=Asia%2FHong_Kong";
        const r = await fetch(url);
        const j = await r.json();
        const c = j?.current || null;
        return {
          ok: !!c,
          lat, lon,
          temp: c?.temperature_2m,
          wind: c?.wind_speed_10m,
          code: c?.weather_code
        };
      }catch(e){
        return { ok:false, lat, lon, err: e?.message || String(e) };
      }
    }

    function wEmoji(code){
      // simple mapping
      if (code == null) return "⛅️";
      const c = Number(code);
      if ([0].includes(c)) return "☀️";
      if ([1,2,3].includes(c)) return "⛅️";
      if ([45,48].includes(c)) return "🌫️";
      if ([51,53,55,56,57].includes(c)) return "🌦️";
      if ([61,63,65,66,67].includes(c)) return "🌧️";
      if ([71,73,75,77,85,86].includes(c)) return "🌨️";
      if ([80,81,82].includes(c)) return "🌧️";
      if ([95,96,99].includes(c)) return "⛈️";
      return "⛅️";
    }

    function toHHMM(isoOrText){
      if(!isoOrText) return "";
      // if it looks like "2026-01-08 02:00:00+08" or ISO
      const s = String(isoOrText);
      const m = s.match(/(\d{2}):(\d{2})/);
      return m ? (m[1] + ":" + m[2]) : s;
    }

    function toYMD(isoOrText){
      if(!isoOrText) return "";
      const s = String(isoOrText);
      const m = s.match(/(\d{4})-(\d{2})-(\d{2})/);
      return m ? (m[1]+"-"+m[2]+"-"+m[3]) : s;
    }

    function mapLink(q){
      const dest = encodeURIComponent(q || "");
      // origin=current location
      return "https://www.google.com/maps/dir/?api=1&origin=Current+Location&destination=" + dest;
    }

    function inferPeriod(timeLabel){
      const t = String(timeLabel || "").toLowerCase();
      // allow common tags
      if (t.includes("上午") || t.includes("早") || t.includes("morning") || t.includes("淩晨")) return "am";
      if (t.includes("下午") || t.includes("午") || t.includes("pm") || t.includes("中午")) return "pm";
      if (t.includes("晚上") || t.includes("夜") || t.includes("night")) return "night";
      // default
      return "am";
    }

    function kindType(kind){
      // your schema: plan_items.kind text
      const k = String(kind || "").toLowerCase();
      if (k === "food" || k.includes("meal")) return "meal";
      if (k === "wear" || k.includes("cloth")) return "wear";
      return "dest";
    }

    function itemEmoji(item){
      const t = kindType(item?.kind);
      if (t === "meal") return "🍽️";
      if (t === "wear") return "👕";
      return "📍"; // destination
    }

    // ============
    // App
    // ============
    createApp({
      data(){
        return {
          view: "plan", // plan | flights | expenses | shopping

          connected: false,
          statusText: "ready",
          lastError: null,
          loading: false,

          // weather
          weather: { ok:false, temp:null, wind:null, code:null, lat:null, lon:null },

          // data from DB
          days: [],
          selectedDayId: null,
          planItems: [],
          flights: [],
          expenses: [],
          shopping: [],

          // edit
          editing: null,   // { table, mode, row, uiTitle }
          showDelete: false,

          // debug
          debugOpen: false,
        };
      },

      computed:{
        selectedDay(){
          return this.days.find(d => d.id === this.selectedDayId) || null;
        },

        // plan items for selected day, sorted
        planForDay(){
          if(!this.selectedDayId) return [];
          return (this.planItems || [])
            .filter(x => x.day_id === this.selectedDayId)
            .sort((a,b) => (a.order_no ?? 0) - (b.order_no ?? 0));
        },

        // group by period, and apply rules:
        // - destination can be many
        // - meal only keep ONE per period (lowest order_no)
        planGroups(){
          const rows = this.planForDay;
          const by = { am:[], pm:[], night:[], wear:[] };

          for(const x of rows){
            const t = kindType(x.kind);
            if(t === "wear"){
              by.wear.push(x);
            }else{
              const p = inferPeriod(x.time_label);
              by[p].push(x);
            }
          }

          // ensure meal single per period
          for(const key of ["am","pm","night"]){
            const arr = by[key];
            const meals = arr.filter(x => kindType(x.kind)==="meal");
            if(meals.length > 1){
              meals.sort((a,b)=> (a.order_no??0)-(b.order_no??0));
              const keep = meals[0]?.id;
              by[key] = arr.filter(x => kindType(x.kind)!=="meal" || x.id === keep);
            }
            // destinations first then meal
            by[key].sort((a,b)=>{
              const ta = kindType(a.kind)==="dest" ? 0 : (kindType(a.kind)==="meal" ? 1 : 2);
              const tb = kindType(b.kind)==="dest" ? 0 : (kindType(b.kind)==="meal" ? 1 : 2);
              if(ta !== tb) return ta - tb;
              return (a.order_no??0)-(b.order_no??0);
            });
          }

          // wear keep order
          by.wear.sort((a,b)=> (a.order_no??0)-(b.order_no??0));
          return by;
        }
      },

      methods:{
        setErr(e){
          this.lastError = (e && (e.message || e.error_description)) ? e : { message: String(e) };
          this.statusText = "ERR: " + safeStr(this.lastError.message || this.lastError);
          console.error(e);
        },

        // -------- DB loading --------
        async ping(){
          try{
            const { error, status } = await sb
              .from("days")
              .select("id,day_no")
              .limit(1);
            if(error) throw error;
            this.connected = true;
            this.statusText = "DB OK (" + status + ")";
          }catch(e){
            this.connected = false;
            this.setErr(e);
          }
        },

        async loadAll(){
          this.loading = true;
          this.lastError = null;
          this.statusText = "loading...";
          try{
            const qDays = await sb
              .from("days")
              .select("id,day_no,date,title,note,sort_order,created_at,updated_at")
              .order("day_no", { ascending:true });
            if(qDays.error) throw qDays.error;
            this.days = qDays.data || [];
            if(!this.selectedDayId && this.days.length) this.selectedDayId = this.days[0].id;

            const qPlan = await sb
              .from("plan_items")
              .select("id,day_id,time_label,kind,title,note,maps_query,order_no,created_at,updated_at")
              .order("order_no", { ascending:true });
            if(qPlan.error) throw qPlan.error;
            this.planItems = qPlan.data || [];

            const qFlights = await sb
              .from("flights")
              .select("id,seg_no,flight_no,carrier,depart_airport,arrive_airport,depart_time,arrive_time,note,created_at,updated_at")
              .order("seg_no", { ascending:true });
            if(qFlights.error) throw qFlights.error;
            this.flights = qFlights.data || [];

            const qExp = await sb
              .from("expenses")
              .select("id,day_id,happened_on,category,merchant,amount,currency,paid_by,note,created_at,updated_at")
              .order("happened_on", { ascending:true });
            if(qExp.error) throw qExp.error;
            this.expenses = qExp.data || [];

            const qShop = await sb
              .from("shopping_items")
              .select("id,name,location,price_text,note,done,order_no,created_at,updated_at")
              .order("order_no", { ascending:true });
            if(qShop.error) throw qShop.error;
            this.shopping = qShop.data || [];

            this.connected = true;
            this.statusText = "loaded";
          }catch(e){
            this.connected = false;
            this.setErr(e);
          }finally{
            this.loading = false;
          }
        },

        // -------- Editing --------
        openNew(table, extra){
          this.showDelete = false;

          const blank = {
            days: { day_no: 1, date: "", title: "", note: "", sort_order: 1 },
            plan_items: { day_no_input: this.selectedDay?.day_no || 1, time_label: "上午", kind:"activity", title:"", note:"", maps_query:"" },
            flights: { seg_no: 1, flight_no:"", carrier:"", depart_airport:"", arrive_airport:"", depart_time:"", arrive_time:"", note:"" },
            expenses: { day_no_input: this.selectedDay?.day_no || 1, happened_on:"", category:"", merchant:"", amount:null, currency:"JPY", paid_by:"", note:"" },
            shopping_items: { name:"", location:"", price_text:"", note:"", done:false }
          }[table] || {};

          const row = Object.assign({}, blank, extra || {});
          this.editing = { table, mode:"insert", row, uiTitle: this.uiTitleFor(table, "insert") };
        },

        openEdit(table, row){
          this.showDelete = false;

          // copy row but replace day_id with day_no_input for UX (plan_items/expenses)
          const r = JSON.parse(JSON.stringify(row || {}));
          if(table === "plan_items" || table === "expenses"){
            const d = this.days.find(x => x.id === r.day_id);
            r.day_no_input = d ? d.day_no : "";
          }
          this.editing = { table, mode:"update", row: r, uiTitle: this.uiTitleFor(table, "update") };
        },

        uiTitleFor(table, mode){
          const m = mode === "insert" ? "新增" : "編輯";
          if(table === "days") return m + " Day";
          if(table === "plan_items") return m + " 行程";
          if(table === "flights") return m + " 航程";
          if(table === "expenses") return m + " 記帳";
          if(table === "shopping_items") return m + " 購物";
          return m;
        },

        closeEdit(){
          this.editing = null;
          this.showDelete = false;
        },

        toggleDelete(){
          this.showDelete = !this.showDelete;
        },

        async saveEdit(){
          if(!this.editing) return;
          const { table } = this.editing;

          this.loading = true;
          this.lastError = null;

          try{
            const payload = Object.assign({}, this.editing.row);

            // remove server timestamps
            delete payload.created_at;
            delete payload.updated_at;

            // Convert day_no_input -> day_id for plan_items / expenses
            if(table === "plan_items" || table === "expenses"){
              const dayNo = Number(payload.day_no_input);
              const dayRow = this.days.find(d => Number(d.day_no) === dayNo);
              if(!dayRow) throw new Error("搵唔到 Day " + payload.day_no_input + "（請先新增該 Day）");
              payload.day_id = dayRow.id;
              delete payload.day_no_input;
            }

            // Auto order_no for plan_items (hide from UI)
            if(table === "plan_items"){
              // keep existing order_no on update
              if(!payload.id){
                const max = this.planForDay.reduce((m,x)=> Math.max(m, x.order_no || 0), 0);
                payload.order_no = max + 1;
              }
            }

            // For shopping insert: set order_no to bottom
            if(table === "shopping_items"){
              if(!payload.id){
                const max = (this.shopping || []).reduce((m,x)=> Math.max(m, x.order_no || 0), 0);
                payload.order_no = max + 1;
              }
              payload.done = !!payload.done;
            }

            const { error } = await sb.from(table).upsert(payload);
            if(error) throw error;

            this.statusText = "saved";
            this.closeEdit();
            await this.loadAll();
          }catch(e){
            this.setErr(e);
          }finally{
            this.loading = false;
          }
        },

        async delEditing(){
          if(!this.editing) return;
          const { table } = this.editing;
          const id = this.editing.row?.id;
          if(!id) return;

          this.loading = true;
          this.lastError = null;
          try{
            const { error } = await sb.from(table).delete().eq("id", id);
            if(error) throw error;
            this.statusText = "deleted";
            this.closeEdit();
            await this.loadAll();
          }catch(e){
            this.setErr(e);
          }finally{
            this.loading = false;
          }
        },

        // Day click
        selectDay(id){
          this.selectedDayId = id;
        },

        // Add buttons in period
        addDest(period){
          this.openNew("plan_items", { time_label: this.periodLabel(period), kind:"activity" });
        },
        addMeal(period){
          this.openNew("plan_items", { time_label: this.periodLabel(period), kind:"food" });
        },

        periodLabel(p){
          if(p==="am") return "上午";
          if(p==="pm") return "下午";
          if(p==="night") return "晚上";
          return "上午";
        },

        // Open maps
        openMaps(item){
          const q = item?.maps_query || item?.title || "";
          if(!q) return;
          window.open(mapLink(q), "_blank");
        },

        // Shopping toggle done directly
        async toggleShopDone(row){
          try{
            const newVal = !row.done;
            const { error } = await sb.from("shopping_items").update({ done: newVal }).eq("id", row.id);
            if(error) throw error;
            row.done = newVal;
          }catch(e){
            this.setErr(e);
          }
        },

        // Weather init
        initWeather(){
          if(!navigator.geolocation){
            // fallback HK
            this.weather = { ok:false, lat:22.28, lon:114.19, temp:null, wind:null, code:null };
            this.refreshWeather();
            return;
          }
          navigator.geolocation.getCurrentPosition(
            (pos) => {
              const lat = pos.coords.latitude;
              const lon = pos.coords.longitude;
              this.weather = { ok:false, lat, lon, temp:null, wind:null, code:null };
              this.refreshWeather();
            },
            () => {
              // fallback HK
              this.weather = { ok:false, lat:22.28, lon:114.19, temp:null, wind:null, code:null };
              this.refreshWeather();
            },
            { enableHighAccuracy:false, timeout:5000, maximumAge: 60000 }
          );
        },

        async refreshWeather(){
          if(this.weather?.lat == null || this.weather?.lon == null) return;
          const w = await fetchWeather(this.weather.lat, this.weather.lon);
          this.weather = Object.assign({}, this.weather, w);
        },

        // Simple format for flight card
        flightTitle(f){
          const ymd = toYMD(f.depart_time) || toYMD(f.arrive_time) || "";
          const fn = (safeStr(f.carrier) + safeStr(f.flight_no)).trim();
          return (ymd ? (ymd + "  |  ") : "") + (fn || "Flight");
        },

        // Debug toggle
        toggleDebug(){
          this.debugOpen = !this.debugOpen;

        // icons
        penSvg(){

            <svg class="penSvg" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 20h9"/>
              <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>
            </svg>
          `;
        },
      },

                <div class="grid2">
                  <div class="field">
                    <label>Day（輸入 day number）</label>
                    <input type="number" v-model.number="editing.row.day_no_input" />
                  </div>
                  <div class="field">
                    <label>時段</label>
                    <select v-model="editing.row.time_label">
                      <option value="上午">上午</option>
                      <option value="下午">下午</option>
                      <option value="晚上">晚上</option>
                      <option value="衣著">衣著</option>
                      <option value="淩晨">淩晨</option>
                    </select>
                  </div>
                </div>

                <div class="grid2">
                  <div class="field">
                    <label>類型</label>
                    <select v-model="editing.row.kind">
                      <option value="activity">行程（Destination）</option>
                      <option value="food">用餐（Meal）</option>
                      <option value="wear">衣著</option>
                      <option value="transport">交通</option>
                      <option value="hotel">酒店</option>
                    </select>
                  </div>
                  <div class="field">
                    <label>Google Map 搜尋字（可留空）</label>
                    <input placeholder="例如 札幌 PARCO / 北海道神宮" v-model="editing.row.maps_query" />
                  </div>
                </div>

                <div class="field">
                  <label>內容</label>
                  <input v-model="editing.row.title" />
                </div>

                <div class="field">
                  <label>備註</label>
                  <textarea v-model="editing.row.note"></textarea>
                </div>
              </template>

              <!-- FLIGHTS -->
              <template v-else-if="editing.table==='flights'">
                <div class="grid2">
                  <div class="field">
                    <label>Segment</label>
                    <input type="number" v-model.number="editing.row.seg_no" />
                  </div>
                  <div class="field">
                    <label>航空公司 / 航班</label>
                    <div class="grid2" style="gap:10px;">
                      <input placeholder="CX" v-model="editing.row.carrier" />
                      <input placeholder="581" v-model="editing.row.flight_no" />
                    </div>
                  </div>
                </div>

                <div class="grid2">
                  <div class="field">
                    <label>出發機場</label>
                    <input placeholder="HKG" v-model="editing.row.depart_airport" />
                  </div>
                  <div class="field">
                    <label>到達機場</label>
                    <input placeholder="CTS" v-model="editing.row.arrive_airport" />
                  </div>
                </div>

                <div class="grid2">
                  <div class="field">
                    <label>出發時間</label>
                    <input placeholder="2026-01-08 02:00:00+08" v-model="editing.row.depart_time" />
                  </div>
                  <div class="field">
                    <label>到達時間</label>
                    <input placeholder="2026-01-08 07:05:00+09" v-model="editing.row.arrive_time" />
                  </div>
                </div>

                <div class="field">
                  <label>備註</label>
                  <textarea v-model="editing.row.note"></textarea>
                </div>
              </template>

              <!-- EXPENSES -->
              <template v-else-if="editing.table==='expenses'">
                <div class="grid2">
                  <div class="field">
                    <label>Day（輸入 day number）</label>
                    <input type="number" v-model.number="editing.row.day_no_input" />
                  </div>
                  <div class="field">
                    <label>日期</label>
                    <input placeholder="YYYY-MM-DD" v-model="editing.row.happened_on" />
                  </div>
                </div>

                <div class="grid2">
                  <div class="field">
                    <label>分類</label>
                    <input v-model="editing.row.category" />
                  </div>
                  <div class="field">
                    <label>商戶</label>
                    <input v-model="editing.row.merchant" />
                  </div>
                </div>

                <div class="grid2">
                  <div class="field">
                    <label>金額</label>
                    <input type="number" step="0.01" v-model.number="editing.row.amount" />
                  </div>
                  <div class="field">
                    <label>幣種</label>
                    <input v-model="editing.row.currency" />
                  </div>
                </div>

                <div class="field">
                  <label>付款人（可留空）</label>
                  <input v-model="editing.row.paid_by" />
                </div>

                <div class="field">
                  <label>備註</label>
                  <textarea v-model="editing.row.note"></textarea>
                </div>
              </template>

              <!-- SHOPPING -->
              <template v-else-if="editing.table==='shopping_items'">
                <div class="field">
                  <label>物品</label>
                  <input v-model="editing.row.name" />
                </div>
                <div class="grid2">
                  <div class="field">
                    <label>地點（可留空）</label>
                    <input v-model="editing.row.location" />
                  </div>
                  <div class="field">
                    <label>價錢（文字）</label>
                    <input v-model="editing.row.price_text" />
                  </div>
                </div>
                <div class="field">
                  <label>備註</label>
                  <textarea v-model="editing.row.note"></textarea>
                </div>
                <div class="muted" style="margin-top:10px;">
                  * done 用清單上的 ✅ 直接勾選（唔需要喺呢度改）
                </div>
              </template>

              <div class="modalBtns">
                <div class="btn" @click="saveEdit()">{{ loading ? '儲存中...' : '儲存' }}</div>
                <div class="btn ghost" @click="closeEdit()">取消</div>
                <div v-if="showDelete && editing.row.id" class="btn dangerBtn" @click="delEditing()">刪除</div>
              </div>
            </div>
          </div>
        </div>

        <!-- Bottom nav -->
        <div class="bottomBar">
          <div class="bottomInner">
            <div class="navBtn" :class="{active:view==='plan'}" @click="view='plan'">
              <div class="navEmoji">🗺️</div>
              <div class="navText">行程</div>
            </div>
            <div class="navBtn" :class="{active:view==='flights'}" @click="view='flights'">
              <div class="navEmoji">✈️</div>
              <div class="navText">航程</div>
            </div>
            <div class="navBtn" :class="{active:view==='expenses'}" @click="view='expenses'">
              <div class="navEmoji">💴</div>
              <div class="navText">記帳</div>
            </div>
            <div class="navBtn" :class="{active:view==='shopping'}" @click="view='shopping'">
              <div class="navEmoji">🛍️</div>
              <div class="navText">購物</div>
            </div>
          </div>
        </div>
      `
    })
    .mount("#app");
  })();
  </script>
  <script>
  (function () {
    const box = document.createElement('div');
    box.style.cssText = `
      position:fixed; top:10px; left:10px; right:10px; z-index:99999;
      padding:10px 12px; border-radius:14px;
      background:rgba(120,0,0,.65); color:#fff;
      font:12px/1.35 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono","Courier New", monospace;
      white-space:pre-wrap; display:none;
      backdrop-filter: blur(10px);
    `;
    document.body.appendChild(box);

    function show(msg){
      box.style.display = 'block';
      box.textContent = msg;
    }

    window.addEventListener('error', (e) => {
      show('JS ERROR:\\n' + (e.message || e.error || e));
    });

    window.addEventListener('unhandledrejection', (e) => {
      show('PROMISE REJECT:\\n' + (e.reason?.message || e.reason || e));
    });
  })();
</script>
</body>
</html>

<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Sapporo Snow — Travel App</title>

  <link rel="stylesheet" href="./assets/app.css" />
  <script src="./assets/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{
      --bg:#0b1220;
      --card: rgba(255,255,255,.06);
      --card2: rgba(255,255,255,.04);
      --stroke: rgba(255,255,255,.10);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.70);
      --ok: rgba(191,255,209,.95);
      --danger: rgba(255,180,180,.95);
      --shadow: 0 18px 60px rgba(0,0,0,.55);
      --radius: 22px;
      --radius2: 18px;
    }
    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      color:var(--text);
      background: var(--bg);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      overflow-x:hidden;
    }

    /* bg.jpg is OUTSIDE assets folder */
    body::before{
      content:"";
      position:fixed; inset:0;
      background:
        radial-gradient(1200px 800px at 20% 10%, rgba(54,130,255,.18), transparent 60%),
        radial-gradient(900px 700px at 80% 0%, rgba(0,255,210,.10), transparent 55%),
        radial-gradient(900px 800px at 20% 100%, rgba(255,255,255,.10), transparent 60%),
        url("./bg.jpg");
      background-size: cover;
      background-position: center;
      opacity:.55;
      z-index:-2;
    }
    body::after{
      content:"";
      position:fixed; inset:0;
      background: linear-gradient(180deg, rgba(11,18,32,.70), rgba(11,18,32,.92));
      z-index:-1;
    }

    a{ color:inherit; text-decoration:none; }
    .muted{ color:var(--muted); }
    .mono{ font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono","Courier New", monospace; font-size:12px; }
    .btn{ cursor:pointer; user-select:none; -webkit-tap-highlight-color: transparent; }
    .btn:active{ transform: translateY(1px); }

    .wrap{
      max-width: 560px;
      margin: 0 auto;
      padding: 14px 14px 110px;
    }

    .card{
      background: var(--card);
      border:1px solid var(--stroke);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }
    .cardInner{
      background: var(--card2);
      border:1px solid rgba(255,255,255,.08);
      border-radius: var(--radius2);
    }

    .header{ padding:14px; }
    .kicker{
      letter-spacing:.26em; font-size:12px;
      color: rgba(255,255,255,.62);
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .titleRow{ display:flex; align-items:flex-start; gap:12px; margin-top:8px; }
    .appTitle{ font-weight:900; font-size:44px; line-height:.95; }
    .subTitle{ margin-top:10px; font-weight:700; color: rgba(255,255,255,.72); font-size:18px; }

    .headerRight{
      margin-left:auto; display:flex; flex-direction:column; gap:10px; align-items:flex-end;
      min-width: 160px;
    }
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:.42rem .72rem; border-radius:999px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.18);
      white-space:nowrap;
    }
    .pill.ok{ border-color: rgba(191,255,209,.35); color: var(--ok); }
    .pill.bad{ border-color: rgba(255,180,180,.35); color: var(--danger); }
    .miniBtn{
      width:40px; height:40px; border-radius:999px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.18);
      display:flex; align-items:center; justify-content:center;
    }
    .chipBtn{
      display:inline-flex; align-items:center; justify-content:center;
      padding:.55rem .85rem; border-radius:999px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      font-weight:900;
    }

    .section{ margin-top:12px; padding:12px; }
    .sectionHead{ display:flex; align-items:center; gap:10px; padding: 6px 2px 10px; }
    .sectionTitle{ font-weight:900; font-size:22px; }
    .sectionHead .right{ margin-left:auto; display:flex; gap:10px; }

    .daysSlider{
      display:flex; gap:12px; overflow-x:auto;
      padding:10px 2px 6px;
      scroll-snap-type:x mandatory;
    }
    .dayCard{
      scroll-snap-align:start;
      min-width: 200px; max-width:200px;
      padding: 10px 12px;
      border-radius:18px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.05);
    }
    .dayCard.active{
      border-color: rgba(191,255,209,.35);
      background: rgba(191,255,209,.06);
    }
    .dayTop{ display:flex; align-items:center; gap:10px; }
    .dayBadge{
      padding:.25rem .6rem; border-radius:999px;
      border:1px solid rgba(255,255,255,.14);
      font-weight:900;
    }
    .dayDate{ margin-left:auto; font-weight:800; color: rgba(255,255,255,.70); }
    .penBtn{
      width:34px; height:34px; border-radius:999px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.18);
      display:flex; align-items:center; justify-content:center;
    }
    .penBtn svg{ width:16px; height:16px; }
    .dayTitle{
      margin-top:10px; font-size:18px; font-weight:900;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }

    .periodCard{ margin-top:12px; padding:12px; }
    .periodHead{ display:flex; align-items:center; gap:10px; padding:2px 2px 10px; }
    .periodName{ font-weight:900; font-size:20px; }
    .periodHead .right{ margin-left:auto; display:flex; gap:10px; }

    .list{ display:flex; flex-direction:column; gap:10px; }
    .itemCard{
      padding:12px; border-radius:18px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.04);
    }
    .itemTop{ display:flex; align-items:flex-start; gap:10px; }
    .itemIcon{
      width:28px; height:28px; border-radius:10px;
      background: rgba(0,0,0,.18);
      border:1px solid rgba(255,255,255,.10);
      display:flex; align-items:center; justify-content:center;
      flex:0 0 auto; font-size:16px;
    }
    .itemMain{ flex:1 1 auto; min-width:0; }
    .itemTitle{ font-weight:950; font-size:18px; line-height:1.15; word-break:break-word; }
    .itemNote{ margin-top:8px; color: rgba(255,255,255,.72); white-space:pre-wrap; line-height:1.35; }
    .mapsLink{
      margin-top:8px;
      display:inline-flex; gap:8px; align-items:center;
      padding:.35rem .6rem; border-radius:999px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.16);
      font-weight:900; font-size:13px;
    }

    .toolbar{
      position:fixed; left:0; right:0; bottom:10px;
      padding:0 14px; z-index:50; pointer-events:none;
    }
    .toolbarInner{
      pointer-events:auto;
      max-width:560px; margin:0 auto;
      padding:10px; border-radius:22px;
      background: rgba(0,0,0,.22);
      border:1px solid rgba(255,255,255,.10);
      backdrop-filter: blur(14px);
      display:flex; gap:10px; justify-content:space-between;
    }
    .tabBtn{
      flex:1 1 0;
      border-radius:18px;
      padding:10px 8px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.06);
      text-align:center;
      font-weight:900;
      min-width:0;
    }
    .tabBtn.active{
      border-color: rgba(191,255,209,.35);
      background: rgba(191,255,209,.10);
    }
    .tabBtn .ico{ font-size:18px; display:block; }
    .tabBtn .lbl{ font-size:12px; opacity:.9; margin-top:4px; }

    /* Error overlay */
    .fatal{
      position:fixed; left:14px; right:14px; top:14px;
      z-index:9999;
      padding:12px;
      border-radius:14px;
      background: rgba(255,80,80,.18);
      border:1px solid rgba(255,80,80,.45);
      backdrop-filter: blur(10px);
      display:none;
    }
    .fatal .t{ font-weight:950; margin-bottom:6px; }
    .fatal pre{ margin:0; white-space:pre-wrap; color: rgba(255,255,255,.92); }

    @media (max-width: 420px){
      .appTitle{ font-size: 40px; }
      .dayCard{ min-width: 190px; max-width: 190px; }
    }
  </style>
</head>

<body>
<div id="fatal" class="fatal">
  <div class="t">JS 爆咗（請開 console 同時睇呢段）</div>
  <pre id="fatalText"></pre>
</div>

<div id="app"></div>

<script>
(() => {
  // Show runtime errors on screen (so you don't get "blank only bg")
  const fatalBox = document.getElementById("fatal");
  const fatalText = document.getElementById("fatalText");
  window.addEventListener("error", (ev) => {
    fatalBox.style.display = "block";
    fatalText.textContent = String(ev?.error?.stack || ev?.message || ev);
  });
  window.addEventListener("unhandledrejection", (ev) => {
    fatalBox.style.display = "block";
    fatalText.textContent = String(ev?.reason?.stack || ev?.reason || ev);
  });

  if (!window.Vue) throw new Error("Vue not loaded: check ./assets/vue.global.prod.js path");
  if (!window.supabase) throw new Error("Supabase not loaded: CDN blocked?");

  const { createApp } = window.Vue;

  const SUPABASE_URL = "https://qvogojdyykgotuitjkhj.supabase.co";
  const SUPABASE_KEY = "sb_publishable_9rQ7sJQ3bZ_uhnT2hxRUKQ_MJv1icIF";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const safeStr = (v) => (v == null ? "" : String(v));

  const mapsDirUrl = (query) => {
    const q = (query || "").trim();
    if (!q) return "";
    return `https://www.google.com/maps/dir/?api=1&origin=Current+Location&destination=${encodeURIComponent(q)}`;
  };

  const periodKey = (timeLabel) => {
    const s = (timeLabel || "").trim();
    if (["上午","早上","凌晨"].includes(s)) return "am";
    if (["下午","中午"].includes(s)) return "pm";
    if (["晚上","夜晚"].includes(s)) return "night";
    if (s.includes("上")) return "am";
    if (s.includes("下") || s.includes("中")) return "pm";
    if (s.includes("晚") || s.includes("夜")) return "night";
    return "am";
  };

  const isMeal = (row) => {
    const k = (row?.kind || "").toLowerCase();
    return k === "food" || k === "meal" || k === "用餐";
  };
  const isWear = (row) => {
    const k = (row?.kind || "").toLowerCase();
    return k === "wear" || k === "衣著";
  };

  createApp({
    data(){
      return {
        view: "plan",
        statusText: "ready",
        lastError: null,
        connected: false,
        loading: false,

        days: [],
        selectedDayId: null,
        planItems: [],
        flights: [],
        shopping: [],
        expenses: [],

        weather: { ok:false, temp:null, wind:null, code:null, lat:null, lon:null },

        // options (NO JSON stringify inside template)
        kindOptions: [
          { value:"activity", label:"行程" },
          { value:"food", label:"用餐" },
          { value:"wear", label:"衣著" },
          { value:"transport", label:"交通" },
          { value:"hotel", label:"酒店" },
        ],
      };
    },

    computed:{
      selectedDay(){
        return this.days.find(d => d.id === this.selectedDayId) || null;
      },
      selectedDayNo(){
        return this.selectedDay?.day_no ?? null;
      },
      selectedPlanItems(){
        if (!this.selectedDayId) return [];
        return (this.planItems || []).filter(x => x.day_id === this.selectedDayId);
      },
      wearItems(){
        return this.selectedPlanItems
          .filter(x => isWear(x))
          .sort((a,b) => (a.order_no ?? 0) - (b.order_no ?? 0));
      },
      periodGroups(){
        const base = this.selectedPlanItems.filter(x => !isWear(x));
        const groups = { am:[], pm:[], night:[] };

        for (const it of base){
          const pk = periodKey(it.time_label);
          (groups[pk] ||= []).push(it);
        }

        const out = {};
        for (const k of ["am","pm","night"]){
          const items = (groups[k] || []).slice().sort((a,b) => (a.order_no ?? 0) - (b.order_no ?? 0));
          const dest = items.filter(x => !isMeal(x));
          const meal = items.filter(x => isMeal(x));
          out[k] = { dest, meal: meal.length ? [meal[0]] : [] };
        }
        return out;
      }
    },

    methods:{
      penSvg(){
        return `
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M13.5 6.5l4 4" stroke="white" stroke-width="2" stroke-linecap="round"/>
            <path d="M4 20l4.5-1 10-10a2 2 0 0 0 0-2.8l-.7-.7a2 2 0 0 0-2.8 0l-10 10L4 20Z" stroke="white" stroke-width="2" stroke-linejoin="round"/>
          </svg>
        `;
      },

      async ping(){
        try {
          const { data, error, status } = await sb
            .from("days")
            .select("id,day_no")
            .order("day_no", { ascending:true })
            .limit(1);

          if (error) throw error;
          this.connected = true;
          this.statusText = `OK (${status})`;
          return data;
        } catch (e){
          this.connected = false;
          this.lastError = e;
          this.statusText = "ERR: " + safeStr(e?.message || e);
          return null;
        }
      },

      async loadAll(){
        this.loading = true;
        this.lastError = null;
        this.statusText = "loading...";
        try{
          const qDays = await sb
            .from("days")
            .select("id,day_no,date,title,note,sort_order,created_at,updated_at")
            .order("day_no", { ascending:true });
          if (qDays.error) throw qDays.error;
          this.days = qDays.data || [];
          if (!this.selectedDayId && this.days.length) this.selectedDayId = this.days[0].id;

          const qPlan = await sb
            .from("plan_items")
            .select("id,day_id,time_label,kind,title,note,maps_query,order_no,created_at,updated_at")
            .order("order_no", { ascending:true });
          if (qPlan.error) throw qPlan.error;
          this.planItems = qPlan.data || [];

          // Keep the other tabs not blank
          const qFlights = await sb.from("flights")
            .select("id,seg_no,flight_no,carrier,depart_airport,arrive_airport,depart_time,arrive_time,note,created_at,updated_at")
            .order("seg_no", { ascending:true });
          if (qFlights.error) throw qFlights.error;
          this.flights = qFlights.data || [];

          const qShop = await sb.from("shopping_items")
            .select("id,name,location,price_text,note,done,order_no,created_at,updated_at")
            .order("order_no", { ascending:true });
          if (qShop.error) throw qShop.error;
          this.shopping = qShop.data || [];

          const qExp = await sb.from("expenses")
            .select("id,day_id,happened_on,category,merchant,amount,currency,paid_by,note,created_at,updated_at")
            .order("happened_on", { ascending:true });
          if (qExp.error) throw qExp.error;
          this.expenses = qExp.data || [];

          this.connected = true;
          this.statusText = "loaded";
        } catch(e){
          this.connected = false;
          this.lastError = e;
          this.statusText = "ERR: " + safeStr(e?.message || e);
          console.error(e);
        } finally {
          this.loading = false;
        }
      },

      async loadWeather(){
        try{
          const fallback = { lat:22.28, lon:114.19 };

          const getPos = () => new Promise((resolve) => {
            if (!navigator.geolocation) return resolve(null);
            navigator.geolocation.getCurrentPosition(
              (p) => resolve({ lat: p.coords.latitude, lon: p.coords.longitude }),
              () => resolve(null),
              { enableHighAccuracy:false, timeout: 3500, maximumAge: 5*60*1000 }
            );
          });

          const pos = (await getPos()) || fallback;
          this.weather.lat = +pos.lat.toFixed(2);
          this.weather.lon = +pos.lon.toFixed(2);

          const url = `https://api.open-meteo.com/v1/forecast?latitude=${encodeURIComponent(pos.lat)}&longitude=${encodeURIComponent(pos.lon)}&current_weather=true&timezone=Asia%2FHong_Kong`;
          const r = await fetch(url, { cache:"no-store" });
          if (!r.ok) throw new Error("weather fetch failed");
          const j = await r.json();
          const cw = j.current_weather || null;

          this.weather.ok = !!cw;
          this.weather.temp = cw ? cw.temperature : null;
          this.weather.wind = cw ? cw.windspeed : null;
          this.weather.code = cw ? cw.weathercode : null;
        } catch(e){
          this.weather.ok = false;
        }
      },

      wEmoji(){
        const c = this.weather.code;
        if (c == null) return "☁️";
        if ([0].includes(c)) return "☀️";
        if ([1,2,3].includes(c)) return "⛅️";
        if ([45,48].includes(c)) return "🌫️";
        if ([51,53,55,61,63,65,80,81,82].includes(c)) return "🌧️";
        if ([71,73,75,85,86].includes(c)) return "❄️";
        if ([95,96,99].includes(c)) return "⛈️";
        return "☁️";
      },

      setView(v){
        this.view = v;
        window.scrollTo({ top: 0, behavior: "smooth" });
      },

      mapQueryFor(row){
        return (row?.maps_query || row?.title || "").trim();
      },
      mapHrefFor(row){
        return mapsDirUrl(this.mapQueryFor(row));
      },
    },

    async mounted(){
      await this.ping();
      await this.loadAll();
      await this.loadWeather();
    },

    template: /*html*/`
      <div class="wrap">
        <div class="card header">
          <div class="kicker">SAPPORO • SNOW • FIRST LOVE VIBE</div>

          <div class="titleRow">
            <div style="min-width:0;">
              <div class="appTitle">札幌旅行 App</div>
              <div class="subTitle">行程 / 航程 / 記帳 / 購物</div>
            </div>

            <div class="headerRight">
              <div class="pill" :class="connected ? 'ok' : 'bad'">
                {{ connected ? 'DB OK' : 'DB ERR' }}
              </div>

              <div class="pill">
                <span>{{ wEmoji() }}</span>
                <span style="font-weight:900;">
                  {{ weather.ok ? (Math.round(weather.temp) + '°C') : '--°C' }}
                </span>
                <span class="muted" style="font-size:12px;">
                  {{ weather.ok ? ('風 ' + Math.round(weather.wind) + ' km/h') : '--' }}
                </span>
              </div>

              <div class="pill muted mono">
                ({{ weather.lat ?? '--' }}, {{ weather.lon ?? '--' }})
              </div>

              <div class="chipBtn btn" @click="ping(); loadAll(); loadWeather()">↻ Reload</div>
            </div>
          </div>

          <div class="muted mono" style="margin-top:10px;">
            {{ statusText }}
          </div>
          <div v-if="lastError" class="muted mono" style="margin-top:6px; color: rgba(255,180,180,.95);">
            {{ lastError.message || lastError }}
          </div>
        </div>

        <!-- PLAN -->
        <div v-if="view==='plan'" class="card section">
          <div class="sectionHead">
            <div class="sectionTitle">行程</div>
          </div>

          <div class="daysSlider">
            <div
              class="dayCard btn"
              v-for="d in days"
              :key="d.id"
              :class="{active: selectedDayId===d.id}"
              @click="selectedDayId=d.id"
            >
              <div class="dayTop">
                <div class="dayBadge">Day {{ d.day_no }}</div>
                <div class="dayDate">{{ d.date || '' }}</div>
                <div class="penBtn btn" v-html="penSvg()"></div>
              </div>
              <div class="dayTitle">{{ d.title || (d.date ? d.date : ('Day ' + d.day_no)) }}</div>
            </div>
          </div>

          <div v-if="selectedDay" class="cardInner periodCard">
            <div class="periodHead">
              <div class="periodName">{{ selectedDay.title || ('Day ' + selectedDay.day_no) }}</div>
            </div>

            <div v-for="k in ['am','pm','night']" :key="k" class="cardInner" style="padding:12px; margin-top:12px;">
              <div class="periodHead">
                <div class="periodName">{{ ({am:'上午', pm:'下午', night:'晚上'})[k] }}</div>
              </div>

              <div class="list">
                <div v-for="x in periodGroups[k].dest" :key="x.id" class="itemCard">
                  <div class="itemTop">
                    <div class="itemIcon">📍</div>
                    <div class="itemMain">
                      <div class="itemTitle">{{ x.title }}</div>
                      <div class="itemNote" v-if="x.note">{{ x.note }}</div>
                      <a class="mapsLink" v-if="mapQueryFor(x)" :href="mapHrefFor(x)" target="_blank" rel="noopener">
                        📌 Google Maps
                      </a>
                    </div>
                    <div class="penBtn btn" v-html="penSvg()"></div>
                  </div>
                </div>

                <div v-for="m in periodGroups[k].meal" :key="m.id" class="itemCard">
                  <div class="itemTop">
                    <div class="itemIcon">🍽️</div>
                    <div class="itemMain">
                      <div class="itemTitle">{{ m.title }}</div>
                      <div class="itemNote" v-if="m.note">{{ m.note }}</div>
                      <a class="mapsLink" v-if="mapQueryFor(m)" :href="mapHrefFor(m)" target="_blank" rel="noopener">
                        📌 Google Maps
                      </a>
                    </div>
                    <div class="penBtn btn" v-html="penSvg()"></div>
                  </div>
                </div>

                <div v-if="periodGroups[k].dest.length===0 && periodGroups[k].meal.length===0" class="itemCard muted">
                  （未有內容）
                </div>
              </div>
            </div>

            <div class="cardInner" style="padding:12px; margin-top:12px;">
              <div class="periodHead">
                <div class="periodName">衣著</div>
              </div>
              <div class="list">
                <div v-for="w in wearItems" :key="w.id" class="itemCard">
                  <div class="itemTop">
                    <div class="itemIcon">👗</div>
                    <div class="itemMain">
                      <div class="itemTitle">{{ w.title }}</div>
                      <div class="itemNote" v-if="w.note">{{ w.note }}</div>
                    </div>
                    <div class="penBtn btn" v-html="penSvg()"></div>
                  </div>
                </div>
                <div v-if="wearItems.length===0" class="itemCard muted">
                  （未有衣著）
                </div>
              </div>
            </div>

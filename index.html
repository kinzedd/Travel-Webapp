<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sapporo Snow — Travel App</title>

  <link rel="stylesheet" href="./assets/app.css" />
  <script src="./assets/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{
      --bg0:#07101f;
      --card: rgba(255,255,255,.07);
      --card2: rgba(255,255,255,.05);
      --stroke: rgba(255,255,255,.12);
      --stroke2: rgba(255,255,255,.08);
      --txt: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.70);
      --ok: rgba(191,255,209,.92);
      --bad: rgba(255,180,180,.92);
      --shadow: 0 14px 40px rgba(0,0,0,.35);
      --pad: 12px;
    }

    *{box-sizing:border-box}
    html, body { height:100%; }
    body{
      margin:0;
      color:var(--txt);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      background:
        radial-gradient(1200px 800px at 20% 10%, rgba(50,120,255,.18), transparent 60%),
        radial-gradient(900px 600px at 80% 0%, rgba(180,120,255,.12), transparent 60%),
        linear-gradient(180deg, rgba(8,18,34,1), rgba(4,10,20,1));
      overflow-x:hidden;
    }

    /* bg.jpg fallback paths */
    body::before{
      content:"";
      position:fixed; inset:0;
      background-image:
        url("./assets/bg.jpg"),
        url("./bg.jpg");
      background-size: cover;
      background-position: center;
      background-repeat:no-repeat;
      opacity:.55;
      pointer-events:none;
      z-index:-2;
    }
    body::after{
      content:"";
      position:fixed; inset:0;
      background: linear-gradient(180deg, rgba(4,10,20,.88), rgba(4,10,20,.65) 40%, rgba(4,10,20,.92));
      pointer-events:none;
      z-index:-1;
    }

    a{ color:inherit; text-decoration:none; }
    .muted{ color:var(--muted); }
    .mono{ font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size:12px; }

    .shell{
      max-width: 980px;
      margin: 0 auto;
      padding: 14px 14px 96px;
    }

    .topbar{
      display:flex;
      align-items:flex-start;
      gap:12px;
      padding:14px;
      border:1px solid var(--stroke2);
      background: rgba(255,255,255,.05);
      border-radius: 26px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }
    .brand{ flex:1; min-width:0; }
    .kicker{
      letter-spacing:.18em;
      font-size:12px;
      opacity:.8;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .titleRow{ display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-top:6px; }
    .title{ font-size:40px; font-weight:900; line-height:1; }
    .sub{ font-size:14px; color:var(--muted); }

    .actions{
      display:flex;
      flex-direction:column;
      gap:10px;
      align-items:flex-end;
      min-width: 190px;
    }
    .pill{
      border:1px solid var(--stroke);
      background: rgba(255,255,255,.06);
      padding:8px 10px;
      border-radius: 999px;
      display:flex;
      gap:8px;
      align-items:center;
      font-size:13px;
      white-space:nowrap;
    }
    .pill.ok{ border-color: rgba(191,255,209,.35); color: var(--ok); }
    .pill.bad{ border-color: rgba(255,180,180,.35); color: var(--bad); }

    .btn{
      border:1px solid var(--stroke);
      background: rgba(255,255,255,.06);
      color: var(--txt);
      border-radius: 999px;
      padding: 10px 12px;
      font-weight:800;
      cursor:pointer;
      user-select:none;
      display:inline-flex;
      align-items:center;
      gap:8px;
      transition: transform .08s ease, background .12s ease;
    }
    .btn:active{ transform: translateY(1px); }
    .btn.small{ padding:8px 10px; font-size:13px; }
    .btn.ghost{ background: transparent; }
    .btn.primary{ background: rgba(191,255,209,.12); border-color: rgba(191,255,209,.25); }
    .btn.danger{ background: rgba(255,180,180,.10); border-color: rgba(255,180,180,.25); color: rgba(255,220,220,.95); }
    .btn:disabled{ opacity:.45; cursor:not-allowed; }

    .tabs{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:12px;
    }
    .tab{
      border:1px solid var(--stroke);
      background: rgba(255,255,255,.06);
      padding:10px 14px;
      border-radius: 999px;
      cursor:pointer;
      font-weight:900;
      font-size:14px;
    }
    .tab.active{
      background: rgba(255,255,255,.14);
      border-color: rgba(255,255,255,.18);
    }

    .panel{
      margin-top:14px;
      border:1px solid var(--stroke2);
      background: rgba(255,255,255,.04);
      border-radius: 26px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      overflow:hidden;
    }
    .panelHead{
      display:flex;
      gap:10px;
      align-items:center;
      padding:12px var(--pad) 10px;
      border-bottom:1px solid var(--stroke2);
      background: rgba(255,255,255,.03);
    }
    .panelHead .right{
      margin-left:auto;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    /* Day slider */
    .daySlider{
      display:flex;
      gap:10px;
      overflow-x:auto;
      padding: var(--pad);
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
    }
    .daySlider::-webkit-scrollbar{ height: 8px; }
    .daySlider::-webkit-scrollbar-thumb{ background: rgba(255,255,255,.12); border-radius:999px; }

    /* ✅ thinner day cards */
    .dayCard{
      min-width: 200px;
      max-width: 220px;
      scroll-snap-align: start;
      border:1px solid var(--stroke2);
      background: rgba(255,255,255,.05);
      border-radius: 18px;
      padding: 8px 10px;              /* thinner */
      box-shadow: 0 12px 30px rgba(0,0,0,.18);
      cursor:pointer;
    }
    .dayCard.active{
      border-color: rgba(191,255,209,.35);
      background: rgba(191,255,209,.07);
    }
    .dayTop{ display:flex; gap:8px; align-items:center; }
    .dayTag{
      border:1px solid var(--stroke);
      padding:5px 9px;                /* thinner */
      border-radius:999px;
      font-weight:900;
      background: rgba(255,255,255,.06);
      line-height:1.05;
      font-size:13px;
    }
    .dayDate{
      color: rgba(255,255,255,.70);
      font-weight:800;
      letter-spacing:.02em;
      font-size:13px;
    }
    .dayTitle{
      margin-top:6px;
      font-size:16px;                 /* smaller */
      font-weight:900;
      line-height:1.15;
      word-break:break-word;
      display:-webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;          /* clamp to keep thin */
      overflow:hidden;
      min-height: 2.3em;              /* stable height */
    }

    .iconBtn{
      width:32px;
      height:32px;
      border-radius: 14px;
      border:1px solid var(--stroke);
      background: rgba(0,0,0,.18);
      display:grid;
      place-items:center;
      cursor:pointer;
      user-select:none;
    }
    .iconBtn:active{ transform: translateY(1px); }
    .penSvg{ width:16px; height:16px; opacity:.95; }

    /* Sections aligned */
    .section{
      margin: 0 var(--pad) var(--pad);
      border:1px solid var(--stroke2);
      background: rgba(255,255,255,.04);
      border-radius: 22px;
      overflow:hidden;
    }
    .sectionHead{
      padding: 12px;
      display:flex;
      align-items:center;
      gap:10px;
      border-bottom:1px solid var(--stroke2);
      background: rgba(255,255,255,.03);
    }
    .sectionHead h3{ margin:0; font-size:18px; font-weight:900; }
    .sectionHead .right{ margin-left:auto; display:flex; gap:10px; }

    .items{
      padding: 12px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .itemCard{
      border:1px solid var(--stroke2);
      background: rgba(255,255,255,.05);
      border-radius: 18px;
      padding: 12px;
    }
    .itemTop{
      display:flex;
      gap:10px;
      align-items:flex-start;
    }
    .emoji{
      width:26px;
      height:26px;
      display:grid;
      place-items:center;
      font-size:18px;
      opacity:.95;
      flex:0 0 auto;
      margin-top:2px;
    }
    .itemMain{ flex:1; min-width:0; }
    .itemTitle{
      font-weight:900;
      font-size:18px;
      line-height:1.2;
      word-break:break-word;
    }
    .itemNote{
      margin-top:6px;
      color: var(--muted);
      white-space:pre-wrap;
      line-height:1.35;
      word-break:break-word;
    }
    .itemActions{ display:flex; gap:8px; align-items:center; flex:0 0 auto; }

    /* Flights - boarding pass style */
    .flightCard{
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      border-radius: 18px;
      padding: 14px;
      box-shadow: 0 12px 30px rgba(0,0,0,.16);
    }
    .flightTop{
      display:flex;
      gap:10px;
      align-items:center;
      color: rgba(255,255,255,.80);
      font-weight:800;
      font-size:13px;
      letter-spacing:.02em;
    }
    .flightRoute{
      margin-top:8px;
      font-size:22px;
      font-weight:950;
      letter-spacing:.01em;
      display:flex;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
    }
    .flightMid{
      margin-top:10px;
      display:grid;
      grid-template-columns: 1fr auto 1fr;
      align-items:center;
      gap:10px;
    }
    .airport{
      font-size:22px;
      font-weight:950;
      color: rgba(191,255,209,.92);
    }
    .timeBig{
      font-size:34px;
      font-weight:950;
      line-height:1;
    }
    .term{
      color: rgba(255,255,255,.70);
      font-weight:800;
      margin-top:6px;
    }
    .planeLine{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      color: rgba(255,255,255,.65);
      font-weight:900;
    }
    .line{
      height:6px;
      width:120px;
      border-radius:999px;
      background: rgba(255,255,255,.14);
      position:relative;
    }
    .dot{
      position:absolute;
      right:-6px;
      top:50%;
      transform: translateY(-50%);
      width:12px;
      height:12px;
      border-radius:50%;
      background: rgba(255,255,255,.18);
      border:1px solid rgba(255,255,255,.25);
    }

    /* Shopping */
    .shopRow{
      display:flex;
      gap:10px;
      align-items:flex-start;
    }
    .chk{
      width:20px;
      height:20px;
      margin-top:2px;
      accent-color: rgba(191,255,209,.85);
    }
    .shopMain{ flex:1; min-width:0; }
    .strike{
      text-decoration: line-through;
      opacity:.55;
    }

    /* bottom */
    .bottomNav{
      position:fixed;
      left:0; right:0; bottom:0;
      padding: 10px 12px 14px;
      background: linear-gradient(180deg, rgba(4,10,20,0), rgba(4,10,20,.92) 35%, rgba(4,10,20,.96));
      backdrop-filter: blur(10px);
      z-index: 40;
    }
    .bottomBar{
      max-width:980px;
      margin:0 auto;
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:space-between;
    }

    /* debug */
    .debugBtn{
      position:fixed;
      right:14px;
      bottom: 86px;
      z-index: 60;
      border-radius: 999px;
      padding:10px 12px;
      background: rgba(0,0,0,.35);
      border:1px solid rgba(255,255,255,.18);
      backdrop-filter: blur(10px);
      cursor:pointer;
      display:flex;
      gap:8px;
      align-items:center;
      font-weight:900;
      user-select:none;
    }
    .debugDrawer{
      position:fixed;
      right:14px;
      bottom: 140px;
      width: min(420px, calc(100vw - 28px));
      max-height: 60vh;
      overflow:auto;
      z-index: 70;
      border-radius: 18px;
      border:1px solid rgba(255,255,255,.16);
      background: rgba(0,0,0,.42);
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow);
      padding: 12px;
    }
    .debugRow{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:10px; }

    /* modal */
    .modalMask{
      position:fixed;
      inset:0;
      background: rgba(0,0,0,.58);
      z-index: 80;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 14px;
    }
    .modal{
      width: min(680px, 96vw);
      max-height: 88vh;
      overflow:auto;
      border-radius: 22px;
      border:1px solid rgba(255,255,255,.16);
      background: rgba(12,18,30,.78);
      backdrop-filter: blur(16px);
      box-shadow: var(--shadow);
      padding: 14px;
    }
    .modalHead{ display:flex; gap:10px; align-items:center; }
    .modalTitle{ font-size:18px; font-weight:900; }
    .modalHead .right{ margin-left:auto; display:flex; gap:10px; }
    .formGrid{
      margin-top:12px;
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:10px;
    }
    label{
      display:block;
      color: var(--muted);
      font-size:12px;
      margin-bottom:6px;
      font-weight:900;
      letter-spacing:.03em;
    }
    input, select, textarea{
      width:100%;
      padding: 10px 10px;
      border-radius: 14px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.18);
      color: var(--txt);
      outline:none;
    }
    textarea{ min-height: 110px; resize: vertical; }
    .hint{ margin-top:10px; color: var(--muted); font-size:12px; }
    .modalActions{
      margin-top:12px;
      display:flex;
      gap:10px;
      justify-content:flex-end;
      flex-wrap:wrap;
    }

    @media (max-width: 520px){
      .title{ font-size:34px; }
      .actions{ min-width:0; }
      .dayCard{ min-width: 190px; max-width: 210px; }
      .formGrid{ grid-template-columns: 1fr; }
      .line{ width:90px; }
      .timeBig{ font-size:30px; }
    }
  </style>
</head>

<body>
<div id="app"></div>

<script>
(() => {
  const { createApp } = Vue;

  // ======= CONFIG =======
  const SUPABASE_URL = "https://qvogojdyykgotuitjkhj.supabase.co";
  const SUPABASE_KEY = "sb_publishable_9rQ7sJQ3bZ_uhnT2hxRUKQ_MJv1icIF"; // <- replace
  const sb = window.supabase?.createClient?.(SUPABASE_URL, SUPABASE_KEY);

  // ======= Weather =======
  async function fetchWeather(lat, lon){
    const url =
      "https://api.open-meteo.com/v1/forecast"
      + `?latitude=${encodeURIComponent(lat)}&longitude=${encodeURIComponent(lon)}`
      + "&current=temperature_2m,weather_code,wind_speed_10m"
      + "&timezone=Asia%2FHong_Kong";
    const r = await fetch(url, { cache:"no-store" });
    if (!r.ok) throw new Error("weather fetch failed");
    const j = await r.json();
    return j?.current || null;
  }
  function wxEmoji(code){
    if (code == null) return "🌤️";
    if ([0].includes(code)) return "☀️";
    if ([1,2,3].includes(code)) return "🌤️";
    if ([45,48].includes(code)) return "🌫️";
    if ([51,53,55,56,57].includes(code)) return "🌦️";
    if ([61,63,65,66,67].includes(code)) return "🌧️";
    if ([71,73,75,77,85,86].includes(code)) return "🌨️";
    if ([80,81,82].includes(code)) return "🌧️";
    if ([95,96,99].includes(code)) return "⛈️";
    return "🌤️";
  }

  const safeStr = (v) => (v == null ? "" : String(v));

  function mapsDirUrl(dest){
    const d = safeStr(dest).trim();
    if (!d) return null;
    return "https://www.google.com/maps/dir/?api=1&origin=Current+Location&destination=" + encodeURIComponent(d);
  }

  function periodOf(item){
    const t = safeStr(item.time_label).toLowerCase();
    const title = safeStr(item.title);
    const note = safeStr(item.note);
    const key = t + " " + title + " " + note;

    if (key.includes("衣") || key.includes("wear")) return "wear";
    if (key.includes("晚上") || key.includes("夜") || key.includes("night")) return "night";
    if (key.includes("下午") || key.includes("pm") || key.includes("afternoon")) return "pm";
    if (key.includes("上午") || key.includes("早") || key.includes("am") || key.includes("morning")) return "am";
    return "am";
  }

  function isMeal(item){
    return safeStr(item.kind) === "food"
      || safeStr(item.title).includes("餐")
      || safeStr(item.title).toLowerCase().includes("meal")
      || safeStr(item.time_label).includes("用餐");
  }
  function isWear(item){
    return safeStr(item.kind) === "wear" || safeStr(item.title).includes("衣") || safeStr(item.time_label).includes("衣著");
  }
  function isDest(item){
    if (isWear(item)) return false;
    return !isMeal(item);
  }
  function emojiForItem(item){
    if (isWear(item)) return "👕";
    if (isMeal(item)) return "🍽️";
    return "📍";
  }

  function fmtDate(d){
    if (!d) return "";
    const s = String(d);
    return s.slice(0,10);
  }
  function fmtTime(ts){
    if (!ts) return "";
    const s = String(ts);
    // support "2026-01-08 02:00:00+08" or ISO
    const m = s.match(/(\d{2}):(\d{2})/);
    if (m) return `${m[1]}:${m[2]}`;
    return s;
  }

  const PenIcon = `
    <svg class="penSvg" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12.7 6.3l5 5" stroke="white" stroke-width="2" stroke-linecap="round"/>
      <path d="M4 20l3.8-.9c.4-.1.7-.3 1-.6L20 7.3a2 2 0 0 0 0-2.8L19.5 4a2 2 0 0 0-2.8 0L5.5 15.2c-.3.3-.5.6-.6 1L4 20Z" stroke="white" stroke-width="2" stroke-linejoin="round"/>
    </svg>
  `;

  createApp({
    data(){
      return {
        view: "plan", // plan | flights | expenses | shopping
        loading: false,
        connected: false,
        statusText: "ready",
        lastError: null,

        days: [],
        selectedDayId: null,
        planItems: [],
        flights: [],
        shopping: [],
        expenses: [],

        wx: { ok:false, emoji:"--", temp:"--", wind:"--", loc:"" },

        editing: null,
        debugOpen: false,

        PenIcon
      };
    },

    computed:{
      selectedDay(){
        return this.days.find(d => d.id === this.selectedDayId) || null;
      },
      dayNoById(){
        const m = new Map();
        for (const d of this.days) m.set(d.id, d.day_no);
        return m;
      },
      dayIdByNo(){
        const m = new Map();
        for (const d of this.days) m.set(String(d.day_no), d.id);
        return m;
      },

      planForSelected(){
        if (!this.selectedDayId) return [];
        return (this.planItems || [])
          .filter(x => x.day_id === this.selectedDayId)
          .slice()
          .sort((a,b) => (a.order_no ?? 0) - (b.order_no ?? 0));
      },

      planAM(){ return this.packPeriod(this.planForSelected.filter(x => periodOf(x)==="am" && !isWear(x))); },
      planPM(){ return this.packPeriod(this.planForSelected.filter(x => periodOf(x)==="pm" && !isWear(x))); },
      planNight(){ return this.packPeriod(this.planForSelected.filter(x => periodOf(x)==="night" && !isWear(x))); },
      planWear(){
        const all = this.planForSelected.filter(x => isWear(x) || periodOf(x)==="wear");
        return { dests: all.slice(), meal: null };
      },

      flightsSorted(){
        return (this.flights||[]).slice().sort((a,b)=>(a.seg_no??0)-(b.seg_no??0));
      },
      expensesSorted(){
        return (this.expenses||[]).slice().sort((a,b)=> String(a.happened_on||"").localeCompare(String(b.happened_on||"")));
      },
      shoppingSorted(){
        return (this.shopping||[]).slice().sort((a,b)=>(a.order_no??0)-(b.order_no??0));
      }
    },

    methods:{
      packPeriod(list){
        const dests = list.filter(isDest);
        const meal = list.find(isMeal) || null;
        return { dests, meal };
      },

      setErr(e){
        this.lastError = (e && (e.message || e.error_description)) ? e : { message: String(e) };
        this.statusText = "ERR: " + safeStr(this.lastError.message || this.lastError);
        console.error(e);
      },

      async ping(){
        try{
          const { error, status } = await sb
            .from("days")
            .select("id,day_no")
            .order("day_no", { ascending:true })
            .limit(1);
          if (error) throw error;
          this.connected = true;
          this.statusText = `OK (${status})`;
        }catch(e){
          this.connected = false;
          this.setErr(e);
        }
      },

      async loadAll(){
        this.loading = true;
        this.lastError = null;
        this.statusText = "loading...";

        try{
          const qDays = await sb
            .from("days")
            .select("id,day_no,date,title,note,sort_order,created_at,updated_at")
            .order("day_no", { ascending:true });
          if (qDays.error) throw qDays.error;
          this.days = qDays.data || [];
          if (!this.selectedDayId && this.days.length) this.selectedDayId = this.days[0].id;

          const qPlan = await sb
            .from("plan_items")
            .select("id,day_id,time_label,kind,title,note,maps_query,order_no,created_at,updated_at")
            .order("order_no", { ascending:true });
          if (qPlan.error) throw qPlan.error;
          this.planItems = qPlan.data || [];

          const qFlights = await sb
            .from("flights")
            .select("id,seg_no,flight_no,carrier,depart_airport,arrive_airport,depart_time,arrive_time,note,created_at,updated_at")
            .order("seg_no", { ascending:true });
          if (qFlights.error) throw qFlights.error;
          this.flights = qFlights.data || [];

          const qShop = await sb
            .from("shopping_items")
            .select("id,name,location,price_text,note,done,order_no,created_at,updated_at")
            .order("order_no", { ascending:true });
          if (qShop.error) throw qShop.error;
          this.shopping = qShop.data || [];

          const qExp = await sb
            .from("expenses")
            .select("id,day_id,happened_on,category,merchant,amount,currency,paid_by,note,created_at,updated_at")
            .order("happened_on", { ascending:true });
          if (qExp.error) throw qExp.error;
          this.expenses = qExp.data || [];

          this.connected = true;
          this.statusText = "loaded";
        }catch(e){
          this.connected = false;
          this.setErr(e);
        }finally{
          this.loading = false;
        }
      },

      async initWeather(){
        try{
          if (!navigator.geolocation) throw new Error("no geolocation");
          const pos = await new Promise((res, rej) => {
            navigator.geolocation.getCurrentPosition(res, rej, { enableHighAccuracy:false, timeout:7000, maximumAge: 10*60*1000 });
          });
          const lat = pos.coords.latitude;
          const lon = pos.coords.longitude;
          const cur = await fetchWeather(lat, lon);

          this.wx.ok = !!cur;
          this.wx.emoji = wxEmoji(cur?.weather_code);
          this.wx.temp = (cur?.temperature_2m != null) ? (Math.round(cur.temperature_2m) + "°C") : "--";
          this.wx.wind = (cur?.wind_speed_10m != null) ? (Math.round(cur.wind_speed_10m) + " km/h") : "--";
          this.wx.loc = `(${lat.toFixed(2)}, ${lon.toFixed(2)})`;
        }catch(e){
          this.wx.ok = false;
          this.wx.emoji = "🌤️";
          this.wx.temp = "--";
          this.wx.wind = "--";
          this.wx.loc = "";
        }
      },

      // ===== CRUD (modal only) =====
      openNew(table, preset = {}){
        const blank = {
          days: { day_no: 1, date: "", title: "", note: "", sort_order: 1 },
          plan_items: { day_no: this.selectedDay?.day_no ?? 1, time_label: "上午", kind: "activity", title: "", note: "", maps_query: "" },
          flights: { seg_no: 1, flight_no:"", carrier:"", depart_airport:"", arrive_airport:"", depart_time:"", arrive_time:"", note:"" },
          expenses: { day_no: this.selectedDay?.day_no ?? 1, happened_on:"", category:"", merchant:"", amount:null, currency:"JPY", paid_by:"", note:"" },
          shopping_items: { name:"", location:"", price_text:"", note:"", done:false, order_no: 1 },
        }[table] || {};
        const row = { ...blank, ...preset };

        this.editing = { table, mode:"insert", row: JSON.parse(JSON.stringify(row)) };
      },

      openEdit(table, row){
        const r = JSON.parse(JSON.stringify(row));
        if (table === "plan_items"){
          if (r.day_id && this.dayNoById.has(r.day_id)) r.day_no = this.dayNoById.get(r.day_id);
          delete r.day_id;
        }
        if (table === "expenses"){
          if (r.day_id && this.dayNoById.has(r.day_id)) r.day_no = this.dayNoById.get(r.day_id);
          delete r.day_id;
        }
        this.editing = { table, mode:"update", row: r };
      },

      closeEdit(){ this.editing = null; },

      async saveEdit(){
        if (!this.editing) return;
        const { table } = this.editing;
        const row = { ...this.editing.row };

        this.loading = true;
        this.lastError = null;

        try{
          delete row.created_at;
          delete row.updated_at;

          if (table === "plan_items"){
            const dn = safeStr(row.day_no).trim();
            const dayId = this.dayIdByNo.get(dn);
            if (!dayId) throw new Error("搵唔到 Day 編號：" + dn);
            row.day_id = dayId;
            delete row.day_no;

            if (!row.id){
              const sameDay = (this.planItems||[]).filter(x => x.day_id === dayId);
              const max = sameDay.reduce((m,x) => Math.max(m, x.order_no || 0), 0);
              row.order_no = max + 1;
            }
          }

          if (table === "expenses"){
            const dn = safeStr(row.day_no).trim();
            const dayId = this.dayIdByNo.get(dn);
            if (!dayId) throw new Error("搵唔到 Day 編號：" + dn);
            row.day_id = dayId;
            delete row.day_no;
          }

          const { error } = await sb.from(table).upsert(row);
          if (error) throw error;

          this.statusText = "saved";
          this.closeEdit();
          await this.loadAll();
        }catch(e){
          this.setErr(e);
        }finally{
          this.loading = false;
        }
      },

      async deleteEditingRow(){
        if (!this.editing) return;
        const { table } = this.editing;
        const id = this.editing.row?.id;
        if (!id) { this.closeEdit(); return; }

        this.loading = true;
        this.lastError = null;

        try{
          const { error } = await sb.from(table).delete().eq("id", id);
          if (error) throw error;
          this.statusText = "deleted";
          this.closeEdit();
          await this.loadAll();
        }catch(e){
          this.setErr(e);
        }finally{
          this.loading = false;
        }
      },

      // quick add buttons for plan
      addDest(periodKey){
        const timeLabel = ({ am:"上午", pm:"下午", night:"晚上" })[periodKey] || "上午";
        this.openNew("plan_items", { time_label: timeLabel, kind:"activity", day_no: this.selectedDay?.day_no ?? 1 });
      },
      addMeal(periodKey){
        const timeLabel = ({ am:"上午/中午", pm:"下午/黃昏", night:"晚上" })[periodKey] || "上午/中午";
        this.openNew("plan_items", { time_label: timeLabel, kind:"food", day_no: this.selectedDay?.day_no ?? 1 });
      },
      addWear(){
        this.openNew("plan_items", { time_label: "衣著", kind:"wear", day_no: this.selectedDay?.day_no ?? 1 });
      },

      itemMapsUrl(x){
        const dest = safeStr(x.maps_query || x.title);
        return mapsDirUrl(dest);
      },

      // Shopping: toggle done w/ checkbox
      async toggleShopDone(row){
        try{

            .from("shopping_items")
            .update({ done: !!row.done })
            .eq("id", row.id);
          if (error) throw error;
        }catch(e){
          this.setErr(e);
        }
      },

      emojiForItem,
      fmtDate,
      fmtTime,
    },

      await this.loadAll();
      await this.initWeather();
    },

                <label>日期（YYYY-MM-DD）</label>
                <input v-model="editing.row.date" placeholder="2026-01-08" />
              </div>
              <div style="grid-column:1/-1;">
                <label>標題</label>
                <input v-model="editing.row.title" placeholder="例如：Day 2 1/9 星期五" />
              </div>
              <div style="grid-column:1/-1;">
                <label>備註</label>
                <textarea v-model="editing.row.note"></textarea>
              </div>
            </div>

            <!-- PLAN_ITEMS -->
            <div v-else-if="editing.table==='plan_items'" class="formGrid">
              <div>
                <label>Day 編號</label>
                <input type="number" v-model.number="editing.row.day_no" />
              </div>
              <div>
                <label>時段（上午/下午/晚上/衣著）</label>
                <input v-model="editing.row.time_label" placeholder="上午" />
              </div>
              <div>
                <label>類型</label>
                <select v-model="editing.row.kind">
                  <option value="activity">行程</option>
                  <option value="transport">交通</option>
                  <option value="hotel">酒店</option>
                  <option value="food">用餐</option>
                  <option value="wear">衣著</option>
                </select>
              </div>
              <div></div>
              <div style="grid-column:1/-1;">
                <label>標題</label>
                <input v-model="editing.row.title" />
              </div>
              <div style="grid-column:1/-1;">
                <label>備註</label>
                <textarea v-model="editing.row.note"></textarea>
              </div>
              <div style="grid-column:1/-1;">
                <label>Google Map 目的地（留空＝用標題）</label>
                <input v-model="editing.row.maps_query" />
              </div>
              <div class="hint" style="grid-column:1/-1;">
                order_no 會自動處理，你唔需要填。
              </div>
            </div>

            <!-- FLIGHTS -->
            <div v-else-if="editing.table==='flights'" class="formGrid">
              <div>
                <label>段數（seg_no）</label>
                <input type="number" v-model.number="editing.row.seg_no" />
              </div>
              <div>
                <label>航班（航空 + 班次）</label>
                <div style="display:flex; gap:10px;">
                  <input v-model="editing.row.carrier" placeholder="CX" />
                  <input v-model="editing.row.flight_no" placeholder="581" />
                </div>
              </div>
              <div>
                <label>出發機場</label>
                <input v-model="editing.row.depart_airport" placeholder="CTS" />
              </div>
              <div>
                <label>到達機場</label>
                <input v-model="editing.row.arrive_airport" placeholder="HKG" />
              </div>
              <div>
                <label>出發時間</label>
                <input v-model="editing.row.depart_time" placeholder="2026-01-13 16:00:00+09" />
              </div>
              <div>
                <label>到達時間</label>
                <input v-model="editing.row.arrive_time" placeholder="2026-01-13 20:55:00+08" />
              </div>
              <div style="grid-column:1/-1;">
                <label>備註</label>
                <textarea v-model="editing.row.note"></textarea>
              </div>
            </div>

            <!-- EXPENSES -->
            <div v-else-if="editing.table==='expenses'" class="formGrid">
              <div>
                <label>Day 編號</label>
                <input type="number" v-model.number="editing.row.day_no" />
              </div>
              <div>
                <label>日期（YYYY-MM-DD）</label>
                <input v-model="editing.row.happened_on" placeholder="2026-01-09" />
              </div>
              <div>
                <label>分類</label>
                <input v-model="editing.row.category" placeholder="交通 / 食 / 手信..." />
              </div>
              <div>
                <label>商戶</label>
                <input v-model="editing.row.merchant" />
              </div>
              <div>
                <label>金額</label>
                <input type="number" v-model.number="editing.row.amount" step="0.01" />
              </div>
              <div>
                <label>貨幣</label>
                <input v-model="editing.row.currency" placeholder="JPY" />
              </div>
              <div>
                <label>付款人</label>
                <input v-model="editing.row.paid_by" placeholder="Kin / Aline" />
              </div>
              <div></div>
              <div style="grid-column:1/-1;">
                <label>備註</label>
                <textarea v-model="editing.row.note"></textarea>
              </div>
            </div>

            <!-- SHOPPING -->
            <div v-else-if="editing.table==='shopping_items'" class="formGrid">
              <div style="grid-column:1/-1;">
                <label>物品</label>
                <input v-model="editing.row.name" />
              </div>
              <div>
                <label>地點</label>
                <input v-model="editing.row.location" />
              </div>
              <div>
                <label>價錢</label>
                <input v-model="editing.row.price_text" />
              </div>
              <div style="grid-column:1/-1;">
                <label>備註</label>
                <textarea v-model="editing.row.note"></textarea>
              </div>
              <div class="hint" style="grid-column:1/-1;">
                done 用 checkbox 喺清單勾就得，唔需要喺呢度改。
              </div>
            </div>

            <div class="modalActions">
              <button class="btn primary" @click="saveEdit()" :disabled="loading">
                {{ loading ? '儲存中...' : '儲存' }}
              </button>
              <button class="btn danger" v-if="editing.mode==='update' && editing.row.id" @click="deleteEditingRow()" :disabled="loading">
                刪除
              </button>
              <button class="btn ghost" @click="closeEdit()">取消</button>
            </div>
          </div>
        </div>

      </div>

      <div class="bottomNav">
        <div class="bottomBar">
          <div class="muted" style="font-weight:950; font-size:13px;">{{ statusText }}</div>
          <div class="muted" style="font-weight:950; font-size:13px;">{{ connected ? 'DB OK' : 'DB ERR' }}</div>
        </div>
      </div>
    
    `}).mount("#app");
})();
</script>
</body>
</html>

<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sapporo Snow — Travel App</title>

  <link rel="stylesheet" href="./assets/app.css" />
  <script src="./assets/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{
      --text: rgba(255,255,255,.94);
      --muted: rgba(255,255,255,.70);
      --glass: rgba(10,12,18,.40);
      --glass2: rgba(10,12,18,.26);
      --stroke: rgba(255,255,255,.12);
      --stroke2: rgba(255,255,255,.10);
      --ok: rgba(191,255,209,.92);
      --danger: rgba(255,180,180,.92);
      --shadow: 0 18px 55px rgba(0,0,0,.45);
      --r1: 22px;
      --r2: 18px;
      --r3: 999px;
    }

    *{ box-sizing:border-box; }
    html, body { height:100%; }
    body{
      margin:0;
      color:var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial;
      background:
        linear-gradient(180deg, rgba(0,0,0,.35), rgba(0,0,0,.55)),
        url("./bg.jpg");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      min-height:100vh;
    }
    body.bg-fallback{
      background:
        radial-gradient(900px 600px at 20% 15%, rgba(120,255,223,.10), transparent 60%),
        radial-gradient(900px 600px at 80% 30%, rgba(255,255,255,.08), transparent 60%),
        linear-gradient(180deg, #071028, #070b14 65%, #060913);
      background-attachment: fixed;
    }

    .appShell{
      width: min(980px, 100%);
      margin: 0 auto;
      padding: 12px 12px 120px;
    }
    .glass{
      border: 1px solid var(--stroke2);
      background: linear-gradient(180deg, var(--glass), var(--glass2));
      box-shadow: var(--shadow);
      border-radius: var(--r1);
      backdrop-filter: blur(10px);
    }

    .topHero{ padding: 14px 14px 12px; }
    .tag{ letter-spacing: .24em; font-size: 11px; color: var(--muted); }

    .heroRow{
      display:flex; gap:10px; align-items:flex-start; justify-content:space-between; margin-top: 8px;
    }
    .title{ font-size: 28px; font-weight: 900; line-height: 1.08; }
    .sub{ margin-top: 6px; color: var(--muted); font-size: 13px; }

    .chipRow{
      display:flex; gap:8px; flex-wrap:wrap; margin-top: 10px; align-items:center;
    }
    .chip{
      border:1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      padding: .48rem .78rem;
      border-radius: var(--r3);
      font-size: 13px;
      user-select:none;
    }
    .chip.btn{
      cursor:pointer;
      transition: transform .06s ease, background .15s ease;
    }
    .chip.btn:hover{ transform: translateY(-1px); background: rgba(255,255,255,.10); }
    .chip.active{ background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.22); }
    .chipOk{ color: var(--ok); border-color: rgba(191,255,209,.35)!important; }
    .chipBad{ color: var(--danger); border-color: rgba(255,180,180,.35)!important; }

    .right{ margin-left:auto; }

    .clock{ text-align:right; min-width: 110px; }
    .clock .label{ font-size: 11px; color: var(--muted); }
    .clock .time{ font-size: 16px; font-weight: 900; margin-top: 3px; letter-spacing: .04em; }
    .clock .mini{ margin-top: 4px; font-size: 11px; color: var(--muted); }

    .main{ margin-top: 12px; padding: 12px; }

    /* Day slider */
    .daySlider{
      display:flex; gap:10px; overflow:auto;
      padding: 4px 2px 8px;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
    }
    .dayPill{
      flex: 0 0 auto;
      scroll-snap-align: start;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.20);
      padding: 10px 12px;
      border-radius: 16px;
      min-width: 160px;
      cursor:pointer;
      transition: transform .06s ease, background .15s ease, border-color .15s ease;
    }
    .dayPill:hover{ transform: translateY(-1px); background: rgba(255,255,255,.08); }
    .dayPill.active{
      border-color: rgba(191,255,209,.35);
      background: rgba(191,255,209,.10);
    }
    .dayPillTop{ display:flex; align-items:center; gap:8px; }
    .badge{
      border:1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      padding: .22rem .55rem;
      border-radius: 999px;
      font-size: 12px;
      white-space:nowrap;
    }
    .dayDate{
      color: var(--muted);
      font-size: 12px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width: 110px;
    }
    .dayTitle{
      margin-top: 8px;
      font-weight: 900;
      font-size: 14px;
      line-height: 1.15;
    }
    .dayNote{
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
      white-space: pre-wrap;
    }

    /* Section blocks */
    .section{
      margin-top: 12px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.18);
      border-radius: 18px;
      padding: 12px;
    }
    .sectionHead{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }
    .sectionTitle{
      font-size: 15px;
      font-weight: 900;
      display:flex;
      align-items:center;
      gap:10px;
    }
    .sectionSubtitle{
      font-size: 12px;
      color: var(--muted);
      margin-top: 3px;
    }

    .cards{
      display:flex;
      flex-direction:column;
      gap:10px;
      margin-top: 10px;
    }
    .card{
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.05);
      border-radius: 18px;
      padding: 12px;
    }
    .cardTop{ display:flex; align-items:flex-start; gap:10px; }
    .cardTitle{
      font-weight: 900;
      font-size: 14px;
      line-height: 1.15;
      flex:1;
    }
    .cardMeta{
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
      white-space: pre-wrap;
    }
    .miniRow{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top: 8px; }
    .pillSmall{
      border:1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.18);
      padding: .18rem .55rem;
      border-radius: 999px;
      font-size: 12px;
      color: rgba(255,255,255,.86);
    }

    /* Smaller edit button with pen icon */
    .editIcon{
      cursor:pointer;
      user-select:none;
      width: 30px;
      height: 30px;
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.22);
      transition: transform .06s ease, background .15s ease;
      flex: 0 0 auto;
    }
    .editIcon:hover{ transform: translateY(-1px); background: rgba(255,255,255,.08); }
    .penSvg{
      width: 14px;
      height: 14px;
      opacity: .9;
      fill: rgba(255,255,255,.92);
    }

    /* Forms */
    input, textarea, select{
      width:100%;
      background: rgba(0,0,0,.25);
      color:#fff;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 14px;
      padding: .58rem .75rem;
      outline:none;
    }
    textarea{ min-height: 96px; resize: vertical; }
    .grid2{ display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
    @media (max-width: 560px){ .grid2{ grid-template-columns: 1fr; } }

    .btnRow{ display:flex; gap:10px; flex-wrap:wrap; margin-top: 12px; }
    .btn{
      cursor:pointer;
      user-select:none;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      padding: .55rem .9rem;
      border-radius: 999px;
      font-size: 14px;
      transition: transform .06s ease, background .15s ease;
      white-space:nowrap;
    }
    .btn:hover{ transform: translateY(-1px); background: rgba(255,255,255,.10); }
    .btnDanger{ color: var(--danger); border-color: rgba(255,180,180,.35); }
    .btnOk{ color: var(--ok); border-color: rgba(191,255,209,.35); }

    /* Modal centered + simpler */
    .overlay{
      position: fixed;
      inset:0;
      background: rgba(0,0,0,.60);
      display:flex;
      align-items:center;          /* center */
      justify-content:center;      /* center */
      padding: 12px;
      z-index: 1000;
    }
    .modal{
      width: min(720px, 96vw);
      max-height: 86vh;
      overflow:auto;
      border-radius: 22px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(10,12,18,.86);
      backdrop-filter: blur(12px);
      box-shadow: 0 24px 80px rgba(0,0,0,.60);
      padding: 14px;
    }
    .modalHead{ display:flex; align-items:center; gap:10px; }
    .modalTitle{ font-weight: 900; font-size: 16px; flex:1; }
    .muted{ color: var(--muted); }
    .mono{ font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 12px; }

    /* Debug FAB */
    .dbgFab{
      position: fixed;
      right: 14px;
      bottom: 14px;
      z-index: 999;
      padding: 10px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(10,12,18,.55);
      backdrop-filter: blur(10px);
      box-shadow: 0 16px 40px rgba(0,0,0,.45);
      cursor:pointer;
      display:flex;
      align-items:center;
      gap:10px;
      user-select:none;
    }
    .dbgDot{
      width:10px; height:10px; border-radius:99px;
      background: rgba(255,180,180,.9);
      box-shadow: 0 0 0 3px rgba(255,180,180,.12);
    }
    .dbgDot.ok{
      background: rgba(191,255,209,.9);
      box-shadow: 0 0 0 3px rgba(191,255,209,.12);
    }
    .dbgOverlay{
      position: fixed;
      inset: 0;
      z-index: 1001;
      background: rgba(0,0,0,.60);
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 12px;
    }
    .dbgPanel{
      width: min(560px, 96vw);
      max-height: 86vh;
      overflow:auto;
      border-radius: 22px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(10,12,18,.86);
      backdrop-filter: blur(12px);
      box-shadow: 0 30px 80px rgba(0,0,0,.55);
      padding: 14px;
    }
    .dbgItem{
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.04);
      padding: 12px;
      margin-top: 10px;
    }
  </style>
</head>

<body>
<div id="app"></div>

<script>
(() => {
  const { createApp } = Vue;

  const SUPABASE_URL = "https://qvogojdyykgotuitjkhj.supabase.co";
  const SUPABASE_KEY = "sb_publishable_9rQ7sJQ3bZ_uhnT2hxRUKQ_MJv1icIF";

  const sb = window.supabase?.createClient?.(SUPABASE_URL, SUPABASE_KEY);
  if (!sb) console.error("Supabase init failed: window.supabase missing?");

  const hkTimeStr = () => {
    try {
      return new Intl.DateTimeFormat("en-GB", {
        timeZone: "Asia/Hong_Kong",
        hour12: false,
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      }).format(new Date());
    } catch(e) {
      const d = new Date();
      return d.toTimeString().slice(0,8);
    }
  };
  const safeStr = (v) => (v == null ? "" : String(v));
  const normalizeStr = (s) => (s==null?"":String(s)).toLowerCase();

  function mapsUrl(q){
    const s = (q==null?"":String(q)).trim();
    if (!s) return "";
    if (s.startsWith("http://") || s.startsWith("https://")) return s;
    return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(s);
  }

  // bucket detection
  function detectBucket(item, allItemsForDay){
    const tl = normalizeStr(item.time_label);
    const note = normalizeStr(item.note);
    const t = tl + " " + note;

    const isAM = t.includes("morning") || t.includes("am") || t.includes("早") || t.includes("上午");
    const isPM = t.includes("afternoon") || t.includes("pm") || t.includes("午") || t.includes("下午");
    const isNight = t.includes("night") || t.includes("晚") || t.includes("晚上");

    if (isAM) return "am";
    if (isPM) return "pm";
    if (isNight) return "night";

    // fallback split by order of appearance
    const list = (allItemsForDay || []).slice().sort((a,b)=> (a.order_no ?? 0) - (b.order_no ?? 0));
    const idx = list.findIndex(x => x.id === item.id);
    if (idx < 0) return "pm";
    const n = Math.max(list.length, 1);
    const third = n / 3;
    if (idx < third) return "am";
    if (idx < 2*third) return "pm";
    return "night";
  }

  // meal detection (only one per bucket)
  function isMeal(item){
    const k = normalizeStr(item.kind);
    if (k === "food") return true;
    const t = normalizeStr(item.title) + " " + normalizeStr(item.note);
    return t.includes("lunch") || t.includes("dinner") || t.includes("breakfast") ||
           t.includes("午餐") || t.includes("晚餐") || t.includes("早餐") ||
           t.includes("拉麵") || t.includes("燒肉") || t.includes("壽司") || t.includes("咖喱");
  }

  createApp({
    data(){
      return {
        view: "plan",
        hkClock: hkTimeStr(),
        statusText: "ready",
        lastError: null,
        connected: false,
        loading: false,

        days: [],
        selectedDayId: null,

        planItems: [],
        flights: [],
        shopping: [],
        expenses: [],

        editing: null,
        showDebug: false,
      };
    },

    computed:{
      selectedDay(){
        return this.days.find(d => d.id === this.selectedDayId) || null;
      },

      // lookup map day_no -> day_id
      dayIdByNo(){
        const m = new Map();
        for (const d of this.days) m.set(Number(d.day_no), d.id);
        return m;
      },

      planItemsForSelectedDay(){
        if (!this.selectedDayId) return [];
        return this.planItems
          .filter(x => x.day_id === this.selectedDayId)
          .sort((a,b) => (a.order_no ?? 0) - (b.order_no ?? 0));
      },

      // separate "衣著"
      wearItems(){
        return this.planItemsForSelectedDay.filter(x => normalizeStr(x.kind) === "wear");
      },

      // filter out wear from time buckets
      timeItemsNoWear(){
        return this.planItemsForSelectedDay.filter(x => normalizeStr(x.kind) !== "wear");
      },

      planByBucket(){
        const all = this.timeItemsNoWear;
        const buckets = { am: [], pm: [], night: [] };
        for (const it of all){
          const b = detectBucket(it, all);
          (buckets[b] || buckets.pm).push(it);
        }

        const out = {};
        for (const key of ["am","pm","night"]){
          const list = buckets[key] || [];

          // destination always first, then meal
          const meals = list.filter(isMeal);
          const meal = meals.length ? meals[0] : null;
          const destinations = list.filter(x => x !== meal);

          out[key] = { destinations, meal };
        }
        return out;
      },

      dbgDotClass(){
        return this.connected ? "dbgDot ok" : "dbgDot";
      }
    },

    methods:{
      async ensureBg(){
        const img = new Image();
        img.onerror = () => document.body.classList.add("bg-fallback");
        img.src = "./bg.jpg";
      },

      penIcon(){
        return `
          <svg class="penSvg" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zm2.92 2.83H5v-.92l9.06-9.06.92.92L5.92 20.08zM20.71 7.04a1.003 1.003 0 0 0 0-1.42L18.37 3.29a1.003 1.003 0 0 0-1.42 0l-1.83 1.83 3.75 3.75 1.84-1.83z"/>
          </svg>
        `;
      },

      setErr(e){
        this.lastError = (e && (e.message || e.error_description)) ? e : { message: String(e) };
        this.statusText = "ERR: " + safeStr(this.lastError.message || this.lastError);
        console.error(e);
      },

      async ping(){
        try{
          const { error, status } = await sb
            .from("days")
            .select("id,day_no")
            .order("day_no", { ascending: true })
            .limit(1);
          if (error) throw error;
          this.connected = true;
          this.statusText = `OK (${status})`;
        }catch(e){
          this.connected = false;
          this.setErr(e);
        }
      },

      async loadAll(){
        this.loading = true;
        this.lastError = null;
        this.statusText = "loading...";
        try{
          const qDays = await sb
            .from("days")
            .select("id,day_no,date,title,note,sort_order,created_at,updated_at")
            .order("day_no", { ascending: true });
          if (qDays.error) throw qDays.error;
          this.days = qDays.data || [];
          if (!this.selectedDayId && this.days.length) this.selectedDayId = this.days[0].id;

          const qPlan = await sb
            .from("plan_items")
            .select("id,day_id,time_label,kind,title,note,maps_query,order_no,created_at,updated_at")
            .order("order_no", { ascending: true });
          if (qPlan.error) throw qPlan.error;
          this.planItems = qPlan.data || [];

          const qFlights = await sb
            .from("flights")
            .select("id,seg_no,flight_no,carrier,depart_airport,arrive_airport,depart_time,arrive_time,note,created_at,updated_at")
            .order("seg_no", { ascending: true });
          if (qFlights.error) throw qFlights.error;
          this.flights = qFlights.data || [];

          const qShop = await sb
            .from("shopping_items")
            .select("id,name,location,price_text,note,done,order_no,created_at,updated_at")
            .order("order_no", { ascending: true });
          if (qShop.error) throw qShop.error;
          this.shopping = qShop.data || [];

          const qExp = await sb
            .from("expenses")
            .select("id,day_id,happened_on,category,merchant,amount,currency,paid_by,note,created_at,updated_at")
            .order("happened_on", { ascending: true });
          if (qExp.error) throw qExp.error;
          this.expenses = qExp.data || [];

          this.connected = true;
          this.statusText = "loaded";
        }catch(e){
          this.connected = false;
          this.setErr(e);
        }finally{
          this.loading = false;
        }
      },

      kindLabel(k){
        return ({ activity:"行程", food:"食", wear:"衣著", hotel:"酒店", transport:"交通" })[k] || k;
      },

      bucketLabel(b){
        return ({ am:"上午", pm:"下午", night:"晚上" })[b] || b;
      },

      toggleDebug(){ this.showDebug = !this.showDebug; },
      mapHref(q){ return mapsUrl(q); },

      openNew(table){
        const selNo = this.selectedDay?.day_no ?? 1;

        const blank = {
          // note: use day_no in UI, convert to day_id on save
          plan_items: { day_no: selNo, time_label: "", kind: "activity", title: "", note: "", maps_query: "" },
          shopping_items: { name: "", location: "", price_text: "", note: "", done: false },
          flights: { seg_no: 1, flight_no: "", carrier: "", depart_airport: "", arrive_airport: "", depart_time: "", arrive_time: "", note: "" },
          expenses: { day_no: selNo, happened_on: "", category: "", merchant: "", amount: null, currency: "JPY", paid_by: "", note: "" },
          days: { day_no: (this.days?.length||0)+1, date: "", title: "", note: "", sort_order: (this.days?.length||0)+1 },
        }[table] || {};

        this.editing = { table, mode:"insert", row: JSON.parse(JSON.stringify(blank)), allowDelete:false };
      },

      openEdit(table, row){
        const r = JSON.parse(JSON.stringify(row));

        // for plan_items/expenses, add day_no for UI
        if (table === "plan_items" || table === "expenses"){
          const d = this.days.find(x => x.id === r.day_id);
          r.day_no = d?.day_no ?? "";
          delete r.day_id; // hide internal id in UI
        }

        // hide order_no from UI; keep in DB as-is by not touching
        delete r.order_no;

        this.editing = { table, mode:"update", row: r, allowDelete:true, _original_id: row.id, _original_day_id: row.day_id };
      },

      closeEdit(){ this.editing = null; },

      async saveEdit(){
        if (!this.editing) return;
        const { table, row, _original_id, _original_day_id } = this.editing;

        this.loading = true;
        this.lastError = null;

        try{
          const payload = { ...row };

          // keep id if update
          if (this.editing.mode === "update" && _original_id && !payload.id) payload.id = _original_id;

          // cleanup
          delete payload.created_at;
          delete payload.updated_at;

          // table-specific conversions
          if (table === "shopping_items") payload.done = !!payload.done;

          // day_no -> day_id mapping for plan_items / expenses
          if (table === "plan_items" || table === "expenses"){
            const dayNo = Number(payload.day_no);
            if (!dayNo || !this.dayIdByNo.get(dayNo)){
              throw new Error("無效 day number：請填正確 Day number (day_no)。");
            }
            payload.day_id = this.dayIdByNo.get(dayNo);
            delete payload.day_no;

            // preserve original day_id if user left blank somehow
            if (!payload.day_id && _original_day_id) payload.day_id = _original_day_id;
          }

          // IMPORTANT: we are not exposing order_no anymore.
          // For updates: do NOT overwrite order_no (we removed it from payload).
          // For inserts: let DB default OR keep existing behavior:
          // We will set order_no = max+1 automatically for plan_items insert.
          if (table === "plan_items" && this.editing.mode === "insert"){
            const max = this.planItemsForSelectedDay.reduce((m,x) => Math.max(m, x.order_no || 0), 0);
            payload.order_no = max + 1;
          }

          const { error } = await sb.from(table).upsert(payload);
          if (error) throw error;

          this.statusText = "saved";
          this.closeEdit();
          await this.loadAll();
        }catch(e){
          this.setErr(e);
        }finally{
          this.loading = false;
        }
      },

      async deleteInEditor(){
        if (!this.editing) return;
        const table = this.editing.table;
        const id = this.editing._original_id || this.editing.row?.id;
        if (!id) return;
        if (!confirm("Delete this record?")) return;

        this.loading = true;
        try{
          const { error } = await sb.from(table).delete().eq("id", id);
          if (error) throw error;
          this.statusText = "deleted";
          this.closeEdit();
          await this.loadAll();
        }catch(e){
          this.setErr(e);
        }finally{
          this.loading = false;
        }
      },

      quickAddDay(){ this.openNew("days"); },
      quickAddPlan(){ this.openNew("plan_items"); },
      quickAddFlight(){ this.openNew("flights"); },
      quickAddExpense(){ this.openNew("expenses"); },
      quickAddShop(){ this.openNew("shopping_items"); },
    },

    async mounted(){
      await this.ensureBg();
      setInterval(() => { this.hkClock = hkTimeStr(); }, 1000);
      await this.ping();
      await this.loadAll();
    },

    template: /*html*/`

                <label class="muted">note</label>

          <div class="btnRow">

</script>

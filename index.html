<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Sapporo Snow — Travel App</title>

  <!-- Vue (global build) -->
  <script src="./assets/vue.global.prod.js"></script>
  <!-- Supabase JS v2 (UMD global: window.supabase) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{
      --bg1:#07101f;
      --card:rgba(255,255,255,.075);
      --card2:rgba(255,255,255,.055);
      --stroke:rgba(255,255,255,.14);
      --stroke2:rgba(255,255,255,.10);
      --text:rgba(255,255,255,.92);
      --muted:rgba(255,255,255,.70);
      --ok:#bfffd1;
      --danger:#ffb4b4;
      --shadow: 0 16px 40px rgba(0,0,0,.35);
      --r:22px;
      --r2:16px;
      --pad:14px;
      --safeB: env(safe-area-inset-bottom);
      --safeT: env(safe-area-inset-top);
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      color:var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "PingFang HK", "Hiragino Sans", "Microsoft JhengHei", Arial, sans-serif;
      background: var(--bg1);
      overflow-x:hidden;
    }

    /* bg.jpg is OUTSIDE assets folder */
    body::before{
      content:"";
      position:fixed; inset:0;
      background:
        radial-gradient(1200px 600px at 30% 10%, rgba(70,120,255,.18), transparent 60%),
        linear-gradient(180deg, rgba(6,12,24,.82), rgba(6,12,24,.74)),
        url("./bg.jpg");
      background-size: cover;
      background-position:center;
      background-repeat:no-repeat;
      filter:saturate(1.02);
      z-index:-2;
      transform: translateZ(0);
    }
    body::after{
      content:"";
      position:fixed; inset:0;
      background: radial-gradient(900px 500px at 70% 30%, rgba(255,255,255,.08), transparent 55%);
      z-index:-1;
      pointer-events:none;
    }

    a{ color:inherit; text-decoration:none; }
    .wrap{
      max-width: 920px;
      margin: 0 auto;
      padding: calc(12px + var(--safeT)) 12px calc(110px + var(--safeB));
    }

    .card{
      background: var(--card);
      border: 1px solid var(--stroke2);
      border-radius: var(--r);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .header{
      padding: 16px;
      position:relative;
      overflow:hidden;
    }
    .kicker{
      letter-spacing:.32em;
      font-size:12px;
      color:rgba(255,255,255,.7);
      margin-bottom:10px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .titleRow{
      display:flex;
      gap:10px;
      align-items:flex-start;
      justify-content:space-between;
    }
    .appTitle{
      font-weight:900;
      font-size:44px;
      line-height:1;
      letter-spacing:.02em;
    }
    .subTitle{
      margin-top:10px;
      color:var(--muted);
      font-weight:700;
    }

    .headerRight{
      display:flex;
      flex-direction:column;
      gap:10px;
      align-items:flex-end;
      min-width: 190px;
    }
    .row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:flex-end; }

    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding: 10px 12px;
      border-radius: 999px;
      border:1px solid var(--stroke);
      background: rgba(0,0,0,.18);
      color: rgba(255,255,255,.92);
      font-weight:800;
      line-height:1;
      white-space:nowrap;
    }
    .pill.small{ padding:8px 10px; font-size:13px; font-weight:800; }
    .pill.ok{ border-color: rgba(191,255,209,.35); color: var(--ok); }
    .pill.bad{ border-color: rgba(255,180,180,.35); color: var(--danger); }
    .muted{ color:var(--muted); }
    .mono{ font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }

    .btn{
      user-select:none;
      cursor:pointer;
      transition: transform .05s ease, opacity .2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active{ transform: scale(.98); }
    .iconBtn{
      width: 40px; height: 40px;
      border-radius: 999px;
      border:1px solid var(--stroke);
      display:inline-flex;
      align-items:center;
      justify-content:center;
      background: rgba(0,0,0,.18);
    }
    .iconBtn.small{
      width: 34px; height: 34px;
      border-radius: 12px;
      background: rgba(0,0,0,.16);
    }

    /* Top right debug button replacing DB YES */
    .repairBtn{
      width: 40px; height: 40px;
      border-radius: 999px;
      border:1px solid rgba(255,255,255,.18);
      background: rgba(0,0,0,.18);
      display:inline-flex;
      align-items:center;
      justify-content:center;
      font-size:18px;
    }

    /* Days slider */
    .section{
      margin-top:14px;
      padding: 14px;
    }
    .sectionHead{
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      margin-bottom:10px;
    }
    .sectionTitle{
      font-size:24px;
      font-weight:900;
      margin:0;
      letter-spacing:.02em;
    }

    .dayRail{
      display:flex;
      gap:10px;
      overflow-x:auto;
      padding: 6px 2px 10px;
      scroll-snap-type:x mandatory;
      -webkit-overflow-scrolling: touch;
    }
    .dayRail::-webkit-scrollbar{ height:6px; }
    .dayRail::-webkit-scrollbar-thumb{ background: rgba(255,255,255,.18); border-radius:999px; }
    .dayCard{
      min-width: 220px;
      max-width: 220px;
      padding: 10px 12px;  /* thinner */
      border-radius: 18px;
      border:1px solid var(--stroke2);
      background: rgba(0,0,0,.18);
      scroll-snap-align:start;
      position:relative;
    }
    .dayCard.active{
      border-color: rgba(191,255,209,.35);
      background: rgba(191,255,209,.06);
    }
    .dayTop{
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      margin-bottom:8px;
    }
    .dayBadge{
      display:inline-flex;
      gap:8px;
      align-items:center;
    }
    .tag{
      display:inline-flex;
      align-items:center;
      padding: 6px 10px;
      border-radius: 999px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.05);
      font-weight:900;
      white-space:nowrap;
    }
    .dayDate{ font-weight:900; color: rgba(255,255,255,.80); }
    .dayTitle{
      font-weight:900;
      font-size:18px;
      line-height:1.15;
      margin-top:4px;
      display:-webkit-box;
      -webkit-line-clamp:2;
      -webkit-box-orient:vertical;
      overflow:hidden;
    }

    /* Plan periods */
    .period{
      margin-top:12px;
      padding: 12px;
      border-radius: 18px;
      border:1px solid var(--stroke2);
      background: rgba(0,0,0,.14);
    }
    .periodHead{
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      padding-bottom:10px;
      border-bottom:1px solid rgba(255,255,255,.10);
      margin-bottom:10px;
    }
    .periodName{
      font-size:22px;
      font-weight:1000;
      margin:0;
    }
    .chipRow{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:flex-end; }
    .chipBtn{
      display:inline-flex; gap:8px; align-items:center;
      padding: 10px 14px;
      border-radius: 999px;
      border:1px solid rgba(255,255,255,.16);
      background: rgba(0,0,0,.16);
      font-weight:900;
    }

    /* Items */
    .list{ display:flex; flex-direction:column; gap:10px; }
    .item{
      padding: 12px;
      border-radius: 18px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.04);
      position:relative;
    }
    .itemTop{
      display:flex; gap:10px; align-items:flex-start; justify-content:space-between;
    }
    .itemLeft{ min-width:0; }
    .itemTitle{
      font-weight:1000;
      font-size:18px;
      line-height:1.25;
      word-break:break-word;
    }
    .itemNote{
      margin-top:8px;
      color: rgba(255,255,255,.72);
      white-space:pre-wrap;
      line-height:1.35;
    }
    .emoji{
      width: 26px; height: 26px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      font-size:18px;
      flex:0 0 auto;
      margin-top:2px;
    }
    .rightActions{ display:flex; gap:10px; flex:0 0 auto; }
    .penSvg{
      width:18px; height:18px;
      opacity:.95;
    }

    /* Flight card (compact style) */
    .flightCard{
      padding: 14px;
      border-radius: 20px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.16);
      overflow:hidden;
    }
    .flightTop{
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      margin-bottom:10px;
    }
    .flightTop .meta{
      font-weight:900;
      color: rgba(255,255,255,.78);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .flightBody{
      display:grid;
      grid-template-columns: 1fr 52px 1fr;
      gap: 10px;
      align-items:center;
    }
    .ap{
      font-weight:1000;
      font-size:22px;
    }
    .tm{
      font-weight:1000;
      font-size:34px;
      line-height:1;
    }
    .sub{
      color: rgba(255,255,255,.72);
      font-weight:800;
      margin-top:6px;
      font-size:13px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .midLine{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:8px;
    }
    .bar{
      width:100%;
      height:6px;
      border-radius:999px;
      background: rgba(255,255,255,.14);
      position:relative;
      overflow:hidden;
    }
    .bar::after{
      content:"";
      position:absolute;
      left:0; top:0; bottom:0;
      width:55%;
      background: rgba(191,255,209,.30);
    }
    .plane{ font-size:20px; opacity:.92; }

    /* Expenses */
    .expRow{
      display:flex; align-items:flex-start; justify-content:space-between; gap:10px;
    }
    .money{
      font-weight:1000;
      white-space:nowrap;
    }

    /* Shopping */
    .shopRow{
      display:flex; align-items:flex-start; justify-content:space-between; gap:10px;
    }
    .chk{
      display:flex; gap:12px; align-items:flex-start;
      min-width:0;
    }
    input[type="checkbox"]{
      width:22px; height:22px;
      margin-top:2px;
      accent-color: #bfffd1;
      cursor:pointer;
    }
    .strike{
      text-decoration: line-through;
      opacity:.65;
    }

    /* Bottom toolbar */
    .bottomBar{
      position:fixed;
      left:0; right:0;
      bottom:0;
      padding: 10px 12px calc(12px + var(--safeB));
      pointer-events:none;
      z-index:50;
    }
    .dock{
      max-width: 920px;
      margin: 0 auto;
      pointer-events:auto;
      background: rgba(0,0,0,.20);
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 20px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 14px 35px rgba(0,0,0,.38);
      padding: 8px;
      display:flex;
      gap:8px;
      align-items:stretch;
      justify-content:space-between;
    }
    .dockBtn{
      flex:1;
      border-radius: 16px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.05);
      padding: 10px 8px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:6px;
      font-weight:1000;
      min-width:0;
    }
    .dockBtn.active{
      border-color: rgba(191,255,209,.35);
      background: rgba(191,255,209,.07);
    }
    .dockIcon{ font-size:20px; }
    .dockText{ font-size:14px; white-space:nowrap; }

    /* Modal */
    .overlay{
      position:fixed; inset:0;
      background: rgba(0,0,0,.55);
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 14px;
      z-index:100;
    }
    .modal{
      width: min(920px, 96vw);
      max-height: 84vh;
      overflow:auto;
      border-radius: 22px;
      border:1px solid rgba(255,255,255,.16);
      background: rgba(10,16,28,.78);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 24px 70px rgba(0,0,0,.55);
      padding: 14px;
    }
    .modalHead{
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      margin-bottom: 10px;
    }
    .modalTitle{
      font-weight:1000;
      font-size:18px;
      margin:0;
    }
    .grid2{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:12px;
      margin-top:12px;
    }
    .grid1{
      display:grid;
      grid-template-columns: 1fr;
      gap:12px;
      margin-top:12px;
    }
    label{
      display:block;
      color: rgba(255,255,255,.75);
      font-weight:900;
      margin-bottom:6px;
      font-size:13px;
    }
    input, textarea, select{
      width:100%;
      border:1px solid rgba(255,255,255,.16);
      background: rgba(0,0,0,.18);
      color: rgba(255,255,255,.92);
      border-radius: 14px;
      padding: 12px 12px;
      outline:none;
      font-size: 15px;
    }
    textarea{ min-height: 110px; resize: vertical; }
    .modalActions{
      display:flex;
      gap:10px;
      align-items:center;
      margin-top:14px;
      flex-wrap:wrap;
    }
    .dangerBtn{
      border-color: rgba(255,180,180,.35) !important;
      color: var(--danger) !important;
    }

    /* Tiny responsive */
    @media (max-width:520px){
      .appTitle{ font-size:42px; }
      .headerRight{ min-width: 150px; }
      .dayCard{ min-width: 200px; max-width: 200px; }
      .flightBody{ grid-template-columns: 1fr 44px 1fr; }
      .tm{ font-size:32px; }
      .grid2{ grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <div id="app"></div>

<script>
(() => {
  const { createApp } = Vue;

  // ============
  // CONFIG
  // ============
  const SUPABASE_URL = "https://qvogojdyykgotuitjkhj.supabase.co";
  const SUPABASE_KEY = "sb_publishable_9rQ7sJQ3bZ_uhnT2hxRUKQ_MJv1icIF";

  const sb = window.supabase?.createClient?.(SUPABASE_URL, SUPABASE_KEY);
  if (!sb) console.error("Supabase client init failed: window.supabase missing?");

  const safeStr = (v) => (v == null ? "" : String(v));

  const fmtDateZh = (yyyy_mm_dd) => {
    if (!yyyy_mm_dd) return "";
    // Keep simple and stable for your existing data
    return yyyy_mm_dd;
  };

  const encode = (s) => encodeURIComponent(s || "");

  // Google Maps directions from current location
  const gmapDirUrl = (destination) =>
    destination ? `https://www.google.com/maps/dir/?api=1&origin=Current+Location&destination=${encode(destination)}` : "";

  // weather emoji (Open-Meteo weathercode)
  const wEmoji = (code) => {
    // https://open-meteo.com/en/docs
    if (code == null) return "⛅️";
    const c = Number(code);
    if ([0].includes(c)) return "☀️";
    if ([1].includes(c)) return "🌤️";
    if ([2].includes(c)) return "⛅️";
    if ([3].includes(c)) return "☁️";
    if ([45,48].includes(c)) return "🌫️";
    if ([51,53,55,56,57].includes(c)) return "🌦️";
    if ([61,63,65,66,67].includes(c)) return "🌧️";
    if ([71,73,75,77].includes(c)) return "🌨️";
    if ([80,81,82].includes(c)) return "🌧️";
    if ([85,86].includes(c)) return "🌨️";
    if ([95,96,99].includes(c)) return "⛈️";
    return "⛅️";
  };

  // Plan item emoji: destination pin vs meal
  const itemEmoji = (item) => {
    const k = (item?.kind || "").toLowerCase();
    if (k === "food") return "🍽️";
    if (k === "wear") return "👕";
    // default destinations / activities / transport / hotel etc
    return "📍";
  };

  const periodFromTimeLabel = (t) => {
    const s = (t || "").trim();
    if (s.includes("上午")) return "上午";
    if (s.includes("下午")) return "下午";
    if (s.includes("晚上")) return "晚上";
    // tolerate old values
    if (s.toLowerCase().includes("morning")) return "上午";
    if (s.toLowerCase().includes("afternoon")) return "下午";
    if (s.toLowerCase().includes("night") || s.toLowerCase().includes("evening")) return "晚上";
    return "上午"; // fallback
  };

  const segLabel = (n) => `SEG ${n}`;

  createApp({
    data(){
      return {
        view: "plan", // plan | flights | expenses | shopping
        connected: false,
        loading: false,
        statusText: "ready",
        lastError: null,

        // location + weather
        weather: { ok:false, temp:null, wind:null, code:null, lat:null, lon:null },

        // data
        days: [],
        selectedDayId: null,
        planItems: [],
        flights: [],
        expenses: [],
        shopping: [],

        // modals
        editing: null,      // { table, mode, row, title }
        showDelete: false,
        showDebug: false,
      };
    },

    computed:{
      selectedDay(){
        return this.days.find(d => d.id === this.selectedDayId) || null;
      },

      planForDay(){
        const dayId = this.selectedDayId;
        const rows = (this.planItems || []).filter(x => x.day_id === dayId);
        rows.sort((a,b) => (a.order_no ?? 0) - (b.order_no ?? 0));
        return rows;
      },

      // per period: destinations first then meal (only one meal)
      periods(){
        const base = this.planForDay || [];
        const periods = ["上午","下午","晚上"].map(p => {
          const rows = base.filter(x => periodFromTimeLabel(x.time_label) === p);

          const dest = rows.filter(x => (x.kind || "").toLowerCase() !== "food" && (x.kind || "").toLowerCase() !== "wear");
          const meal = rows.filter(x => (x.kind || "").toLowerCase() === "food");
          const wear = rows.filter(x => (x.kind || "").toLowerCase() === "wear");

          return {
            name: p,
            dest,
            meal: meal.length ? [meal[0]] : [],
            wear
          };
        });
        return periods;
      },

      wearList(){
        // separate section for 衣著: all wear items for the day (regardless of time_label)
        const base = this.planForDay || [];
        return base.filter(x => (x.kind || "").toLowerCase() === "wear");
      },

      shoppingSorted(){
        const arr = (this.shopping || []).slice();
        // unchecked first, checked moved down
        arr.sort((a,b) => {
          const ad = !!a.done, bd = !!b.done;
          if (ad !== bd) return ad ? 1 : -1;
          return (a.order_no ?? 0) - (b.order_no ?? 0);
        });
        return arr;
      }
    },

    methods:{
      setErr(e){
        this.lastError = (e && (e.message || e.error_description)) ? e : { message: String(e) };
        this.statusText = "ERR: " + safeStr(this.lastError.message || this.lastError);
        console.error(e);
      },

      penIcon(){
        return `
          <svg class="penSvg" viewBox="0 0 24 24" fill="none">
            <path d="M12 20h9" stroke="rgba(255,255,255,.85)" stroke-width="2" stroke-linecap="round"/>
            <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4 11.5-11.5Z"
              stroke="rgba(255,255,255,.85)" stroke-width="2" stroke-linejoin="round"/>
          </svg>
        `;
      },

      // ===== Weather =====
      async loadWeather(){
        try{
          this.weather.ok = false;
          const pos = await new Promise((resolve, reject) => {
            if (!navigator.geolocation) return reject(new Error("geolocation not supported"));
            navigator.geolocation.getCurrentPosition(resolve, reject, { enableHighAccuracy:false, timeout:8000, maximumAge: 600000 });
          });
          const lat = pos.coords.latitude;
          const lon = pos.coords.longitude;

          const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code,wind_speed_10m&timezone=Asia%2FHong_Kong`;
          const r = await fetch(url);
          const j = await r.json();

          const cur = j.current || {};
          this.weather = {
            ok: true,
            temp: cur.temperature_2m,
            wind: cur.wind_speed_10m,
            code: cur.weather_code,
            lat: Number(lat.toFixed(2)),
            lon: Number(lon.toFixed(2))
          };
        }catch(e){
          // don't hard fail UI
          this.weather.ok = false;
          this.weather.lat = null; this.weather.lon = null;
          console.warn("weather failed", e);
        }
      },

      // ===== DB =====
      async ping(){
        try{
          const { data, error, status } = await sb
            .from("days")
            .select("id,day_no")
            .order("day_no", { ascending:true })
            .limit(1);

          if (error) throw error;
          this.connected = true;
          this.statusText = `OK (${status})`;
          return data;
        }catch(e){
          this.connected = false;
          this.setErr(e);
          return null;
        }
      },

      async loadAll(){
        this.loading = true;
        this.lastError = null;
        this.statusText = "loading...";
        try{
          const qDays = await sb
            .from("days")
            .select("id,day_no,date,title,note,sort_order,created_at,updated_at")
            .order("day_no", { ascending:true });

          if (qDays.error) throw qDays.error;
          this.days = qDays.data || [];
          if (!this.selectedDayId && this.days.length) this.selectedDayId = this.days[0].id;

          const qPlan = await sb
            .from("plan_items")
            .select("id,day_id,time_label,kind,title,note,maps_query,order_no,created_at,updated_at")
            .order("order_no", { ascending:true });

          if (qPlan.error) throw qPlan.error;
          this.planItems = qPlan.data || [];

          const qFlights = await sb
            .from("flights")
            .select("id,seg_no,flight_no,carrier,depart_airport,arrive_airport,depart_time,arrive_time,note,created_at,updated_at")
            .order("seg_no", { ascending:true });

          if (qFlights.error) throw qFlights.error;
          this.flights = qFlights.data || [];

          const qExp = await sb
            .from("expenses")
            .select("id,day_id,happened_on,category,merchant,amount,currency,paid_by,note,created_at,updated_at")
            .order("happened_on", { ascending:true });

          if (qExp.error) throw qExp.error;
          this.expenses = qExp.data || [];

          const qShop = await sb
            .from("shopping_items")
            .select("id,name,location,price_text,note,done,order_no,created_at,updated_at")
            .order("order_no", { ascending:true });

          if (qShop.error) throw qShop.error;
          this.shopping = qShop.data || [];

          this.connected = true;
          this.statusText = "loaded";
        }catch(e){
          this.connected = false;
          this.setErr(e);
        }finally{
          this.loading = false;
        }
      },

      // ===== CRUD helpers =====
      openNewPlan(period, kind){
        // user enters day number instead of day_id (we store dayNoTemp then convert on save)
        const dayNo = this.selectedDay?.day_no ?? 1;
        const tl = period; // "上午/下午/晚上"
        const blank = {
          dayNoTemp: dayNo,
          time_label: tl,
          kind: kind, // "activity" or "food" or "wear"
          title: "",
          note: "",
          maps_query: "",
        };
        this.showDelete = false;
        this.editing = { table:"plan_items", mode:"insert", row: blank, title: (kind==="food"?"新增用餐":(kind==="wear"?"新增衣著":"新增行程")) };
      },

      openEditPlan(row){
        const dayNo = this.days.find(d => d.id === row.day_id)?.day_no ?? 1;
        const copy = JSON.parse(JSON.stringify(row));
        copy.dayNoTemp = dayNo;         // show day number instead
        delete copy.day_id;             // hide raw id in form
        delete copy.order_no;           // remove order_no from form (per request)
        this.showDelete = false;
        this.editing = { table:"plan_items", mode:"update", row: copy, title:"編輯行程" };
      },

      openNewDay(){
        const maxNo = this.days.reduce((m,d)=>Math.max(m, d.day_no||0), 0);
        const blank = { day_no: maxNo+1, date:"", title:"", note:"", sort_order: maxNo+1 };
        this.showDelete = false;
        this.editing = { table:"days", mode:"insert", row: blank, title:"新增 Day" };
      },

      openEditDay(day){
        const copy = JSON.parse(JSON.stringify(day));
        this.showDelete = false;
        this.editing = { table:"days", mode:"update", row: copy, title:"編輯 Day" };
      },

      openNewFlight(){
        const blank = { seg_no: 1, flight_no:"", carrier:"", depart_airport:"", arrive_airport:"", depart_time:"", arrive_time:"", note:"" };
        this.showDelete = false;
        this.editing = { table:"flights", mode:"insert", row: blank, title:"新增航程" };
      },
      openEditFlight(row){
        const copy = JSON.parse(JSON.stringify(row));
        this.showDelete = false;
        this.editing = { table:"flights", mode:"update", row: copy, title:"編輯航程" };
      },

      openNewExpense(){
        const dayNo = this.selectedDay?.day_no ?? 1;
        const blank = { dayNoTemp: dayNo, happened_on:"", category:"", merchant:"", amount:null, currency:"JPY", paid_by:"", note:"" };
        this.showDelete = false;
        this.editing = { table:"expenses", mode:"insert", row: blank, title:"新增記帳" };
      },
      openEditExpense(row){
        const dayNo = this.days.find(d => d.id === row.day_id)?.day_no ?? 1;
        const copy = JSON.parse(JSON.stringify(row));
        copy.dayNoTemp = dayNo;
        delete copy.day_id;
        this.showDelete = false;
        this.editing = { table:"expenses", mode:"update", row: copy, title:"編輯記帳" };
      },

      openNewShop(){
        const blank = { name:"", location:"", price_text:"", note:"", done:false, order_no: 1 };
        this.showDelete = false;
        this.editing = { table:"shopping_items", mode:"insert", row: blank, title:"新增購物" };
      },
      openEditShop(row){
        const copy = JSON.parse(JSON.stringify(row));
        // done handled by checkbox in list; keep but don't emphasize in form
        this.showDelete = false;
        this.editing = { table:"shopping_items", mode:"update", row: copy, title:"編輯購物" };
      },

      closeEdit(){
        this.editing = null;
        this.showDelete = false;
      },

      async saveEdit(){
        if (!this.editing) return;
        const { table } = this.editing;
        const row = JSON.parse(JSON.stringify(this.editing.row || {}));

        this.loading = true;
        this.lastError = null;

        try{
          const payload = { ...row };
          delete payload.created_at;
          delete payload.updated_at;

          // Convert dayNoTemp => day_id
          if (table === "plan_items" || table === "expenses"){
            const dayNo = Number(payload.dayNoTemp);
            delete payload.dayNoTemp;

            const day = this.days.find(d => Number(d.day_no) === dayNo);
            if (!day) throw new Error(`Day ${dayNo} 不存在（請先新增 Day）`);
            payload.day_id = day.id;
          }

          // table-specific cleanups
          if (table === "plan_items"){
            // keep time_label/kind/title/note/maps_query
            payload.time_label = payload.time_label || "上午";
            payload.kind = payload.kind || "activity";

            // If insert without order_no: push to bottom within same day+period
            if (!payload.id){
              const dayId = payload.day_id;
              const same = (this.planItems || []).filter(x => x.day_id===dayId && periodFromTimeLabel(x.time_label)===periodFromTimeLabel(payload.time_label));
              const max = same.reduce((m,x)=>Math.max(m, x.order_no||0), 0);
              payload.order_no = max + 1;
            }
          }

          if (table === "shopping_items"){
            payload.done = !!payload.done;
            // order_no default
            if (!payload.order_no) payload.order_no = (this.shopping || []).reduce((m,x)=>Math.max(m,x.order_no||0),0)+1;
          }

          const { error } = await sb.from(table).upsert(payload);
          if (error) throw error;

          this.statusText = "saved";
          this.closeEdit();
          await this.loadAll();
        }catch(e){
          this.setErr(e);
        }finally{
          this.loading = false;
        }
      },

      async delEditing(){
        if (!this.editing) return;
        const t = this.editing.table;
        const id = this.editing.row?.id;
        if (!id) return;
        this.loading = true;
        try{
          const { error } = await sb.from(t).delete().eq("id", id);
          if (error) throw error;
          this.statusText = "deleted";
          this.closeEdit();
          await this.loadAll();
        }catch(e){
          this.setErr(e);
        }finally{
          this.loading = false;
        }
      },

      async toggleShopDone(item){
        try{
          const newVal = !item.done;
          const { error } = await sb.from("shopping_items").upsert({ id: item.id, done: newVal });
          if (error) throw error;
          item.done = newVal; // optimistic update
        }catch(e){
          this.setErr(e);
        }
      },

      // Links: destination -> Google Maps directions from current location
      openMaps(item){
        const q = item?.maps_query || item?.title || "";
        const url = gmapDirUrl(q);
        if (url) window.open(url, "_blank");
      },

      // Debug
      toggleDebug(){
        this.showDebug = !this.showDebug;
      },
      async reload(){
        await this.ping();
        await this.loadAll();
      },
    },

    async mounted(){
      await this.ping();
      await this.loadAll();
      // weather is best-effort
      this.loadWeather();
    },

                <div>
                  <label>航空公司（carrier）</label>
                  <input v-model="editing.row.carrier" placeholder="CX / UO ..." />
                </div>
              </div>
              <div class="grid2">
                <div>
                  <label>航班號（flight_no）</label>
                  <input v-model="editing.row.flight_no" placeholder="581" />
                </div>
                <div>
                  <label>備註（可留空）</label>
                  <input v-model="editing.row.note" placeholder="T1 -> Narita ..." />
                </div>
              </div>
              <div class="grid2">
                <div>
                  <label>出發機場（IATA）</label>
                  <input v-model="editing.row.depart_airport" placeholder="HKG" />
                </div>
                <div>
                  <label>到達機場（IATA）</label>
                  <input v-model="editing.row.arrive_airport" placeholder="NRT" />
                </div>
              </div>
              <div class="grid2">
                <div>
                  <label>出發時間（YYYY-MM-DD HH:MM）</label>
                  <input v-model="editing.row.depart_time" placeholder="2026-01-08 02:00" />
                </div>
                <div>
                  <label>到達時間（YYYY-MM-DD HH:MM）</label>
                  <input v-model="editing.row.arrive_time" placeholder="2026-01-08 07:05" />
                </div>
              </div>
            </template>

            <!-- EXPENSES -->
            <template v-else-if="editing.table==='expenses'">
              <div class="grid2">
                <div>
                  <label>Day（輸入 day number）</label>
                  <input v-model="editing.row.dayNoTemp" inputmode="numeric" placeholder="例如 2" />
                </div>
                <div>
                  <label>日期（YYYY-MM-DD）</label>
                  <input v-model="editing.row.happened_on" placeholder="2026-01-09" />
                </div>
              </div>
              <div class="grid2">
                <div>
                  <label>類別</label>
                  <input v-model="editing.row.category" placeholder="食 / 交通 / ..." />
                </div>
                <div>
                  <label>店名 / 對象</label>
                  <input v-model="editing.row.merchant" />
                </div>
              </div>
              <div class="grid2">
                <div>
                  <label>金額</label>
                  <input v-model.number="editing.row.amount" type="number" step="0.01" />
                </div>
                <div>
                  <label>貨幣</label>
                  <input v-model="editing.row.currency" placeholder="JPY" />
                </div>
              </div>
              <div class="grid2">
                <div>
                  <label>付款人</label>
                  <input v-model="editing.row.paid_by" placeholder="Kin / Aline ..." />
                </div>
                <div></div>
              </div>
              <div class="grid1">
                <div>
                  <label>備註</label>
                  <textarea v-model="editing.row.note"></textarea>
                </div>
              </div>
            </template>

            <!-- SHOPPING -->
            <template v-else-if="editing.table==='shopping_items'">
              <div class="grid2">
                <div>
                  <label>名稱</label>
                  <input v-model="editing.row.name" />
                </div>
                <div>
                  <label>地點（可留空）</label>
                  <input v-model="editing.row.location" />
                </div>
              </div>
              <div class="grid2">
                <div>
                  <label>價錢（文字）</label>
                  <input v-model="editing.row.price_text" placeholder="¥1,500 / 免稅..." />
                </div>
                <div>
                  <label>排序（可留空）</label>
                  <input v-model.number="editing.row.order_no" type="number" />
                </div>
              </div>
              <div class="grid1">
                <div>
                  <label>備註</label>
                  <textarea v-model="editing.row.note"></textarea>
                </div>
              </div>
              <div class="muted" style="margin-top:8px;">
                * done 用清單上的 ✅ 勾選（唔喺呢度改）
              </div>
            </template>

            <div class="modalActions">
              <div class="chipBtn btn" @click="saveEdit()">{{ loading ? '儲存中...' : '儲存' }}</div>
              <div class="chipBtn btn" @click="closeEdit()">取消</div>
              <div class="chipBtn btn dangerBtn" v-if="showDelete && editing && editing.row && editing.row.id" @click="delEditing()">刪除</div>
              <div class="chipBtn btn" @click="showDelete = !showDelete">{{ showDelete ? '隱藏刪除' : '顯示刪除' }}</div>
            </div>
          </div>
        </div>

      </div>

      <!-- Bottom toolbar -->
      <div class="bottomBar">
        <div class="dock">
          <div class="dockBtn btn" :class="{active:view==='plan'}" @click="view='plan'">
            <div class="dockIcon">🗺️</div>
            <div class="dockText">行程</div>
          </div>
          <div class="dockBtn btn" :class="{active:view==='flights'}" @click="view='flights'">
            <div class="dockIcon">✈️</div>
            <div class="dockText">航程</div>
          </div>
          <div class="dockBtn btn" :class="{active:view==='expenses'}" @click="view='expenses'">
            <div class="dockIcon">💴</div>
            <div class="dockText">記帳</div>
          </div>
          <div class="dockBtn btn" :class="{active:view==='shopping'}" @click="view='shopping'">
            <div class="dockIcon">🛍️</div>
            <div class="dockText">購物</div>
          </div>
        </div>
      </div>
    `,

    // expose helpers to template
    methods: {
      // merged methods block (Vue merges but keep explicit for readability)
      ...this?.methods,
      fmtDateZh,
      wEmoji,
      itemEmoji,
      segLabel,
      gmapDirUrl,
    }
  }).mount("#app");
})();
</script>
</body>
</html>

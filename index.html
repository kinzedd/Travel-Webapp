<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Sapporo Snow — Travel App</title>

  <!-- your CSS (optional; keep if you have it) -->
  <link rel="stylesheet" href="./assets/app.css" />

  <!-- Vue (global build) -->
  <script src="./assets/vue.global.prod.js"></script>

  <!-- Supabase JS v2 (UMD global: window.supabase) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{
      --bg1: rgba(12,18,32,.78);
      --bg2: rgba(12,18,32,.62);
      --card: rgba(255,255,255,.07);
      --card2: rgba(255,255,255,.05);
      --bd: rgba(255,255,255,.10);
      --bd2: rgba(255,255,255,.14);
      --txt: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.70);
      --ok: rgba(191,255,209,.40);
      --danger: rgba(255,180,180,.45);
      --shadow: 0 14px 40px rgba(0,0,0,.35);
      --r: 20px;
      --r2: 16px;
      --safeBottom: env(safe-area-inset-bottom);
      --safeTop: env(safe-area-inset-top);

      /* alignment tokens */
      --cardPad: 14px;
      --innerPad: 12px;
    }

    html,body{height:100%;}
    body{
      margin:0;
      color:var(--txt);
      background:
        radial-gradient(1200px 700px at 20% 10%, rgba(160,200,255,.28), transparent 60%),
        radial-gradient(900px 600px at 90% 30%, rgba(255,255,255,.18), transparent 60%),
        linear-gradient(180deg, rgba(240,245,255,.65), rgba(220,230,245,.55)),
        url("./bg.jpg") center/cover no-repeat fixed;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "PingFang HK", "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif;
      overflow-x:hidden;
    }


    a{ color:inherit; text-decoration:none; }
    .muted{color:var(--muted);}
    .mono{font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size:12px;}

    #app{ min-height:100vh; }
    .wrap{
      max-width: 820px;
      margin: 0 auto;
      padding: calc(14px + var(--safeTop)) 12px calc(110px + var(--safeBottom));
    }

    .card{
      background: linear-gradient(180deg, var(--card), var(--card2));
      border: 1px solid var(--bd);
      border-radius: var(--r);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .header{
      padding: 14px;
      display:flex;
      flex-wrap: wrap; /* allow title full width on mobile */
      gap:12px;
      align-items:stretch;
    }

    .kicker{
      font-size:12px;
      letter-spacing:.22em;
      opacity:.75;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .titleRow{ display:flex; gap:10px; align-items:flex-start; }
    .appTitle{
      font-size:44px;
      line-height:1.02;
      font-weight:900;
      margin: 8px 0 2px;

      /* force one-line title on mobile */
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .subTitle{ font-size:16px; font-weight:700; opacity:.8; margin-top:4px; }

    .headerRight{
      margin-left:auto;
      display:flex;
      flex-direction:column;
      align-items:flex-end;
      gap:8px;
      min-width: unset; /* prevent squeezing title */
    }

    /* hide geo coord pill on mobile */
    @media (max-width:420px){
      .headerRight .pill.muted.mono{ display:none; }
    }

    .pill{
      display:inline-flex;
      gap:8px;
      align-items:center;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--bd);
      background: rgba(255,255,255,.06);
      white-space:nowrap;
    }

    .btn{
      user-select:none;
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid var(--bd2);
      background: rgba(255,255,255,.06);
      transition: transform .08s ease, background .15s ease;
      font-weight:800;
    }
    .btn:active{ transform: scale(.98); }
    .btn.ghost{ background: transparent; }
    .btn.small{ padding: 8px 10px; font-weight:800; font-size:13px; }
    .btn.icon{
      width: 38px; height: 38px; padding:0;
      justify-content:center;
      border-radius: 14px;
    }
    .btn.danger{ border-color: var(--danger); color: #ffd3d3; }

    .section{ margin-top: 12px; }
    .sectionHeader{
      padding: 12px 14px;
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:space-between;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .sectionTitle{
      font-size:22px;
      font-weight:900;
    }

    /* ====== day slider (FIX wrap + thinner) ====== */
    .daySlider{
      /* align left edge with period content */
      padding-left: 26px; /* wrap (12) + card (14) => red line */
      padding-right: 14px;
      padding-top: 8px;
      padding-bottom: 12px;
      overflow-x:auto;
      display:flex;
      gap:10px;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
    }
    .daySlider::-webkit-scrollbar{ height: 6px; }
    .daySlider::-webkit-scrollbar-thumb{ background: rgba(255,255,255,.10); border-radius: 999px; }

    /* mobile: day slider single-line pills */
    @media (max-width: 420px){
      .dayTop,
      .dayName,
      .dayDate{
        display:none;
      }
    }

    .dayCard{
      min-width: 190px;
      max-width: 210px;
      scroll-snap-align: start;
      padding: 9px 10px;              /* thinner */
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.05);
      position:relative;
    }
    .dayCard.active{
      border-color: rgba(191,255,209,.35);
      background: rgba(191,255,209,.06);
    }
    .dayTop{
      display:flex;
      align-items:center;
      gap:8px;
      margin-bottom: 6px;
      min-width:0;
    }
    .dayChip{
      display:inline-flex;
      align-items:center;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.20);
      font-weight:1000;
      font-size:13px;
      white-space:nowrap;
    }

    /* Day card main display: Date + Weather (replace title) */
    .dayMain{
      display:flex;
      flex-direction:column;
      gap:6px;
    }
    .dayDateLine{
      font-size:16px;
      font-weight:1000;
      line-height:1.15;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .dayWxLine{
      font-size:13px;
      font-weight:900;
      opacity:.85;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .editMini{
      margin-left:auto;
      width:30px;height:30px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.18);
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      flex:0 0 auto;
    }
    .editMini svg{ width:15px; height:15px; opacity:.92; }

    /* ====== plan ====== */
    .planGrid{
      padding: 12px 14px 14px;
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .period{
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 18px;
      background: rgba(255,255,255,.05);
      overflow:hidden;
    }
    .periodHeader{
      padding: 12px 12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .periodTitle{ font-size:22px; font-weight:1000; }
    .periodBtns{ display:flex; gap:10px; }

    .list{
      display:flex;
      flex-direction:column;
      gap:10px;
      padding: 12px;
    }

    .itemCard{
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 18px;
      background: rgba(255,255,255,.04);
      padding: 12px;
      position:relative;
    }
    .itemTop{
      display:flex;
      align-items:flex-start;
      gap:10px;
    }
    .badgeEmoji{
      width: 26px;
      text-align:center;
      font-size:18px;
      line-height:1;
      margin-top:2px;
      flex:0 0 26px;
    }
    .itemMain{ flex:1; min-width:0; }
    .itemTitle{
      font-weight:1000;
      font-size:18px;
      line-height:1.2;
      margin: 0 0 6px;
      word-break: break-word;
    }
    .itemNote{
      white-space: pre-wrap;
      opacity:.82;
      line-height:1.35;
    }
    .itemActions{
      display:flex;
      gap:8px;
      align-items:center;
      flex:0 0 auto;
    }
    .penBtn{
      width:32px;height:32px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.18);
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
    }
    .penBtn svg{ width:15px; height:15px; opacity:.92; }

    .mapLink{
      display:inline-flex;
      align-items:center;
      gap:8px;
      margin-top:10px;
      padding: 8px 10px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.18);
      font-weight:900;
      max-width: 100%;
    }
    .mapLink span{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    /* ====== flights (smaller) ====== */
    .flightList{ padding: 12px 14px 14px; display:flex; flex-direction:column; gap:12px; }
    .flightCard{
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.05);
      padding: 12px;                 /* smaller */
      overflow:hidden;
      position:relative;
    }
    .flightMeta{
      display:flex; gap:10px; align-items:center; justify-content:space-between;
      margin-bottom: 10px;
      font-weight:1000; opacity:.9;
      font-size:13px;
    }
    .flightRoute{
      display:grid;
      grid-template-columns: 1fr 90px 1fr;
      align-items:center;
      gap:12px;
    }
    .flightSide{
      min-width:0;
      display:flex;
      flex-direction:column;
    }
    .flightCode{ font-size:18px; font-weight:1000; letter-spacing:.02em; }
    .flightTime{ font-size:32px; font-weight:1000; line-height:1; margin-top: 4px; }  /* smaller */
    .flightTerminal{ opacity:.72; font-weight:900; margin-top: 6px; font-size:12px; }
    .flightMid{ display:flex; align-items:center; justify-content:center; }
    .flightLine{
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: rgba(255,255,255,.16);
      position:relative;
    }
    .flightLine:before{
      content:"";
      position:absolute;
      left:0; top:0;
      width: 55%;
      height: 6px;
      border-radius: 999px;
      background: rgba(191,255,209,.38);
    }
    .plane{
      font-size: 16px;
      position:absolute;
      left: 40%;
      top: -11px;
    }

    /* ====== shopping ====== */
    .shopList{ padding: 12px 14px 14px; display:flex; flex-direction:column; gap:10px; }
    .shopRow{
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.04);
      padding: 12px;
      display:flex;
      gap:12px;
      align-items:flex-start;
    }
    .shopRow.done{ opacity:.62; }
    .shopRow.done .shopName{ text-decoration: line-through; }

    .check{
      width: 22px; height: 22px;
      margin-top: 2px;
      accent-color: #bfffd1;
    }
    .shopMain{ flex:1; min-width:0; }
    .shopName{ font-weight:1000; font-size:18px; }
    .shopMeta{ opacity:.75; margin-top: 4px; }

    /* ====== expenses ====== */
    .expList{ padding: 12px 14px 14px; display:flex; flex-direction:column; gap:10px; }
    .expRow{
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.04);
      padding: 12px;
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:flex-start;
    }
    .expLeft{ min-width:0; }
    .expTitle{ font-weight:1000; font-size:18px; }
    .expMeta{ opacity:.75; margin-top: 4px; }
    .expAmt{ font-weight:1000; font-size:18px; white-space:nowrap; }

    /* ====== bottom toolbar ====== */
    .bottomBar{
      position: fixed;
      left: 12px; right: 12px;
      bottom: calc(12px + var(--safeBottom));
      z-index: 30;
      display:flex;
      justify-content:center;
      pointer-events:none;
    }
    .barInner{
      pointer-events:auto;
      width:min(520px, 100%);
      border-radius: 22px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(10,14,24,.72);
      backdrop-filter: blur(12px);
      box-shadow: 0 18px 45px rgba(0,0,0,.38);
      padding: 10px;
      display:flex;
      justify-content:space-between;
      gap:8px;
    }
    .navBtn{
      flex:1;
      border-radius: 18px;
      padding: 10px 6px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.05);
      text-align:center;
      font-weight:1000;
      cursor:pointer;
    }
    .navBtn.active{
      border-color: rgba(191,255,209,.35);
      background: rgba(191,255,209,.08);
    }
    .navIcon{ font-size:20px; line-height:1; display:block; margin-bottom:6px; }

    /* ====== modal ====== */
    .overlay{
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(0,0,0,.52);
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 14px;
    }
    .modal{
      width: min(560px, 96vw);
      max-height: 86vh;
      overflow:auto;
      border-radius: 22px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(14,18,30,.76);
      backdrop-filter: blur(14px);
      box-shadow: 0 20px 55px rgba(0,0,0,.45);
      padding: 14px;
    }
    .modalTop{
      display:flex;
      align-items:center;
      gap:10px;
      margin-bottom: 10px;
    }
    .modalTitle{ font-weight:1000; font-size:18px; }
    .spacer{ flex:1; }

    .grid2{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      align-items: start;
    }
    .grid1{
      display:grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }
    /* Make modal fields align nicely in 2-col layout */
    .grid2 > div,
    .grid1 > div{
      min-width: 0;
    }

    /* unify input/select height so rows line up */
    input, textarea, select{
      width:100%;
      box-sizing:border-box;
      background: rgba(255,255,255,.06);
      color: var(--txt);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 14px;
      padding: 10px 12px;
      outline:none;
      font-size: 15px;
    }

    /* hard align heights for single-line controls */
    input:not([type="checkbox"]),
    select{
      height: 44px;
      line-height: 44px;
      padding-top: 0;
      padding-bottom: 0;
    }

    label{
      display:block;
      font-weight:900;
      opacity:.86;
      margin-bottom: 6px;
      line-height: 1.2;
      word-break: keep-all;
    }
    textarea{ min-height: 110px; resize: vertical; }
    .modalBtns{ display:flex; gap:10px; margin-top: 12px; flex-wrap:wrap; }
    .hint{ opacity:.75; font-size: 13px; line-height: 1.35; }

    /* on small screens, stack the 2-col grid to avoid misalignment */
    @media (max-width: 420px){
      .grid2{
        grid-template-columns: 1fr;
      }
    }

    /* ====== debug panel ====== */
    .debugPanel{
      position: fixed;
      right: 12px;
      top: calc(12px + var(--safeTop));
      z-index: 80;
      width: min(360px, 92vw);
      border-radius: 22px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(10,14,24,.82);
      backdrop-filter: blur(12px);
      box-shadow: 0 22px 60px rgba(0,0,0,.45);
      padding: 12px;
    }
    .debugRow{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .debugTitle{ font-weight:1000; }
    .debugBox{
      margin-top: 10px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.05);
      padding: 10px;
      max-height: 220px;
      overflow:auto;
    }

    /* ====== header small controls ====== */
    .hdrTools{ display:flex; gap:8px; align-items:center; }
    .dbDot{
      width:10px; height:10px; border-radius:999px;
      background: rgba(255,90,90,.9);
      box-shadow: 0 0 0 2px rgba(255,90,90,.18);
    }
    .dbDot.ok{
      background: rgba(120,255,170,.95);
      box-shadow: 0 0 0 2px rgba(120,255,170,.18);
    }
    .miniIconBtn{
      width:38px; height:38px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.18);
      display:flex; align-items:center; justify-content:center;
      cursor:pointer;
    }

    @media (max-width: 420px){
      .appTitle{ font-size: 40px; }
      .headerRight{ min-width: 150px; }
      .dayCard{ min-width: 180px; max-width: 200px; }
      .flightTime{ font-size: 30px; }
    }
  </style>
</head>

<body>
<div id="app"></div>

<script>
(() => {
  const { createApp } = Vue;

  const SUPABASE_URL = "https://qvogojdyykgotuitjkhj.supabase.co";
  const SUPABASE_KEY = "sb_publishable_9rQ7sJQ3bZ_uhnT2hxRUKQ_MJv1icIF";

  const sb = window.supabase?.createClient?.(SUPABASE_URL, SUPABASE_KEY);
  if (!sb) console.error("Supabase client init failed: window.supabase missing?");

  // Hardcode Sapporo weather location
  const SAPPORO = {
    name: "Sapporo",
    label: "札幌 (43.06, 141.35)",
    lat: 43.0618,
    lon: 141.3545,
    timezone: "Asia%2FTokyo"
  };

  const safeStr = (v) => (v == null ? "" : String(v));
  const enc = (s) => encodeURIComponent(String(s ?? ""));

  const bucketOf = (timeLabel = "") => {
    const t = String(timeLabel || "");
    if (t.includes("上午") || t.includes("早") || t.includes("凌晨")) return "am";
    if (t.includes("下午")) return "pm";
    if (t.includes("晚上") || t.includes("夜") || t.includes("宵")) return "night";
    if (t.includes("中午")) return "pm";
    return "am";
  };

  createApp({
    data() {
      return {
        view: "plan", // plan | flights | expenses | shopping

        connected: false,
        statusText: "ready",
        lastError: null,
        loading: false,

        geo: { ok:false, lat:null, lon:null, label:"" },
        weather: { ok:false, temp:null, wind:null, code:null },
        dailyWx: {}, // { "YYYY-MM-DD": { code, tmax, tmin } } (forecast range)

        days: [],
        selectedDayId: null,
        planItems: [],
        flights: [],
        shopping: [],
        expenses: [],

        editing: null, // {table, mode, row, uiDayNo}
        showDelete: false,

        debugOpen: false,
      };
    },

    computed: {
      selectedDay() {
        return this.days.find(d => d.id === this.selectedDayId) || null;
      },

      planForDay() {
        if (!this.selectedDayId) return [];
        return (this.planItems || [])
          .filter(x => x.day_id === this.selectedDayId)
          .sort((a,b) => (a.order_no ?? 0) - (b.order_no ?? 0));
      },

      // Wear: separated from time buckets
      wearOnly() {
        return this.planForDay.filter(x => String(x.kind||"").toLowerCase().includes("wear") || String(x.kind||"").includes("衣"));
      },

      planAM() { return this.groupPeriod("am"); },
      planPM() { return this.groupPeriod("pm"); },
      planNight() { return this.groupPeriod("night"); },
    },

    methods: {
      // ===== FIX: required methods =====
      itemEmoji(kind) {
        const k = String(kind || "").toLowerCase();
        if (k.includes("meal") || k.includes("用餐") || k.includes("食")) return "🍴";
        if (k.includes("wear") || k.includes("衣")) return "👕";
        if (k.includes("hotel") || k.includes("住宿") || k.includes("酒店")) return "🏨";
        if (k.includes("transport") || k.includes("交通")) return "🚇";
        return "📍"; // destination default = pinpoint
      },

      wEmoji(code) {
        if (code == null) return "⛅️";
        const c = Number(code);
        if (c === 0) return "☀️";
        if ([1,2,3].includes(c)) return "⛅️";
        if ([45,48].includes(c)) return "🌫️";
        if ([51,53,55,56,57].includes(c)) return "🌦️";
        if ([61,63,65,66,67].includes(c)) return "🌧️";
        if ([71,73,75,77,85,86].includes(c)) return "❄️";
        if ([80,81,82].includes(c)) return "🌧️";
        if ([95,96,99].includes(c)) return "⛈️";
        return "⛅️";
      },

      penSvg() {
        return `
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9"/>
            <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/>
          </svg>`;
      },

      setErr(e) {
        this.lastError = (e && (e.message || e.error_description)) ? e : { message: String(e) };
        this.statusText = "ERR: " + safeStr(this.lastError.message || this.lastError);
        console.error(e);
      },

      async ping() {
        try {
          const { data, error, status } = await sb
            .from("days")
            .select("id,day_no")
            .order("day_no", { ascending: true })
            .limit(1);

          if (error) throw error;
          this.connected = true;
          this.statusText = `OK (${status})`;
          return data;
        } catch (e) {
          this.connected = false;
          this.setErr(e);
          return null;
        }
      },

      async loadAll() {
        this.loading = true;
        this.lastError = null;
        this.statusText = "loading...";

        try {
          const qDays = await sb
            .from("days")
            .select("id,day_no,date,title,note,sort_order,created_at,updated_at")
            .order("day_no", { ascending: true });
          if (qDays.error) throw qDays.error;
          this.days = qDays.data || [];
          if (!this.selectedDayId && this.days.length) this.selectedDayId = this.days[0].id;

          const qPlan = await sb
            .from("plan_items")
            .select("id,day_id,time_label,kind,title,note,maps_query,order_no,created_at,updated_at")
            .order("order_no", { ascending: true });
          if (qPlan.error) throw qPlan.error;
          this.planItems = qPlan.data || [];

          const qFlights = await sb
            .from("flights")
            .select("id,seg_no,flight_no,carrier,depart_airport,arrive_airport,depart_time,arrive_time,note,created_at,updated_at")
            .order("seg_no", { ascending: true });
          if (qFlights.error) throw qFlights.error;
          this.flights = qFlights.data || [];

          const qShop = await sb
            .from("shopping_items")
            .select("id,name,location,price_text,note,done,order_no,created_at,updated_at")
            .order("order_no", { ascending: true });
          if (qShop.error) throw qShop.error;
          this.shopping = qShop.data || [];

          const qExp = await sb
            .from("expenses")
            .select("id,day_id,happened_on,category,merchant,amount,currency,paid_by,note,created_at,updated_at")
            .order("happened_on", { ascending: true });
          if (qExp.error) throw qExp.error;
          this.expenses = qExp.data || [];

          this.connected = true;
          this.statusText = "loaded";
        } catch (e) {
          this.connected = false;
          this.setErr(e);
        } finally {
          this.loading = false;
        }
      },

      // Group items by period; destinations first then meal; only one meal displayed
      groupPeriod(bucket) {
        const arr = this.planForDay
          .filter(x => bucketOf(x.time_label) === bucket)
          .filter(x => !(String(x.kind||"").toLowerCase().includes("wear") || String(x.kind||"").includes("衣"))); // exclude wear

        const isMeal = (x) => {
          const k = String(x.kind || "");
          const kl = k.toLowerCase();
          return kl.includes("meal") || k.includes("用餐") || k.includes("食");
        };

        const dest = arr.filter(x => !isMeal(x));
        const meals = arr.filter(x => isMeal(x));
        const mealOne = meals.length ? [meals[0]] : [];
        return { dest, mealOne };
      },

      dayIdFromNo(dayNo) {
        const n = Number(dayNo);
        const d = this.days.find(x => Number(x.day_no) === n);
        return d ? d.id : null;
      },

      openNewPlan(kind, periodKey) {
        const periodLabel = (periodKey === "am") ? "上午" : (periodKey === "pm") ? "下午" : "晚上";
        const blank = {
          day_id: this.selectedDayId,
          time_label: periodLabel,
          kind: kind,
          title: "",
          note: "",
          maps_query: "",
          order_no: 1
        };
        this.editing = { table:"plan_items", mode:"insert", row: JSON.parse(JSON.stringify(blank)), uiDayNo: (this.selectedDay?.day_no ?? "") };
        this.showDelete = false;
      },

      openNewDay() {
        const nextNo = (this.days.reduce((m,d)=>Math.max(m, Number(d.day_no||0)),0) || 0) + 1;
        const blank = { day_no: nextNo, date: "", title: "", note: "", sort_order: nextNo };
        this.editing = { table:"days", mode:"insert", row: JSON.parse(JSON.stringify(blank)) };
        this.showDelete = false;
      },

      openEdit(table, row) {
        const r = JSON.parse(JSON.stringify(row));
        const isNew = !r.id;
        const editObj = {
          table,
          mode: isNew ? "insert" : "update",
          row: r
        };
        if (table === "plan_items" || table === "expenses") {
          const d = this.days.find(x => x.id === r.day_id);
          editObj.uiDayNo = d ? d.day_no : "";
        }
        this.editing = editObj;
        this.showDelete = false;
      },

      closeEdit() {
        this.editing = null;
        this.showDelete = false;
      },

      async saveEdit() {
        if (!this.editing) return;
        const { table, mode } = this.editing;
        let payload = { ...this.editing.row };

        this.loading = true;
        this.lastError = null;

        try {
          delete payload.created_at;
          delete payload.updated_at;

          // ---- whitelist payload columns per table (prevents "order_no not found" etc.)
          const pick = (obj, keys) => {
            const out = {};
            keys.forEach((k) => {
              if (Object.prototype.hasOwnProperty.call(obj, k)) out[k] = obj[k];
            });
            return out;
          };

          // ---- sanitize: convert empty strings to null for typed columns (Postgres date/timestamp/number)
          const emptyToNull = (obj, keys) => {
            keys.forEach((k) => {
              if (obj[k] === "") obj[k] = null;
            });
          };
          if (table === "days") {
            // if days.date is a Postgres DATE column, "" will error
            emptyToNull(payload, ["date"]);
          }
          if (table === "expenses") {
            // happened_on is DATE
            emptyToNull(payload, ["happened_on"]);
            // numeric fields sometimes come in as ""
            if (payload.amount === "") payload.amount = null;
          }
          if (table === "flights") {
            // timestamps: "" will also error
            emptyToNull(payload, ["depart_time", "arrive_time"]);
          }

          if (table === "plan_items" || table === "expenses") {
            const uiNo = this.editing.uiDayNo;
            const mapped = this.dayIdFromNo(uiNo);
            if (!mapped) throw new Error("搵唔到 Day number 對應嘅 day_id（請先確保 days 表有呢個 day_no）");
            payload.day_id = mapped;
          }

          if (table === "shopping_items") payload.done = !!payload.done;

          if (table === "plan_items" && (payload.order_no == null || payload.order_no === "")) {
            const max = this.planForDay.reduce((m,x) => Math.max(m, x.order_no || 0), 0);
            payload.order_no = max + 1;
          }

          // apply whitelist at the end (after day_id mapping / auto order_no)
          if (table === "days") {
            payload = pick(payload, ["id","day_no","date","title","note","sort_order"]);
          } else if (table === "plan_items") {
            payload = pick(payload, ["id","day_id","time_label","kind","title","note","maps_query","order_no"]);
          } else if (table === "flights") {
            payload = pick(payload, ["id","seg_no","flight_no","carrier","depart_airport","arrive_airport","depart_time","arrive_time","note"]);
          } else if (table === "shopping_items") {
            payload = pick(payload, ["id","name","location","price_text","note","done","order_no"]);
          } else if (table === "expenses") {
            // IMPORTANT: expenses has NO order_no
            payload = pick(payload, ["id","day_id","happened_on","category","merchant","amount","currency","paid_by","note"]);
          }

          let q;
          if (mode === "insert") {
            // avoid accidentally sending an id on insert
            delete payload.id;
            q = sb.from(table).insert(payload);
          } else {
            if (!payload.id) throw new Error("Update mode missing id");
            const id = payload.id;
            // don't update primary key field itself
            delete payload.id;
            q = sb.from(table).update(payload).eq("id", id);
          }

          const { error } = await q;
          if (error) throw error;

          this.statusText = "saved";
          this.closeEdit();
          await this.loadAll();
        } catch (e) {
          this.setErr(e);
        } finally {
          this.loading = false;
        }
      },

      async delRow(table, id) {
        if (!id) return;
        this.loading = true;
        this.lastError = null;
        try {
          const { error } = await sb.from(table).delete().eq("id", id);
          if (error) throw error;
          this.statusText = "deleted";
          this.closeEdit();
          await this.loadAll();
        } catch (e) {
          this.setErr(e);
        } finally {
          this.loading = false;
        }
      },

      async toggleShopping(row) {
        const payload = { id: row.id, done: !row.done };
        try {
          const { error } = await sb.from("shopping_items").upsert(payload);
          if (error) throw error;
          row.done = !row.done;
          this.statusText = "updated";
        } catch (e) {
          this.setErr(e);
        }
      },

      async openMap(item) {
        const q = item.maps_query || item.title || "";
        if (!q) return;

        let origin = "Current+Location";
        if (this.geo.ok && this.geo.lat != null && this.geo.lon != null) {
          origin = `${this.geo.lat},${this.geo.lon}`;
        }
        const url = `https://www.google.com/maps/dir/?api=1&origin=${enc(origin)}&destination=${enc(q)}&travelmode=transit`;
        window.open(url, "_blank");
      },

      fmtDate(d) {
        if (!d) return "";
        const s = String(d);
        const dt = new Date(s.replace(" ", "T"));
        if (isNaN(dt.getTime())) return s;
        return dt.toLocaleDateString("en-GB", { weekday:"short", day:"2-digit", month:"short", year:"numeric" });
      },

      fmtTime(v) {
        if (!v) return "--:--";
        const s = String(v).replace(" ", "T");
        const dt = new Date(s);
        if (isNaN(dt.getTime())) return String(v).slice(11,16) || String(v);
        const hh = String(dt.getHours()).padStart(2,"0");
        const mm = String(dt.getMinutes()).padStart(2,"0");
        return `${hh}:${mm}`;
      },

      // Day card: date line in zh-HK
      fmtZhDay(dateStr){
        if (!dateStr) return "-";
        const dt = new Date(String(dateStr).slice(0,10) + "T00:00:00");
        if (isNaN(dt.getTime())) return String(dateStr);
        const y = dt.getFullYear();
        const m = dt.getMonth() + 1;
        const d = dt.getDate();
        const wk = dt.toLocaleDateString("zh-HK", { weekday:"short" });
        return `${y}/${m}/${d} ${wk}`;
      },

      // Day card: weather text (forecast window only)
      dayWxText(dateStr){
        const key = String(dateStr || "").slice(0,10);
        const w = this.dailyWx?.[key];
        if (!w) return "（天氣未有資料）";
        const hi = (w.tmax == null) ? "?" : Math.round(w.tmax);
        const lo = (w.tmin == null) ? "?" : Math.round(w.tmin);
        return `${this.wEmoji(w.code)} ${hi}° / ${lo}°`;
      },

      async initGeoAndWeather() {
        // Hardcoded to Sapporo (no geolocation prompt)
        try {
          const lat = SAPPORO.lat;
          const lon = SAPPORO.lon;

          this.geo = { ok:true, lat, lon, label: SAPPORO.label };

          // current weather
          const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code,wind_speed_10m&timezone=${SAPPORO.timezone}`;
          const r = await fetch(url);
          const j = await r.json();
          const cur = j?.current || {};
          this.weather = {
            ok: true,
            temp: cur.temperature_2m,
            code: cur.weather_code,
            wind: cur.wind_speed_10m
          };

          // daily forecast (usually next ~16 days)
          try{
            const dailyUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}`
              + `&daily=weather_code,temperature_2m_max,temperature_2m_min`
              + `&forecast_days=16`
              + `&timezone=${SAPPORO.timezone}`;

            const r2 = await fetch(dailyUrl);
            const j2 = await r2.json();
            const t = j2?.daily?.time || [];
            const code = j2?.daily?.weather_code || [];
            const tmax = j2?.daily?.temperature_2m_max || [];
            const tmin = j2?.daily?.temperature_2m_min || [];

            const map = {};
            for (let i=0; i<t.length; i++){
              const k = String(t[i]).slice(0,10);
              map[k] = { code: code[i], tmax: tmax[i], tmin: tmin[i] };
            }
            this.dailyWx = map;
          } catch (_e) {
            this.dailyWx = {};
          }

        } catch (e) {
          this.geo = { ok:false, lat:null, lon:null, label:"" };
          this.weather = { ok:false, temp:null, wind:null, code:null };
          this.dailyWx = {};
        }
      },

      viewLabel(v){
        return ({ plan:"行程", flights:"航程", expenses:"記帳", shopping:"購物" })[v] || v;
      },

      editTitle(){
        if (!this.editing) return "";
        const t = this.editing.table;
        if (t === "days") return (this.editing.mode === "insert" ? "新增 Day" : "編輯 Day");
        if (t === "plan_items") return (this.editing.mode === "insert" ? "新增項目" : "編輯項目");
        if (t === "flights") return (this.editing.mode === "insert" ? "新增航程" : "編輯航程");
        if (t === "shopping_items") return (this.editing.mode === "insert" ? "新增購物" : "編輯購物");
        if (t === "expenses") return (this.editing.mode === "insert" ? "新增記帳" : "編輯記帳");
        return "編輯";
      },
    },

    async mounted() {
      await this.initGeoAndWeather();
      await this.ping();
      await this.loadAll();
    },

                      <div class="itemMain">
                        <div class="itemTitle">{{ x.title }}</div>
                        <div class="itemNote muted" v-if="x.note">{{ x.note }}</div>
                      </div>
                      <div class="itemActions">
                        <div class="penBtn" @click="openEdit('plan_items', x)" v-html="penSvg()"></div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>

            </div>

            <div class="muted" style="padding: 12px 14px 14px;" v-else>
              未選 Day。
            </div>
          </template>

          <!-- FLIGHTS -->
          <template v-else-if="view==='flights'">
            <div class="flightList">
              <div class="flightCard" v-for="f in flights" :key="f.id">
                <div class="flightMeta">
                  <div>{{ fmtDate(f.depart_time) }}</div>
                  <div style="opacity:.85;">{{ (f.carrier||'') + (f.flight_no||'') }}</div>
                  <div class="penBtn" style="width:32px;height:32px;" @click="openEdit('flights', f)" v-html="penSvg()"></div>
                </div>

                <div class="flightRoute">
                  <div class="flightSide">
                    <div class="flightCode">{{ f.depart_airport || '---' }}</div>
                    <div class="flightTime">{{ fmtTime(f.depart_time) }}</div>
                    <div class="flightTerminal">{{ f.note || ' ' }}</div>
                  </div>

                  <div class="flightMid">
                    <div class="flightLine"><span class="plane">✈️</span></div>
                  </div>

                  <div class="flightSide" style="text-align:right;">
                    <div class="flightCode">{{ f.arrive_airport || '---' }}</div>
                    <div class="flightTime">{{ fmtTime(f.arrive_time) }}</div>
                    <div class="flightTerminal">&nbsp;</div>
                  </div>
                </div>
              </div>

              <div class="muted" v-if="flights.length===0">（未有航程）</div>
            </div>
          </template>

          <!-- EXPENSES -->
          <template v-else-if="view==='expenses'">
            <div class="expList">
              <div class="expRow" v-for="e in expenses" :key="e.id">
                <div class="expLeft">
                  <div class="expTitle">{{ e.merchant || '（未命名）' }}</div>
                  <div class="expMeta">{{ e.happened_on || '' }} · {{ e.category || '' }} · {{ e.paid_by || '' }}</div>
                  <div class="expMeta" v-if="e.note">{{ e.note }}</div>
                </div>
                <div style="display:flex; gap:10px; align-items:center;">
                  <div class="expAmt">{{ e.amount }} {{ e.currency }}</div>
                  <div class="penBtn" @click="openEdit('expenses', e)" v-html="penSvg()"></div>
                </div>
              </div>

              <div class="muted" v-if="expenses.length===0">（未有記帳）</div>
            </div>
          </template>

          <!-- SHOPPING -->
          <template v-else-if="view==='shopping'">
            <div class="shopList">
              <div class="shopRow" :class="{done: s.done}" v-for="s in shopping" :key="s.id">
                <input class="check" type="checkbox" :checked="!!s.done" @change="toggleShopping(s)" />
                <div class="shopMain">
                  <div class="shopName">{{ s.name || '（未命名）' }}</div>
                  <div class="shopMeta" v-if="s.location">{{ s.location }}</div>
                  <div class="shopMeta" v-if="s.price_text">{{ s.price_text }}</div>
                  <div class="shopMeta" v-if="s.note">{{ s.note }}</div>
                </div>
                <div class="penBtn" @click="openEdit('shopping_items', s)" v-html="penSvg()"></div>
              </div>

              <div class="muted" v-if="shopping.length===0">（未有購物清單）</div>
            </div>
          </template>
        </div>
      </div>

      <!-- bottom toolbar -->
      <div class="bottomBar">
        <div class="barInner">
          <div class="navBtn" :class="{active:view==='plan'}" @click="view='plan'">
            <span class="navIcon">📍</span>行程
          </div>
          <div class="navBtn" :class="{active:view==='flights'}" @click="view='flights'">
            <span class="navIcon">✈️</span>航程
          </div>
          <div class="navBtn" :class="{active:view==='expenses'}" @click="view='expenses'">
            <span class="navIcon">💴</span>記帳
          </div>
          <div class="navBtn" :class="{active:view==='shopping'}" @click="view='shopping'">
            <span class="navIcon">🛍️</span>購物
          </div>
        </div>
      </div>

      <!-- Debug panel -->
      <div class="debugPanel" v-if="debugOpen">
        <div class="debugRow">
          <div class="debugTitle">🛠️ Debug</div>
          <div class="btn small" @click="debugOpen=false">關閉</div>
        </div>

        <div class="debugBox">
          <div class="mono muted">Vue: {{ Vue?.version || 'unknown' }}</div>
          <div class="mono muted">DB: {{ connected ? 'OK' : 'ERR' }}</div>
          <div class="mono muted">status: {{ statusText }}</div>
          <div class="mono muted" style="margin-top:10px;">wx: hardcoded → Sapporo</div>
          <div class="mono muted" v-if="lastError" style="margin-top:10px; white-space:pre-wrap;">
            error: {{ lastError.message || lastError }}
          </div>
        </div>
      </div>

      <!-- EDIT MODAL -->
      <div class="overlay" v-if="editing" @click.self="closeEdit()">
        <div class="modal">
          <div class="modalTop">
            <div class="modalTitle">{{ editTitle() }}</div>
            <div class="spacer"></div>
            <div class="btn small" @click="closeEdit()">關閉</div>
          </div>

          <!-- Days -->
          <div v-if="editing.table==='days'">
            <div class="grid2">
              <div>
                <label>第幾日</label>
                <input v-model.number="editing.row.day_no" type="number" />
              </div>
              <div>
                <label>日期</label>
                <input v-model="editing.row.date" placeholder="YYYY-MM-DD" />
              </div>
            </div>
            <div class="grid1" style="margin-top:12px;">
              <div>
                <label>標題</label>
                <input v-model="editing.row.title" placeholder="例如：Day 2 1/9 星期五" />
              </div>
              <div>
                <label>備註</label>
                <textarea v-model="editing.row.note"></textarea>
              </div>
            </div>
          </div>

          <!-- Plan items -->
          <div v-else-if="editing.table==='plan_items'">
            <div class="grid2">
              <div>
                <label>Day（輸入 day number）</label>
                <input v-model.number="editing.uiDayNo" type="number" placeholder="例如 1" />
              </div>
              <div>
                <label>時段</label>
                <select v-model="editing.row.time_label">
                  <option value="上午">上午</option>
                  <option value="下午">下午</option>
                  <option value="晚上">晚上</option>
                </select>
              </div>
            </div>

            <div class="grid2" style="margin-top:12px;">
              <div>
                <label>類型</label>
                <select v-model="editing.row.kind">
                  <option value="dest">行程（📍）</option>
                  <option value="meal">用餐（🍴）</option>
                  <option value="wear">衣著（👕）</option>
                  <option value="hotel">酒店（🏨）</option>
                  <option value="transport">交通（🚇）</option>
                </select>
              </div>
              <div>
                <label>Google Map 搜尋字（可留空）</label>
                <input v-model="editing.row.maps_query" placeholder="例如：札幌 PARCO / 北海道神宮" />
              </div>
            </div>

            <div class="grid1" style="margin-top:12px;">
              <div>
                <label>標題</label>
                <input v-model="editing.row.title" />
              </div>
              <div>
                <label>備註</label>
                <textarea v-model="editing.row.note"></textarea>
              </div>
              <div class="hint muted">
                * 刪除按鈕會喺你按「顯示刪除」先出現。
              </div>
            </div>
          </div>

          <!-- Flights -->
          <div v-else-if="editing.table==='flights'">
            <div class="grid2">
              <div>
                <label>段數</label>
                <input v-model.number="editing.row.seg_no" type="number" />
              </div>
              <div>
                <label>航空公司</label>
                <input v-model="editing.row.carrier" placeholder="CX / UO / ..." />
              </div>
            </div>

            <div class="grid2" style="margin-top:12px;">
              <div>
                <label>航班號</label>
                <input v-model="editing.row.flight_no" placeholder="581" />
              </div>
              <div></div>
            </div>

            <div class="grid2" style="margin-top:12px;">
              <div>
                <label>出發機場</label>
                <input v-model="editing.row.depart_airport" placeholder="HKG / NRT / CTS" />
              </div>
              <div>
                <label>到達機場</label>
                <input v-model="editing.row.arrive_airport" placeholder="CTS / HKG / ..." />
              </div>
            </div>

            <div class="grid2" style="margin-top:12px;">
              <div>
                <label>出發時間</label>
                <input v-model="editing.row.depart_time" placeholder="2026-01-08 02:00:00+08" />
              </div>
              <div>
                <label>到達時間</label>
                <input v-model="editing.row.arrive_time" placeholder="2026-01-08 07:05:00+09" />
              </div>
            </div>

            <div class="grid1" style="margin-top:12px;">
              <div>
                <label>備註</label>
                <textarea v-model="editing.row.note"></textarea>
              </div>
            </div>
          </div>

          <!-- Shopping -->
          <div v-else-if="editing.table==='shopping_items'">
            <div class="grid2">
              <div>
                <label>名稱</label>
                <input v-model="editing.row.name" />
              </div>
              <div>
                <label>地點</label>
                <input v-model="editing.row.location" />
              </div>
            </div>

            <div class="grid2" style="margin-top:12px;">
              <div>
                <label>價錢（文字）</label>
                <input v-model="editing.row.price_text" />
              </div>
              <div>
                <label>已買？</label>
                <select v-model="editing.row.done">
                  <option :value="false">未買</option>
                  <option :value="true">已買</option>
                </select>
              </div>
            </div>

            <div class="grid1" style="margin-top:12px;">
              <div>
                <label>備註</label>
                <textarea v-model="editing.row.note"></textarea>
              </div>
              <div class="hint muted">* done 用清單上的 ✅ 勾選（暗啲+刪線）都得。</div>
            </div>
          </div>

          <!-- Expenses -->
          <div v-else-if="editing.table==='expenses'">
            <div class="grid2">
              <div>
                <label>Day（輸入 day number）</label>
                <input v-model.number="editing.uiDayNo" type="number" placeholder="例如 2" />
              </div>
              <div>
                <label>日期</label>
                <input v-model="editing.row.happened_on" placeholder="YYYY-MM-DD" />
              </div>
            </div>

            <div class="grid2" style="margin-top:12px;">
              <div>
                <label>類別</label>
                <input v-model="editing.row.category" placeholder="交通 / 食 / ..." />
              </div>
              <div>
                <label>商戶</label>
                <input v-model="editing.row.merchant" />
              </div>
            </div>

            <div class="grid2" style="margin-top:12px;">
              <div>
                <label>金額</label>
                <input v-model.number="editing.row.amount" type="number" step="0.01" />
              </div>
              <div>
                <label>貨幣</label>
                <input v-model="editing.row.currency" placeholder="JPY" />
              </div>
            </div>

            <div class="grid2" style="margin-top:12px;">
              <div>
                <label>付款人</label>
                <input v-model="editing.row.paid_by" placeholder="Kin / Aline" />
              </div>
              <div></div>
            </div>

            <div class="grid1" style="margin-top:12px;">
              <div>
                <label>備註</label>
                <textarea v-model="editing.row.note"></textarea>
              </div>
            </div>
          </div>

          <div v-else class="muted">unknown editor</div>

          <div class="modalBtns">
            <div class="btn" @click="saveEdit()">{{ loading ? '儲存中...' : '儲存' }}</div>
            <div class="btn ghost" @click="closeEdit()">取消</div>
            <div class="btn danger" v-if="editing.mode==='update' && editing.row.id" @click="delRow(editing.table, editing.row.id)">
              刪除
            </div>
          </div>
        </div>
      </div>
    `
  }).mount("#app");
})();
</script>
</body>
</html>

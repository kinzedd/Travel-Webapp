<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Sapporo Snow — Travel App</title>

  <!-- your CSS (optional, can be empty) -->
  <link rel="stylesheet" href="./assets/app.css" />

  <!-- Vue (global build) -->
  <script src="./assets/vue.global.prod.js"></script>

  <!-- Supabase JS v2 (UMD global: window.supabase) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{
      --bg:#0b1220;
      --card: rgba(255,255,255,.07);
      --card2: rgba(255,255,255,.05);
      --stroke: rgba(255,255,255,.10);
      --stroke2: rgba(255,255,255,.14);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.70);
      --ok: rgba(191,255,209,.95);
      --danger: rgba(255,180,180,.95);
      --shadow: 0 18px 60px rgba(0,0,0,.55);
      --radius: 22px;
      --radius2: 18px;
    }
    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      color:var(--text);
      background: var(--bg);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      overflow-x:hidden;
    }

    /* bg.jpg is OUTSIDE assets folder */
    body::before{
      content:"";
      position:fixed; inset:0;
      background:
        radial-gradient(1200px 800px at 18% 8%, rgba(54,130,255,.18), transparent 60%),
        radial-gradient(900px 700px at 80% 0%, rgba(0,255,210,.10), transparent 55%),
        radial-gradient(900px 800px at 20% 100%, rgba(255,255,255,.10), transparent 60%),
        url("./bg.jpg");
      background-size: cover;
      background-position: center;
      opacity:.55;
      z-index:-2;
    }
    body::after{
      content:"";
      position:fixed; inset:0;
      background: linear-gradient(180deg, rgba(11,18,32,.70), rgba(11,18,32,.92));
      z-index:-1;
    }

    a{ color:inherit; text-decoration:none; }
    .muted{ color:var(--muted); }
    .mono{ font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono","Courier New", monospace; font-size:12px; }
    .btn{ cursor:pointer; user-select:none; -webkit-tap-highlight-color: transparent; }
    .btn:active{ transform: translateY(1px); }

    /* Wider mobile layout */
    .wrap{
      max-width: 760px;
      margin: 0 auto;
      padding: 14px 14px 118px;
    }

    .card{
      background: var(--card);
      border:1px solid var(--stroke);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }
    .cardInner{
      background: var(--card2);
      border:1px solid rgba(255,255,255,.08);
      border-radius: var(--radius2);
    }

    /* Header */
    .header{ padding:14px; }
    .kicker{
      letter-spacing:.26em; font-size:12px;
      color: rgba(255,255,255,.62);
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .titleRow{ display:flex; align-items:flex-start; gap:12px; margin-top:8px; }
    .appTitle{ font-weight:900; font-size:44px; line-height:.95; }
    .subTitle{ margin-top:10px; font-weight:700; color: rgba(255,255,255,.72); font-size:18px; }

    .headerRight{
      margin-left:auto;
      display:flex;
      flex-direction:column;
      gap:10px;
      align-items:flex-end;
      min-width: 180px;
    }
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:.42rem .72rem; border-radius:999px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.18);
      white-space:nowrap;
    }
    .pill.ok{ border-color: rgba(191,255,209,.35); color: var(--ok); }
    .pill.bad{ border-color: rgba(255,180,180,.35); color: var(--danger); }
    .miniBtn{
      width:42px; height:42px; border-radius:999px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.18);
      display:flex; align-items:center; justify-content:center;
      font-size:18px;
    }
    .chipBtn{
      display:inline-flex; align-items:center; justify-content:center;
      padding:.55rem .85rem; border-radius:999px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      font-weight:900;
    }

    /* Sections */
    .section{ margin-top:12px; padding:12px; }
    .sectionHead{
      display:flex; align-items:center; gap:10px;
      padding: 6px 2px 10px;
    }
    .sectionTitle{ font-weight:900; font-size:22px; }
    .sectionHead .right{ margin-left:auto; display:flex; gap:10px; }

    /* Day slider (thin + aligned) */
    .daysSlider{
      display:flex; gap:10px; overflow-x:auto;
      padding:10px 2px 6px;
      scroll-snap-type:x mandatory;
    }
    .dayCard{
      scroll-snap-align:start;
      min-width: 210px; max-width:210px;
      padding: 10px 12px;
      border-radius:18px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.05);
    }
    .dayCard.active{
      border-color: rgba(191,255,209,.35);
      background: rgba(191,255,209,.06);
    }
    .dayTop{ display:flex; align-items:center; gap:10px; }
    .dayBadge{
      padding:.25rem .6rem; border-radius:999px;
      border:1px solid rgba(255,255,255,.14);
      font-weight:900;
      flex:0 0 auto;
    }
    .dayDate{
      margin-left:auto;
      font-weight:900;
      color: rgba(255,255,255,.76);
      flex:1 1 auto;
      text-align:right;
    }
    .penBtn{
      width:30px; height:30px; border-radius:999px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.18);
      display:flex; align-items:center; justify-content:center;
      flex:0 0 auto;
    }
    .penBtn svg{ width:15px; height:15px; }

    /* Day summary card (align visually with period cards) */
    .daySummary{
      margin-top:12px;
      padding:12px;
    }
    .daySummaryTop{
      display:flex; align-items:center; gap:10px;
    }
    .daySummaryTitle{
      font-weight:950;
      font-size:18px;
      line-height:1.15;
      flex:1 1 auto;
      min-width:0;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .daySummaryDate{ color: rgba(255,255,255,.72); font-weight:900; }

    /* Period */
    .periodCard{ margin-top:12px; padding:12px; }
    .periodHead{
      display:flex; align-items:center; gap:10px;
      padding:2px 2px 10px;
    }
    .periodName{ font-weight:950; font-size:20px; }
    .periodHead .right{ margin-left:auto; display:flex; gap:10px; }

    .list{ display:flex; flex-direction:column; gap:10px; }
    .itemCard{
      padding:12px; border-radius:18px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.04);
    }
    .itemTop{ display:flex; align-items:flex-start; gap:10px; }
    .itemIcon{
      width:28px; height:28px; border-radius:10px;
      background: rgba(0,0,0,.18);
      border:1px solid rgba(255,255,255,.10);
      display:flex; align-items:center; justify-content:center;
      flex:0 0 auto; font-size:16px;
    }
    .itemMain{ flex:1 1 auto; min-width:0; }
    .itemTitle{
      font-weight:950;
      font-size:18px;
      line-height:1.15;
      word-break:break-word;
    }
    .itemNote{
      margin-top:8px;
      color: rgba(255,255,255,.72);
      white-space:pre-wrap;
      line-height:1.35;
    }
    .mapsLink{
      margin-top:8px;
      display:inline-flex; gap:8px; align-items:center;
      padding:.35rem .6rem; border-radius:999px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.16);
      font-weight:900; font-size:13px;
    }

    /* Flights: light card style like sample */
    .flightCard{
      background: rgba(255,255,255,.92);
      color: rgba(0,0,0,.86);
      border-radius: 18px;
      padding: 14px;
      border: 1px solid rgba(255,255,255,.55);
      box-shadow: 0 18px 50px rgba(0,0,0,.35);
    }
    .flightTopRow{
      display:flex; gap:10px; align-items:center; flex-wrap:wrap;
      color: rgba(0,0,0,.55);
      font-weight:800;
    }
    .flightRoute{
      margin-top:8px;
      font-size: 28px;
      font-weight: 950;
      color: rgba(0,0,0,.80);
    }
    .flightMid{
      display:flex;
      align-items:center;
      gap:12px;
      margin-top:10px;
    }
    .flightCol{
      flex:1 1 0;
      min-width:0;
    }
    .flightIata{
      font-weight:950;
      font-size: 30px;
      color: rgba(0,0,0,.70);
    }
    .flightTime{
      font-weight:950;
      font-size: 44px;
      line-height:1.0;
      margin-top:2px;
      color: rgba(0,0,0,.82);
    }
    .flightTerm{
      margin-top:6px;
      color: rgba(0,0,0,.55);
      font-weight:800;
    }
    .flightLine{
      flex: 1.2 1 0;
      display:flex;
      align-items:center;
      justify-content:center;
      min-width: 120px;
      color: rgba(0,0,0,.45);
      position:relative;
    }
    .flightLine::before{
      content:"";
      height:6px;
      width:100%;
      border-radius:999px;
      background: rgba(0,0,0,.12);
      display:block;
    }
    .plane{
      position:absolute;
      font-size:22px;
      transform: translateY(-14px);
    }
    .dur{
      position:absolute;
      top:-18px;
      font-weight:900;
      color: rgba(0,0,0,.55);
    }

    /* Shopping */
    .shopRow{
      display:flex; gap:10px; align-items:flex-start;
    }
    .checkbox{
      width:22px; height:22px;
      border-radius:8px;
      border:1px solid rgba(255,255,255,.28);
      background: rgba(0,0,0,.18);
      display:flex; align-items:center; justify-content:center;
      flex:0 0 auto;
    }
    .checkbox.on{
      border-color: rgba(191,255,209,.40);
      background: rgba(191,255,209,.16);
    }
    .shopTitle{
      font-weight:950; font-size:18px; line-height:1.15;
    }
    .strike{
      text-decoration: line-through;
      opacity: .55;
    }
    .shopMeta{
      margin-top:6px;
      color: rgba(255,255,255,.72);
      font-weight:700;
    }

    /* Expenses */
    .expAmt{
      margin-left:auto;
      font-weight:950;
      color: rgba(255,255,255,.92);
      white-space:nowrap;
    }
    .expPill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:.25rem .6rem;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.16);
      font-weight:900;
      font-size:12px;
      color: rgba(255,255,255,.78);
    }

    /* Bottom toolbar */
    .toolbar{
      position:fixed; left:0; right:0; bottom:10px;
      padding:0 14px; z-index:50; pointer-events:none;
    }
    .toolbarInner{
      pointer-events:auto;
      max-width:760px; margin:0 auto;
      padding:10px; border-radius:22px;
      background: rgba(0,0,0,.22);
      border:1px solid rgba(255,255,255,.10);
      backdrop-filter: blur(14px);
      display:flex; gap:10px; justify-content:space-between;
    }
    .tabBtn{
      flex:1 1 0;
      border-radius:18px;
      padding:10px 8px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.06);
      text-align:center;
      font-weight:900;
      min-width:0;
    }
    .tabBtn.active{
      border-color: rgba(191,255,209,.35);
      background: rgba(191,255,209,.10);
    }
    .tabBtn .ico{ font-size:18px; display:block; }
    .tabBtn .lbl{ font-size:12px; opacity:.9; margin-top:4px; }

    /* Debug (small button top-right replacing DB) */
    .debugModalWrap{
      position:fixed; inset:0;
      background: rgba(0,0,0,.45);
      display:flex;
      align-items:flex-start;
      justify-content:center;
      padding: 68px 14px 14px;
      z-index:200;
    }
    .debugModal{
      width: min(720px, 98vw);
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.35);
      backdrop-filter: blur(14px);
      box-shadow: var(--shadow);
      padding: 12px;
    }
    .debugRow{
      display:flex; gap:10px; align-items:center; flex-wrap:wrap;
    }

    /* Edit modal (center, symmetric) */
    .modalWrap{
      position:fixed; inset:0;
      background: rgba(0,0,0,.55);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:14px;
      z-index:300;
    }
    .modal{
      width: min(760px, 98vw);
      max-height: 90vh;
      overflow:auto;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.35);
      backdrop-filter: blur(14px);
      box-shadow: var(--shadow);
      padding: 14px;
    }
    .modalHead{
      display:flex; align-items:center; gap:10px;
      position:sticky; top:0;
      background: rgba(0,0,0,.25);
      backdrop-filter: blur(14px);
      border-radius: 14px;
      padding:10px;
      border:1px solid rgba(255,255,255,.10);
      z-index:1;
    }
    .modalTitle{
      font-weight:950;
      font-size:18px;
      flex:1 1 auto;
      min-width:0;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .modalActions{ display:flex; gap:10px; }
    .dangerBtn{
      border-color: rgba(255,180,180,.35) !important;
      color: rgba(255,180,180,.95);
    }
    .grid2{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:12px;
      margin-top:12px;
    }
    .grid1{
      display:grid;
      grid-template-columns: 1fr;
      gap:12px;
      margin-top:12px;
    }
    label{
      display:block;
      font-size:12px;
      color: rgba(255,255,255,.70);
      font-weight:900;
      margin-bottom:6px;
      letter-spacing:.04em;
    }
    input, textarea, select{
      width:100%;
      background: rgba(0,0,0,.25);
      color: #fff;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 14px;
      padding: .7rem .8rem;
      outline:none;
      font-size:16px;
    }
    textarea{ min-height: 92px; resize: vertical; }

    /* remove ugly long labels on small screens */
    @media (max-width: 520px){
      .appTitle{ font-size: 40px; }
      .headerRight{ min-width: 150px; }
      .dayCard{ min-width: 200px; max-width:200px; }
      .flightRoute{ font-size: 24px; }
      .flightTime{ font-size: 40px; }
      .grid2{ grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
<div id="app"></div>

<script>
(() => {
  if (!window.Vue) throw new Error("Vue not loaded: check ./assets/vue.global.prod.js path");
  if (!window.supabase) throw new Error("Supabase not loaded: CDN blocked?");

  const { createApp } = window.Vue;

  // ============
  // CONFIG
  // ============
  const SUPABASE_URL = "https://qvogojdyykgotuitjkhj.supabase.co";
  const SUPABASE_KEY = "sb_publishable_9rQ7sJQ3bZ_uhnT2hxRUKQ_MJv1icIF";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const safeStr = (v) => (v == null ? "" : String(v));

  const mapsDirUrl = (query) => {
    const q = (query || "").trim();
    if (!q) return "";
    return `https://www.google.com/maps/dir/?api=1&origin=Current+Location&destination=${encodeURIComponent(q)}`;
  };

  const toPeriodKey = (timeLabel) => {
    const s = (timeLabel || "").trim();
    if (!s) return "am";
    if (["上午","早上","凌晨"].includes(s)) return "am";
    if (["下午","中午"].includes(s)) return "pm";
    if (["晚上","夜晚"].includes(s)) return "night";
    if (s.includes("上") || s.includes("早") || s.includes("凌")) return "am";
    if (s.includes("下") || s.includes("中")) return "pm";
    if (s.includes("晚") || s.includes("夜")) return "night";
    return "am";
  };

  const isMeal = (row) => {
    const k = (row?.kind || "").toLowerCase();
    return k === "food" || k === "meal" || k === "用餐";
  };
  const isWear = (row) => {
    const k = (row?.kind || "").toLowerCase();
    return k === "wear" || k === "衣著";
  };

  const parseTs = (v) => {
    // accept "2026-01-13 16:00" / ISO / empty
    if (!v) return null;
    const s = String(v).trim();
    const iso = s.includes("T") ? s : s.replace(" ", "T");
    const d = new Date(iso);
    if (Number.isNaN(+d)) return null;
    return d;
  };

  const fmtHM = (d) => {
    try{
      return new Intl.DateTimeFormat("en-GB", {
        timeZone: "Asia/Tokyo",
        hour12:false,
        hour:"2-digit", minute:"2-digit"
      }).format(d);
    } catch(e){
      return String(d).slice(16,21);
    }
  };

  const fmtDate = (d) => {
    try{
      return new Intl.DateTimeFormat("en-GB", {
        timeZone: "Asia/Tokyo",
        weekday:"short",
        day:"2-digit",
        month:"short",
        year:"numeric"
      }).format(d);
    } catch(e){
      return d.toDateString();
    }
  };

  const wEmoji = (code) => {
    if (code == null) return "☁️";
    if ([0].includes(code)) return "☀️";
    if ([1,2,3].includes(code)) return "⛅️";
    if ([45,48].includes(code)) return "🌫️";
    if ([51,53,55,61,63,65,80,81,82].includes(code)) return "🌧️";
    if ([71,73,75,85,86].includes(code)) return "❄️";
    if ([95,96,99].includes(code)) return "⛈️";
    return "☁️";
  };

  createApp({
    data(){
      return {
        view: "plan", // plan | flights | expenses | shopping
        statusText: "ready",
        lastError: null,
        connected: false,
        loading: false,

        // data
        days: [],
        selectedDayId: null,
        planItems: [],
        flights: [],
        shopping: [],
        expenses: [],

        // weather
        weather: { ok:false, temp:null, wind:null, code:null, lat:null, lon:null },

        // debug
        showDebug: false,

        // editor
        editing: null,   // { table, mode, row, title }
        showDelete: false,

        kindOptions: [
          { value:"activity", label:"行程" },
          { value:"food", label:"用餐" },
          { value:"wear", label:"衣著" },
          { value:"transport", label:"交通" },
          { value:"hotel", label:"酒店" },
        ],
        periodOptions: [
          { value:"上午", label:"上午" },
          { value:"下午", label:"下午" },
          { value:"晚上", label:"晚上" },
          { value:"", label:"（自動）" },
        ],
      };
    },

    computed:{
      selectedDay(){
        return this.days.find(d => d.id === this.selectedDayId) || null;
      },
      selectedDayNo(){
        return this.selectedDay?.day_no ?? null;
      },
      selectedPlanItems(){
        if (!this.selectedDayId) return [];
        return (this.planItems || []).filter(x => x.day_id === this.selectedDayId);
      },
      wearItems(){
        return this.selectedPlanItems
          .filter(x => isWear(x))
          .sort((a,b) => (a.order_no ?? 0) - (b.order_no ?? 0));
      },
      periodGroups(){
        const base = this.selectedPlanItems.filter(x => !isWear(x));
        const groups = { am:[], pm:[], night:[] };

        for (const it of base){
          const pk = toPeriodKey(it.time_label);
          (groups[pk] ||= []).push(it);
        }

        const out = {};
        for (const k of ["am","pm","night"]){
          const items = (groups[k] || []).slice().sort((a,b) => (a.order_no ?? 0) - (b.order_no ?? 0));
          const dest = items.filter(x => !isMeal(x));
          const meal = items.filter(x => isMeal(x));
          out[k] = { dest, meal: meal.length ? [meal[0]] : [] };
        }
        return out;
      },

      flightsSorted(){
        return (this.flights || []).slice().sort((a,b) => (a.seg_no ?? 0) - (b.seg_no ?? 0));
      },

      shoppingSorted(){
        return (this.shopping || []).slice().sort((a,b) => (a.order_no ?? 0) - (b.order_no ?? 0));
      },

      expensesSorted(){
        // keep by happened_on then created_at
        return (this.expenses || []).slice().sort((a,b) => {
          const da = safeStr(a.happened_on);
          const db = safeStr(b.happened_on);
          if (da < db) return -1;
          if (da > db) return 1;
          return 0;
        });
      }
    },

    methods:{
      penSvg(){
        return `
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M13.5 6.5l4 4" stroke="white" stroke-width="2" stroke-linecap="round"/>
            <path d="M4 20l4.5-1 10-10a2 2 0 0 0 0-2.8l-.7-.7a2 2 0 0 0-2.8 0l-10 10L4 20Z" stroke="white" stroke-width="2" stroke-linejoin="round"/>
          </svg>
        `;
      },

      setErr(e){
        this.lastError = e;
        this.statusText = "ERR: " + safeStr(e?.message || e);
        console.error(e);
      },

      async ping(){
        try{
          const { error, status } = await sb
            .from("days")
            .select("id,day_no")
            .order("day_no", { ascending:true })
            .limit(1);

          if (error) throw error;
          this.connected = true;
          this.statusText = `OK (${status})`;
        } catch(e){
          this.connected = false;
          this.setErr(e);
        }
      },

      async loadAll(){
        this.loading = true;
        this.lastError = null;
        this.statusText = "loading...";
        try{
          const qDays = await sb
            .from("days")
            .select("id,day_no,date,title,note,sort_order,created_at,updated_at")
            .order("day_no", { ascending:true });
          if (qDays.error) throw qDays.error;
          this.days = qDays.data || [];
          if (!this.selectedDayId && this.days.length) this.selectedDayId = this.days[0].id;

          const qPlan = await sb
            .from("plan_items")
            .select("id,day_id,time_label,kind,title,note,maps_query,order_no,created_at,updated_at")
            .order("order_no", { ascending:true });
          if (qPlan.error) throw qPlan.error;
          this.planItems = qPlan.data || [];

          const qFlights = await sb
            .from("flights")
            .select("id,seg_no,flight_no,carrier,depart_airport,arrive_airport,depart_time,arrive_time,note,created_at,updated_at")
            .order("seg_no", { ascending:true });
          if (qFlights.error) throw qFlights.error;
          this.flights = qFlights.data || [];

          const qShop = await sb
            .from("shopping_items")
            .select("id,name,location,price_text,note,done,order_no,created_at,updated_at")
            .order("order_no", { ascending:true });
          if (qShop.error) throw qShop.error;
          this.shopping = qShop.data || [];

          const qExp = await sb
            .from("expenses")
            .select("id,day_id,happened_on,category,merchant,amount,currency,paid_by,note,created_at,updated_at")
            .order("happened_on", { ascending:true });
          if (qExp.error) throw qExp.error;
          this.expenses = qExp.data || [];

          this.connected = true;
          this.statusText = "loaded";
        } catch(e){
          this.connected = false;
          this.setErr(e);
        } finally {
          this.loading = false;
        }
      },

      async loadWeather(){
        try{
          const fallback = { lat:22.28, lon:114.19 };

          const getPos = () => new Promise((resolve) => {
            if (!navigator.geolocation) return resolve(null);
            navigator.geolocation.getCurrentPosition(
              (p) => resolve({ lat: p.coords.latitude, lon: p.coords.longitude }),
              () => resolve(null),
              { enableHighAccuracy:false, timeout: 3500, maximumAge: 5*60*1000 }
            );
          });

          const pos = (await getPos()) || fallback;
          this.weather.lat = +pos.lat.toFixed(2);
          this.weather.lon = +pos.lon.toFixed(2);

          const url = `https://api.open-meteo.com/v1/forecast?latitude=${encodeURIComponent(pos.lat)}&longitude=${encodeURIComponent(pos.lon)}&current_weather=true&timezone=Asia%2FHong_Kong`;
          const r = await fetch(url, { cache:"no-store" });
          if (!r.ok) throw new Error("weather fetch failed");
          const j = await r.json();
          const cw = j.current_weather || null;

          this.weather.ok = !!cw;
          this.weather.temp = cw ? cw.temperature : null;
          this.weather.wind = cw ? cw.windspeed : null;
          this.weather.code = cw ? cw.weathercode : null;
        } catch(e){
          this.weather.ok = false;
        }
      },

      setView(v){
        this.view = v;
        window.scrollTo({ top: 0, behavior: "smooth" });
      },

      mapQueryFor(row){
        return (row?.maps_query || row?.title || "").trim();

      mapHrefFor(row){
        return mapsDirUrl(this.mapQueryFor(row));
      },

        return d ? d.day_no : null;
      },

      dayIdFromDayNo(dayNo){
        const n = Number(dayNo);
        if (!Number.isFinite(n)) return null;
        const d = this.days.find(x => Number(x.day_no) === n);
        return d ? d.id : null;
      },

      // ===== Save / Delete =====
      async saveEdit(){
        if (!this.editing) return;
        const { table, mode, row } = this.editing;

        this.loading = true;
        this.lastError = null;
        try{
          let payload = { ...row };

          // Remove any UI-only fields
          delete payload.created_at;
          delete payload.updated_at;

          // Convert day number input -> day_id
          if (table === "plan_items" || table === "expenses"){
            const dayId = this.dayIdFromDayNo(payload.day_no_input);
            if (!dayId) throw new Error("找唔到呢個 Day number（請先確保 days 表有該 day_no）");
            payload.day_id = dayId;
            delete payload.day_no_input;
          }

          // Do NOT show/use order_no in UI; auto-append at bottom if insert
          if (table === "plan_items" && mode === "insert"){
            const forDay = (this.planItems || []).filter(x => x.day_id === payload.day_id);
            const max = forDay.reduce((m,x)=>Math.max(m, x.order_no||0), 0);
            payload.order_no = max + 1;
          }

          if (table === "shopping_items" && mode === "insert"){
            const max = (this.shopping || []).reduce((m,x)=>Math.max(m, x.order_no||0), 0);
            payload.order_no = max + 1;
            payload.done = false;
          }

          // For "days", ensure sort_order follows day_no (optional)
          if (table === "days"){
            payload.sort_order = payload.day_no;
          }

          // Upsert
          const { error } = await sb.from(table).upsert(payload);
          if (error) throw error;

          this.statusText = "saved";
          this.closeEdit();
          await this.loadAll();
        } catch(e){
          this.setErr(e);
        } finally {
          this.loading = false;
        }
      },

      async deleteEdit(){
        if (!this.editing?.row?.id) return;
        const { table, row } = this.editing;

        this.loading = true;
        this.lastError = null;
        try{
          const { error } = await sb.from(table).delete().eq("id", row.id);
          if (error) throw error;

          this.statusText = "deleted";
          this.closeEdit();
          await this.loadAll();
        } catch(e){
          this.setErr(e);
        } finally {
          this.loading = false;
        }
      },

      // Shopping checkbox toggle (no edit needed)
      async toggleShoppingDone(s){
        try{
          const next = !s.done;
          const { error } = await sb.from("shopping_items").update({ done: next }).eq("id", s.id);
          if (error) throw error;
          s.done = next;
        } catch(e){
          this.setErr(e);
        }
      },

      // ===== Flight card helpers =====
      flightModel(f){
        // fallback route label
        const dep = (f.depart_airport || "").toUpperCase() || "CTS";
        const arr = (f.arrive_airport || "").toUpperCase() || "HKG";
        const dd = parseTs(f.depart_time);
        const ad = parseTs(f.arrive_time);

        const depTime = dd ? fmtHM(dd) : "--:--";
        const arrTime = ad ? fmtHM(ad) : "--:--";
        const date = dd ? fmtDate(dd) : (f.depart_time ? safeStr(f.depart_time).slice(0,10) : "--");
        const fn = `${(f.carrier||"").toUpperCase()}${safeStr(f.flight_no)}`.trim() || "FLIGHT";

        // duration
        let dur = "--";
        if (dd && ad){
          const mins = Math.max(0, Math.round((ad - dd)/60000));
          const h = Math.floor(mins/60);
          const m = mins%60;
          dur = `${h}h ${m}m`;
        }

        return { dep, arr, depTime, arrTime, date, fn, dur };
      },
    },

                  <div class="flightTime">{{ flightModel(f).arrTime }}</div>
                  <div class="flightTerm">{{ (f.arrive_airport || '').toUpperCase() || 'Arrive' }}</div>
                </div>
              </div>

              <div v-if="f.note" style="margin-top:12px; color: rgba(0,0,0,.60); font-weight:700; white-space:pre-wrap;">
                {{ f.note }}
              </div>
            </div>

            <div v-if="flightsSorted.length===0" class="itemCard muted">
              （未有航程）
            </div>
          </div>
        </div>

        <!-- EXPENSES -->
        <div v-else-if="view==='expenses'" class="card section">
          <div class="sectionHead">
            <div class="sectionTitle">記帳</div>
            <div class="right">
              <div class="chipBtn btn" @click="openNewExpense()">＋ 記帳</div>
            </div>
          </div>

          <div class="list" style="margin-top:10px;">
            <div v-for="e in expensesSorted" :key="e.id" class="itemCard">
              <div class="itemTop">
                <div class="itemIcon">💴</div>
                <div class="itemMain">
                  <div style="display:flex; gap:10px; align-items:center;">
                    <div class="expPill">{{ e.happened_on || '日期' }}</div>
                    <div class="expPill">{{ e.category || '分類' }}</div>
                    <div class="expAmt">{{ (e.amount ?? '--') }} {{ e.currency || '' }}</div>
                  </div>
                  <div class="itemTitle" style="margin-top:8px;">
                    {{ e.merchant || '（未填商戶）' }}
                  </div>
                  <div class="itemNote" v-if="e.note">{{ e.note }}</div>
                </div>
                <div class="penBtn btn" v-html="penSvg()" @click="openEditExpense(e)"></div>
              </div>
            </div>

            <div v-if="expensesSorted.length===0" class="itemCard muted">
              （未有記帳）
            </div>
          </div>
        </div>

        <!-- SHOPPING -->
        <div v-else-if="view==='shopping'" class="card section">
          <div class="sectionHead">
            <div class="sectionTitle">購物</div>
            <div class="right">
              <div class="chipBtn btn" @click="openNewShopping()">＋ 購物</div>
            </div>
          </div>

          <div class="list" style="margin-top:10px;">
            <div v-for="s in shoppingSorted" :key="s.id" class="itemCard">
              <div class="shopRow">
                <div class="checkbox btn" :class="{on: !!s.done}" @click="toggleShoppingDone(s)">
                  <span v-if="s.done">✓</span>
                </div>

                <div style="flex:1 1 auto; min-width:0;">
                  <div class="shopTitle" :class="{strike: !!s.done}">
                    {{ s.name || '（未命名）' }}
                  </div>
                  <div class="shopMeta" v-if="s.location" :class="{strike: !!s.done}">
                    📍 {{ s.location }}
                  </div>
                  <div class="shopMeta" v-if="s.price_text" :class="{strike: !!s.done}">
                    💲 {{ s.price_text }}
                  </div>
                  <div class="itemNote" v-if="s.note" :class="{strike: !!s.done}">
                    {{ s.note }}
                  </div>
                </div>

                <div class="penBtn btn" v-html="penSvg()" @click="openEditShopping(s)"></div>
              </div>
            </div>

            <div v-if="shoppingSorted.length===0" class="itemCard muted">
              （未有購物清單）
            </div>
          </div>
        </div>

      </div>

      <!-- Bottom toolbar -->
      <div class="toolbar">
        <div class="toolbarInner">
          <div class="tabBtn btn" :class="{active:view==='plan'}" @click="setView('plan')">
            <span class="ico">🗺️</span><div class="lbl">行程</div>
          </div>
          <div class="tabBtn btn" :class="{active:view==='flights'}" @click="setView('flights')">
            <span class="ico">✈️</span><div class="lbl">航程</div>
          </div>
          <div class="tabBtn btn" :class="{active:view==='expenses'}" @click="setView('expenses')">
            <span class="ico">💴</span><div class="lbl">記帳</div>
          </div>
          <div class="tabBtn btn" :class="{active:view==='shopping'}" @click="setView('shopping')">
            <span class="ico">🛍️</span><div class="lbl">購物</div>
          </div>
        </div>
      </div>

      <!-- Debug modal -->
      <div v-if="showDebug" class="debugModalWrap" @click.self="showDebug=false">
        <div class="debugModal">
          <div class="debugRow">
            <div class="pill">Vue {{ Vue?.version || 'unknown' }}</div>
            <div class="pill" :class="connected ? 'ok' : 'bad'">{{ connected ? 'DB OK' : 'DB ERR' }}</div>
            <div class="pill mono">{{ statusText }}</div>
            <div class="chipBtn btn" style="margin-left:auto;" @click="showDebug=false">關閉</div>
          </div>

          <div v-if="lastError" class="cardInner" style="margin-top:12px; padding:12px; border-color: rgba(255,180,180,.25);">
            <div style="font-weight:950; color: rgba(255,180,180,.95);">Last error</div>
            <div class="mono" style="margin-top:8px; white-space:pre-wrap;">{{ lastError.message || lastError }}</div>
          </div>
        </div>
      </div>

      <!-- Edit modal -->
      <div v-if="editing" class="modalWrap" @click.self="closeEdit()">
        <div class="modal">
          <div class="modalHead">
            <div class="modalTitle">{{ editing.title }}</div>
            <div class="modalActions">
              <div class="chipBtn btn" @click="toggleDelete()">
                {{ showDelete ? '隱藏刪除' : '顯示刪除' }}
              </div>
              <div class="chipBtn btn" @click="closeEdit()">關閉</div>
            </div>
          </div>

          <!-- DAYS -->
          <div v-if="editing.table==='days'">
            <div class="grid2">
              <div>
                <label>Day number</label>
                <input v-model.number="editing.row.day_no" type="number" />
              </div>
              <div>
                <label>日期（YYYY-MM-DD）</label>
                <input v-model="editing.row.date" placeholder="2026-01-08" />
              </div>
            </div>

            <div class="grid1">
              <div>
                <label>（可留空）</label>
                <input v-model="editing.row.title" placeholder="例如：Day 2 1/9 星期五" />
              </div>
              <div>
                <label>備註</label>
                <textarea v-model="editing.row.note"></textarea>
              </div>
            </div>
          </div>

          <!-- PLAN ITEMS -->
          <div v-else-if="editing.table==='plan_items'">
            <div class="grid2">
              <div>
                <label>Day（輸入 day number）</label>
                <input v-model.number="editing.row.day_no_input" type="number" />
              </div>
              <div>
                <label>時段</label>
                <select v-model="editing.row.time_label">
                  <option v-for="p in periodOptions" :key="p.value" :value="p.value">{{ p.label }}</option>
                </select>
              </div>
            </div>

            <div class="grid2">
              <div>
                <label>類型</label>
                <select v-model="editing.row.kind">
                  <option v-for="k in kindOptions" :key="k.value" :value="k.value">{{ k.label }}</option>
                </select>
              </div>
              <div>
                <label>Google Map 搜尋字（可留空）</label>
                <input v-model="editing.row.maps_query" placeholder="例如：札幌 PARCO / 北海道神宮" />
              </div>
            </div>

            <div class="grid1">
              <div>
                <label>內容</label>
                <input v-model="editing.row.title" placeholder="例如：北海道神宮 / 午餐：根室花まる" />
              </div>
              <div>
                <label>備註</label>
                <textarea v-model="editing.row.note"></textarea>
              </div>
            </div>
          </div>

          <!-- FLIGHTS -->
          <div v-else-if="editing.table==='flights'">
            <div class="grid2">
              <div>
                <label>段號（seg）</label>
                <input v-model.number="editing.row.seg_no" type="number" />
              </div>
              <div>
                <label>航空公司（例如 CX）</label>
                <input v-model="editing.row.carrier" />
              </div>
            </div>

            <div class="grid2">
              <div>
                <label>航班號（例如 581）</label>
                <input v-model="editing.row.flight_no" />
              </div>
              <div>
                <label>（可留空）</label>
                <input v-model="editing.row.note" placeholder="例如：Terminal / seat / reminder" />
              </div>
            </div>

            <div class="grid2">
              <div>
                <label>出發機場（IATA，例如 CTS）</label>
                <input v-model="editing.row.depart_airport" />
              </div>
              <div>
                <label>到達機場（IATA，例如 HKG）</label>
                <input v-model="editing.row.arrive_airport" />
              </div>
            </div>

            <div class="grid2">
              <div>
                <label>出發時間（例如 2026-01-13 16:00）</label>
                <input v-model="editing.row.depart_time" />
              </div>
              <div>
                <label>到達時間（例如 2026-01-13 20:55）</label>
                <input v-model="editing.row.arrive_time" />
              </div>
            </div>
          </div>

          <!-- EXPENSES -->
          <div v-else-if="editing.table==='expenses'">
            <div class="grid2">
              <div>
                <label>Day（輸入 day number）</label>
                <input v-model.number="editing.row.day_no_input" type="number" />
              </div>
              <div>
                <label>日期（YYYY-MM-DD）</label>
                <input v-model="editing.row.happened_on" placeholder="2026-01-09" />
              </div>
            </div>

            <div class="grid2">
              <div>
                <label>分類</label>
                <input v-model="editing.row.category" placeholder="例如：food / transport" />
              </div>
              <div>
                <label>商戶</label>
                <input v-model="editing.row.merchant" placeholder="例如：Lawson / JR" />
              </div>
            </div>

            <div class="grid2">
              <div>
                <label>金額</label>
                <input v-model.number="editing.row.amount" type="number" step="0.01" />
              </div>
              <div>
                <label>貨幣</label>
                <input v-model="editing.row.currency" />
              </div>
            </div>

            <div class="grid2">
              <div>
                <label>付款人</label>
                <input v-model="editing.row.paid_by" placeholder="例如：Kin / Aline" />
              </div>
              <div></div>
            </div>

            <div class="grid1">
              <div>
                <label>備註</label>
                <textarea v-model="editing.row.note"></textarea>
              </div>
            </div>
          </div>

          <!-- SHOPPING -->
          <div v-else-if="editing.table==='shopping_items'">
            <div class="grid1">
              <div>
                <label>物品</label>
                <input v-model="editing.row.name" />
              </div>
            </div>

            <div class="grid2">
              <div>
                <label>地點</label>
                <input v-model="editing.row.location" />
              </div>
              <div>
                <label>價錢（文字）</label>
                <input v-model="editing.row.price_text" />
              </div>
            </div>

            <div class="grid1">
              <div>
                <label>備註</label>
                <textarea v-model="editing.row.note"></textarea>
              </div>
            </div>

            <div class="muted" style="margin-top:10px;">
              * done 用清單上的 ✅ 勾選（唔喺呢度改）
            </div>
          </div>

          <div style="display:flex; gap:10px; margin-top:14px; align-items:center;">
            <div class="chipBtn btn" @click="saveEdit()" :style="loading?'opacity:.6':''">
              {{ loading ? '儲存中...' : '儲存' }}
            </div>
            <div class="chipBtn btn" @click="closeEdit()">取消</div>

            <div v-if="showDelete" class="chipBtn btn dangerBtn" style="margin-left:auto;" @click="deleteEdit()">
              刪除
            </div>
          </div>
        </div>
      </div>
    
 ` }).mount("#app");
})();
</script>
</body>
</html>

<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sapporo Snow — Travel App</title>

  <!-- your CSS -->
  <link rel="stylesheet" href="./assets/app.css" />

  <!-- Vue (global build) -->
  <script src="./assets/vue.global.prod.js"></script>

  <!-- Supabase JS v2 (UMD global: window.supabase) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* keep minimal fallback style in case app.css missing */
    body { margin:0; background:#0b1220; color:rgba(255,255,255,.92); }
    .muted { opacity:.75; }
    .pill { display:inline-block; padding:.35rem .65rem; border-radius:999px; border:1px solid rgba(255,255,255,.15); }
    .btn { cursor:pointer; user-select:none; }
    .btn:disabled { opacity:.4; cursor:not-allowed; }
    .row { display:flex; gap:12px; }
    .card { background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.08); border-radius:18px; padding:14px; }
    .card h3 { margin:.2rem 0 .6rem; }
    .tabs { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    .tab { padding:.45rem .9rem; border-radius:999px; border:1px solid rgba(255,255,255,.12); }
    .tab.active { background:rgba(255,255,255,.12); }
    input, textarea, select {
      width:100%; box-sizing:border-box;
      background:rgba(0,0,0,.25); color:#fff;
      border:1px solid rgba(255,255,255,.14);
      border-radius:12px; padding:.55rem .7rem;
    }
    textarea { min-height:90px; resize:vertical; }
    .grid2 { display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
    .grid3 { display:grid; grid-template-columns: 1fr 1fr 1fr; gap:12px; }
    .right { margin-left:auto; }
    .list { display:flex; flex-direction:column; gap:10px; }
    .item { padding:12px; border-radius:16px; border:1px solid rgba(255,255,255,.08); background:rgba(255,255,255,.04); }
    .item .top { display:flex; gap:8px; align-items:center; }
    .item .title { font-weight:700; }
    .danger { color:#ffb4b4; border-color: rgba(255,180,180,.35) !important; }
    .ok { color:#bfffd1; border-color: rgba(191,255,209,.35) !important; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size:12px; }
  </style>
</head>

<body>
<div id="app"></div>

<script>
(() => {
  const { createApp, computed } = Vue;

  // ============
  // 1) CONFIG (你只要改呢兩個)
  // ============
  const SUPABASE_URL = "https://qvogojdyykgotuitjkhj.supabase.co";
  const SUPABASE_KEY = "sb_publishable_9rQ7sJQ3bZ_uhnT2hxRUKQ_MJv1icIF"; // sb_publishable_...

  // ============
  // 2) Supabase client
  // ============
  const sb = window.supabase?.createClient?.(SUPABASE_URL, SUPABASE_KEY);
  if (!sb) console.error("Supabase client init failed: window.supabase missing?");

  // ============
  // 3) Helpers
  // ============
  const hkTimeStr = () => {
    try {
      return new Intl.DateTimeFormat("en-GB", {
        timeZone: "Asia/Hong_Kong",
        hour12: false,
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      }).format(new Date());
    } catch(e) {
      const d = new Date();
      return d.toTimeString().slice(0,8);
    }
  };

  const safeStr = (v) => (v == null ? "" : String(v));

  // ============
  // 4) App
  // ============
  createApp({
    data() {
      return {
        view: "plan", // plan | flights | expenses | shopping
        hkClock: hkTimeStr(),
        statusText: "ready",
        lastError: null,
        connected: false,
        loading: false,

        // data
        days: [],
        selectedDayId: null,
        planItems: [],
        flights: [],
        shopping: [],
        expenses: [],

        // edit modal state (simple inline editor)
        editing: null,  // {table, mode, row}
      };
    },

    computed: {
      selectedDay() {
        return this.days.find(d => d.id === this.selectedDayId) || null;
      },
      planItemsForSelectedDay() {
        if (!this.selectedDayId) return [];
        return this.planItems
          .filter(x => x.day_id === this.selectedDayId)
          .sort((a,b) => (a.order_no ?? 0) - (b.order_no ?? 0));
      }
    },

    methods: {
      setErr(e) {
        this.lastError = (e && (e.message || e.error_description)) ? e : { message: String(e) };
        this.statusText = "ERR: " + safeStr(this.lastError.message || this.lastError);
        console.error(e);
      },

      async ping() {
        // cheapest: read days with limit 1
        try {
          const { data, error, status } = await sb
            .from("days")
            .select("id,day_no")
            .order("day_no", { ascending: true })
            .limit(1);

          if (error) throw error;
          this.connected = true;
          this.statusText = `OK (${status})`;
          return data;
        } catch (e) {
          this.connected = false;
          this.setErr(e);
          return null;
        }
      },

      async loadAll() {
        this.loading = true;
        this.lastError = null;
        this.statusText = "loading...";

        try {
          // 1) days
          const qDays = await sb
            .from("days")
            .select("id,day_no,date,title,note,sort_order,created_at,updated_at")
            .order("day_no", { ascending: true });

          if (qDays.error) throw qDays.error;
          this.days = qDays.data || [];
          if (!this.selectedDayId && this.days.length) this.selectedDayId = this.days[0].id;

          // 2) plan_items
          const qPlan = await sb
            .from("plan_items")
            .select("id,day_id,time_label,kind,title,note,maps_query,order_no,created_at,updated_at")
            .order("order_no", { ascending: true });

          if (qPlan.error) throw qPlan.error;
          this.planItems = qPlan.data || [];

          // 3) flights
          const qFlights = await sb
            .from("flights")
            .select("id,seg_no,flight_no,carrier,depart_airport,arrive_airport,depart_time,arrive_time,note,created_at,updated_at")
            .order("seg_no", { ascending: true });

          if (qFlights.error) throw qFlights.error;
          this.flights = qFlights.data || [];

          // 4) shopping
          const qShop = await sb
            .from("shopping_items")
            .select("id,name,location,price_text,note,done,order_no,created_at,updated_at")
            .order("order_no", { ascending: true });

          if (qShop.error) throw qShop.error;
          this.shopping = qShop.data || [];

          // 5) expenses
          const qExp = await sb
            .from("expenses")
            .select("id,day_id,happened_on,category,merchant,amount,currency,paid_by,note,created_at,updated_at")
            .order("happened_on", { ascending: true });

          if (qExp.error) throw qExp.error;
          this.expenses = qExp.data || [];

          this.connected = true;
          this.statusText = "loaded";
        } catch (e) {
          this.connected = false;
          this.setErr(e);
        } finally {
          this.loading = false;
        }
      },

      // ============
      // CRUD: generic upsert/delete
      // ============
      openNew(table) {
        const blank = {
          plan_items: { day_id: this.selectedDayId, time_label: "", kind: "activity", title: "", note: "", maps_query: "", order_no: 1 },
          shopping_items: { name: "", location: "", price_text: "", note: "", done: false, order_no: 1 },
          flights: { seg_no: 1, flight_no: "", carrier: "", depart_airport: "", arrive_airport: "", depart_time: "", arrive_time: "", note: "" },
          expenses: { day_id: this.selectedDayId, happened_on: "", category: "", merchant: "", amount: null, currency: "JPY", paid_by: "", note: "" },
          days: { day_no: 1, date: "", title: "", note: "", sort_order: 1 },
        }[table] || {};

        this.editing = { table, mode: "insert", row: JSON.parse(JSON.stringify(blank)) };
      },

      openEdit(table, row) {
        this.editing = { table, mode: "update", row: JSON.parse(JSON.stringify(row)) };
      },

      closeEdit() {
        this.editing = null;
      },

      async saveEdit() {
        if (!this.editing) return;
        const { table, row } = this.editing;

        this.loading = true;
        this.lastError = null;

        try {
          // normalize table name if user passes friendly
          const t = table;

          // IMPORTANT:
          // app_state only has updated_at (no created_at) — but we are not editing app_state here anyway.
          // For other tables, created_at/updated_at are generated by DB, so we avoid sending them.
          const payload = { ...row };
          delete payload.created_at;
          delete payload.updated_at;

          // tiny normalization for boolean done
          if (t === "shopping_items") payload.done = !!payload.done;

          // if inserting and order_no not set, set to bottom
          if (t === "plan_items" && (payload.order_no == null || payload.order_no === "")) {
            const max = this.planItemsForSelectedDay.reduce((m,x) => Math.max(m, x.order_no || 0), 0);
            payload.order_no = max + 1;
          }

          const { error } = await sb.from(t).upsert(payload);
          if (error) throw error;

          this.statusText = "saved";
          this.closeEdit();
          await this.loadAll();
        } catch (e) {
          this.setErr(e);
        } finally {
          this.loading = false;
        }
      },

      async delRow(table, id) {
        if (!id) return;
        this.loading = true;
        this.lastError = null;

        try {
          const { error } = await sb.from(table).delete().eq("id", id);
          if (error) throw error;
          this.statusText = "deleted";
          await this.loadAll();
        } catch (e) {
          this.setErr(e);
        } finally {
          this.loading = false;
        }
      },

      // ============
      // UI helpers
      // ============
      viewLabel(v) {
        return ({ plan:"行程", flights:"航程", expenses:"記帳", shopping:"購物" })[v] || v;
      },
      kindLabel(k) {
        return ({ activity:"行程", food:"食", wear:"衣著", hotel:"酒店", transport:"交通" })[k] || k;
      }
    },

    async mounted() {
      // clock
      setInterval(() => { this.hkClock = hkTimeStr(); }, 1000);

      // basic connectivity test then load
      await this.ping();
      await this.loadAll();
    },
`
    template: 
      <div class="card" style="margin:14px;">
        <div class="row" style="align-items:flex-start;">
          <div style="flex:1;">
            <div class="muted" style="letter-spacing:.2em; font-size:12px;">SAPPORO • SNOW • FIRST LOVE VIBE</div>
            <div style="display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;">
              <div style="font-size:44px; font-weight:900;">札幌旅行 App</div>
              <div class="muted" style="margin-top:10px;">行程 / 航程 / 記帳 / 購物</div>
            </div>

            <div class="tabs" style="margin-top:12px;">
              <div class="tab btn" :class="{active:view==='plan'}" @click="view='plan'">行程</div>
              <div class="tab btn" :class="{active:view==='flights'}" @click="view='flights'">航程</div>
              <div class="tab btn" :class="{active:view==='expenses'}" @click="view='expenses'">記帳</div>
              <div class="tab btn" :class="{active:view==='shopping'}" @click="view='shopping'">購物</div>

              <div class="right tab btn" @click="loadAll()">↻ Reload</div>
              <div class="pill" :class="connected ? 'ok' : 'danger'">
                DB Supabase {{ connected ? 'YES' : 'NO' }}
              </div>
              <div class="muted">{{ statusText }}</div>
            </div>
          </div>

          <div class="card" style="min-width:220px;">
            <div class="muted" style="font-size:12px;">HK Time</div>
            <div style="font-size:28px; font-weight:800;">{{ hkClock }}</div>
            <div class="muted" style="margin-top:8px;">{{ connected ? 'OK' : 'ERR' }}</div>
          </div>
        </div>
      </div>

      <div class="row" style="margin:14px;">
        <div class="card" style="flex:1;">
          <!-- PLAN -->
          <template v-if="view==='plan'">
            <div style="display:flex; align-items:center; gap:10px;">
              <h3 style="margin:0;">行程（按日）</h3>
              <div class="muted">由 database 讀取；Edit / 新增 / 刪除 會直接改 DB</div>
              <div class="right tab btn" @click="openNew('plan_items')">＋ Add Item</div>
            </div>

            <div class="row" style="margin-top:12px;">
              <div style="flex:1;" class="card">
                <div style="display:flex; align-items:center; gap:10px;">
                  <div class="muted">Days</div>
                  <div class="right tab btn" @click="openNew('days')">＋ Day</div>
                </div>
                <div class="list" style="margin-top:10px;">
                  <div class="item btn"
                    v-for="d in days"
                    :key="d.id"
                    @click="selectedDayId=d.id"
                    :style="selectedDayId===d.id ? 'border-color:rgba(191,255,209,.35); background:rgba(191,255,209,.06);' : ''"
                  >
                    <div class="top">
                      <div class="pill">Day {{ d.day_no }}</div>
                      <div class="muted">{{ d.date || '-' }}</div>
                      <div class="right tab btn" @click.stop="openEdit('days', d)">Edit</div>
                      <div class="tab btn danger" @click.stop="delRow('days', d.id)">Del</div>
                    </div>
                    <div class="title" style="margin-top:6px;">{{ d.title || d.date || '未命名' }}</div>
                    <div class="muted" v-if="d.note">{{ d.note }}</div>
                  </div>
                </div>
              </div>

              <div style="flex:2;" class="card">
                <div v-if="!selectedDay" class="muted">未選 Day。</div>
                <template v-else>
                  <div style="display:flex; align-items:center; gap:10px;">
                    <div class="pill">Day {{ selectedDay.day_no }}</div>
                    <div class="title" style="font-size:20px;">{{ selectedDay.title || selectedDay.date }}</div>
                    <div class="right tab btn" @click="openEdit('days', selectedDay)">Edit Day</div>
                  </div>

                  <div class="list" style="margin-top:12px;">
                    <div class="item" v-for="x in planItemsForSelectedDay" :key="x.id">
                      <div class="top">
                        <div class="pill">{{ x.time_label || '時間' }}</div>
                        <div class="pill">{{ kindLabel(x.kind) }}</div>
                        <div class="title">{{ x.title }}</div>
                        <div class="right tab btn" @click="openEdit('plan_items', x)">Edit</div>
                        <div class="tab btn danger" @click="delRow('plan_items', x.id)">Del</div>
                      </div>
                      <div class="muted" style="margin-top:6px; white-space:pre-wrap;" v-if="x.note">{{ x.note }}</div>
                      <div class="mono muted" v-if="x.maps_query" style="margin-top:6px;">maps: {{ x.maps_query }}</div>
                    </div>

                    <div v-if="planItemsForSelectedDay.length===0" class="muted item">
                      呢日未有 item。右上角「Add Item」新增。
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </template>

          <!-- FLIGHTS -->
          <template v-else-if="view==='flights'">
            <div style="display:flex; align-items:center; gap:10px;">
              <h3 style="margin:0;">航程</h3>
              <div class="right tab btn" @click="openNew('flights')">＋ Add Flight</div>
            </div>

            <div class="list" style="margin-top:12px;">
              <div class="item" v-for="f in flights" :key="f.id">
                <div class="top">
                  <div class="pill">SEG {{ f.seg_no }}</div>
                  <div class="title">{{ f.carrier }}{{ f.flight_no }}</div>
                  <div class="muted">{{ f.depart_airport }} → {{ f.arrive_airport }}</div>
                  <div class="right tab btn" @click="openEdit('flights', f)">Edit</div>
                  <div class="tab btn danger" @click="delRow('flights', f.id)">Del</div>
                </div>
                <div class="muted" style="margin-top:6px;">
                  {{ f.depart_time }}  →  {{ f.arrive_time }}
                </div>
                <div class="muted" v-if="f.note" style="white-space:pre-wrap; margin-top:6px;">{{ f.note }}</div>
              </div>
            </div>
          </template>

          <!-- EXPENSES -->
          <template v-else-if="view==='expenses'">
            <div style="display:flex; align-items:center; gap:10px;">
              <h3 style="margin:0;">記帳</h3>
              <div class="right tab btn" @click="openNew('expenses')">＋ Add Expense</div>
            </div>

            <div class="list" style="margin-top:12px;">
              <div class="item" v-for="e in expenses" :key="e.id">
                <div class="top">
                  <div class="pill">{{ e.happened_on || 'date' }}</div>
                  <div class="pill">{{ e.category || 'category' }}</div>
                  <div class="title">{{ e.merchant || 'merchant' }}</div>
                  <div class="muted">{{ e.amount }} {{ e.currency }}</div>
                  <div class="right tab btn" @click="openEdit('expenses', e)">Edit</div>
                  <div class="tab btn danger" @click="delRow('expenses', e.id)">Del</div>
                </div>
                <div class="muted" v-if="e.note" style="margin-top:6px; white-space:pre-wrap;">{{ e.note }}</div>
              </div>
            </div>
          </template>

          <!-- SHOPPING -->
          <template v-else-if="view==='shopping'">
            <div style="display:flex; align-items:center; gap:10px;">
              <h3 style="margin:0;">購物</h3>
              <div class="right tab btn" @click="openNew('shopping_items')">＋ Add Item</div>
            </div>

            <div class="list" style="margin-top:12px;">
              <div class="item" v-for="s in shopping" :key="s.id">
                <div class="top">
                  <div class="pill" :class="s.done ? 'ok' : ''">{{ s.done ? 'DONE' : 'TODO' }}</div>
                  <div class="title">{{ s.name }}</div>
                  <div class="muted" v-if="s.location">{{ s.location }}</div>
                  <div class="muted" v-if="s.price_text">{{ s.price_text }}</div>
                  <div class="right tab btn" @click="openEdit('shopping_items', s)">Edit</div>
                  <div class="tab btn danger" @click="delRow('shopping_items', s.id)">Del</div>
                </div>
                <div class="muted" v-if="s.note" style="margin-top:6px; white-space:pre-wrap;">{{ s.note }}</div>
              </div>
            </div>
          </template>
        </div>

        <!-- DEBUG -->
        <div class="card" style="width:360px;">
          <h3 style="margin:0 0 10px;">Debug</h3>
          <div class="item">
            <div class="muted">Vue:</div>
            <div class="pill">{{ Vue?.version || 'unknown' }}</div>
          </div>

          <div class="item">
            <div class="muted">Supabase connected:</div>
            <div class="pill" :class="connected ? 'ok' : 'danger'">{{ connected ? 'YES' : 'NO' }}</div>
          </div>

          <div class="item danger" v-if="lastError">
            <div class="muted">Last error:</div>
            <div style="white-space:pre-wrap;">{{ lastError.message || lastError }}</div>
          </div>

          <div class="item">
            <div class="muted">Tips</div>
            <div class="muted" style="white-space:pre-wrap;">
- 如果你見到按鈕無反應：通常 JS error（開 console）。
- 如果 DB 係 NO：通常 key / url / RLS policy / CORS。
- 你而家已經跑通 test.html（200），所以之後 99% 係「app code」問題唔係 Supabase。
            </div>
          </div>
        </div>
      </div>

      <!-- EDIT PANEL -->
      <div v-if="editing" style="position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; padding:14px;">
        <div class="card" style="width:min(920px, 98vw); max-height:90vh; overflow:auto;">
          <div style="display:flex; align-items:center; gap:10px;">
            <div class="pill">{{ editing.mode.toUpperCase() }}</div>
            <div class="title" style="font-size:20px;">{{ editing.table }}</div>
            <div class="right tab btn" @click="closeEdit()">Close</div>
          </div>

          <div class="muted mono" style="margin-top:10px;">* created_at / updated_at 由 DB 自己處理；你唔需要填。</div>

          <div style="margin-top:12px;">
            <div class="grid2" v-if="editing.table==='plan_items'">
              <div>
                <label class="muted">day_id</label>
                <input v-model="editing.row.day_id" />
              </div>
              <div>
                <label class="muted">order_no</label>
                <input v-model.number="editing.row.order_no" type="number" />
              </div>
              <div>
                <label class="muted">time_label</label>
                <input v-model="editing.row.time_label" />
              </div>
              <div>
                <label class="muted">kind</label>
                <select v-model="editing.row.kind">
                  <option value="activity">activity</option>
                  <option value="food">food</option>
                  <option value="wear">wear</option>
                  <option value="hotel">hotel</option>
                  <option value="transport">transport</option>
                </select>
              </div>
              <div style="grid-column:1/-1;">
                <label class="muted">title</label>
                <input v-model="editing.row.title" />
              </div>
              <div style="grid-column:1/-1;">
                <label class="muted">note</label>
                <textarea v-model="editing.row.note"></textarea>
              </div>
              <div style="grid-column:1/-1;">
                <label class="muted">maps_query</label>
                <input v-model="editing.row.maps_query" />
              </div>
            </div>

            <div class="grid2" v-else-if="editing.table==='days'">
              <div>
                <label class="muted">day_no</label>
                <input v-model.number="editing.row.day_no" type="number" />
              </div>
              <div>
                <label class="muted">sort_order</label>
                <input v-model.number="editing.row.sort_order" type="number" />
              </div>
              <div>
                <label class="muted">date</label>
                <input v-model="editing.row.date" placeholder="YYYY-MM-DD" />
              </div>
              <div>
                <label class="muted">title</label>
                <input v-model="editing.row.title" />
              </div>
              <div style="grid-column:1/-1;">
                <label class="muted">note</label>
                <textarea v-model="editing.row.note"></textarea>
              </div>
            </div>

            <div class="grid2" v-else-if="editing.table==='shopping_items'">
              <div>
                <label class="muted">order_no</label>
                <input v-model.number="editing.row.order_no" type="number" />
              </div>
              <div>
                <label class="muted">done</label>
                <select v-model="editing.row.done">
                  <option :value="false">false</option>
                  <option :value="true">true</option>
                </select>
              </div>
              <div style="grid-column:1/-1;">
                <label class="muted">name</label>
                <input v-model="editing.row.name" />
              </div>
              <div>
                <label class="muted">location</label>
                <input v-model="editing.row.location" />
              </div>
              <div>
                <label class="muted">price_text</label>
                <input v-model="editing.row.price_text" />
              </div>
              <div style="grid-column:1/-1;">
                <label class="muted">note</label>
                <textarea v-model="editing.row.note"></textarea>
              </div>
            </div>

            <div class="grid2" v-else-if="editing.table==='flights'">
              <div>
                <label class="muted">seg_no</label>
                <input v-model.number="editing.row.seg_no" type="number" />
              </div>
              <div>
                <label class="muted">carrier</label>
                <input v-model="editing.row.carrier" />
              </div>
              <div>
                <label class="muted">flight_no</label>
                <input v-model="editing.row.flight_no" />
              </div>
              <div></div>
              <div>
                <label class="muted">depart_airport</label>
                <input v-model="editing.row.depart_airport" />
              </div>
              <div>
                <label class="muted">arrive_airport</label>
                <input v-model="editing.row.arrive_airport" />
              </div>
              <div>
                <label class="muted">depart_time</label>
                <input v-model="editing.row.depart_time" placeholder="2026-01-08 02:00:00+08" />
              </div>
              <div>
                <label class="muted">arrive_time</label>
                <input v-model="editing.row.arrive_time" placeholder="2026-01-08 07:05:00+09" />
              </div>
              <div style="grid-column:1/-1;">
                <label class="muted">note</label>
                <textarea v-model="editing.row.note"></textarea>
              </div>
            </div>

            <div class="grid2" v-else-if="editing.table==='expenses'">
              <div>
                <label class="muted">day_id</label>
                <input v-model="editing.row.day_id" />
              </div>
              <div>
                <label class="muted">happened_on</label>
                <input v-model="editing.row.happened_on" placeholder="YYYY-MM-DD" />
              </div>
              <div>
                <label class="muted">category</label>
                <input v-model="editing.row.category" />
              </div>
              <div>
                <label class="muted">merchant</label>
                <input v-model="editing.row.merchant" />
              </div>
              <div>
                <label class="muted">amount</label>
                <input v-model.number="editing.row.amount" type="number" step="0.01" />
              </div>
              <div>
                <label class="muted">currency</label>
                <input v-model="editing.row.currency" />
              </div>
              <div>
                <label class="muted">paid_by</label>
                <input v-model="editing.row.paid_by" />
              </div>
              <div></div>
              <div style="grid-column:1/-1;">
                <label class="muted">note</label>
                <textarea v-model="editing.row.note"></textarea>
              </div>
            </div>

            <div v-else class="muted">
              unknown table editor
            </div>
          </div>

          <div style="display:flex; gap:10px; margin-top:14px;">
            <button class="tab btn" @click="saveEdit()" :disabled="loading">
              {{ loading ? 'Saving...' : 'Save' }}
            </button>
            <button class="tab btn danger" @click="closeEdit()">Cancel</button>
          </div>
        </div>
      </div>
    `
  }).mount("#app");
})();
</script>
</body>
</html>

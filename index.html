<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Sapporo Snow — Travel App</title>

  <!-- Your CSS -->
  <link rel="stylesheet" href="assets/app.css" />

  <!-- Fallback minimal styling (in case app.css fails) -->
  <style>
    html, body { height: 100%; }
    body {
      margin: 0;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: auto;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", "PingFang TC", Arial, sans-serif;
      color: rgba(255,255,255,.92);
      background: #0b1220;
    }
    .bg-snow {
      min-height: 100vh;
      background-image:
        linear-gradient(180deg, rgba(2,6,23,.62), rgba(2,6,23,.78)),
        radial-gradient(1100px 720px at 20% 8%, rgba(96,165,250,.25), rgba(2,6,23,0) 60%),
        radial-gradient(900px 620px at 90% 18%, rgba(191,219,254,.16), rgba(2,6,23,0) 55%),
        url("bg.jpg");
      background-size: cover;
      background-position: center;
    }
    .wrap { max-width: 980px; margin: 0 auto; padding: 16px; }
    .glass {
      background: rgba(30, 58, 94, .45);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 22px;
      box-shadow: 0 18px 60px rgba(0,0,0,.25);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .row { display:flex; gap:12px; flex-wrap: wrap; align-items:center; }
    .spacer { flex: 1; }
    .title { font-size: 40px; font-weight: 800; letter-spacing: .5px; margin: 6px 0 0; }
    .subtitle { opacity: .9; margin: 8px 0 0; font-size: 18px; }
    .btn {
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      color: rgba(255,255,255,.92);
      padding: 10px 14px;
      border-radius: 999px;
      cursor: pointer;
      user-select: none;
      font-weight: 700;
    }
    .btn.active { background: rgba(59,130,246,.35); border-color: rgba(147,197,253,.45); }
    .pill {
      padding: 12px 14px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(15,23,42,.30);
    }
    .muted { opacity: .8; }
    .small { font-size: 13px; opacity: .9; }
    .h2 { font-size: 22px; font-weight: 800; margin: 0; }
    .card {
      padding: 14px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(2,6,23,.25);
    }
    .err {
      border: 1px solid rgba(248,113,113,.45);
      background: rgba(127,29,29,.35);
      padding: 12px 14px;
      border-radius: 16px;
      white-space: pre-wrap;
      line-height: 1.35;
    }
    a { color: #93c5fd; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .grid2 { display:grid; grid-template-columns: 1fr; gap: 12px; }
    @media (min-width: 860px) { .grid2 { grid-template-columns: 1.1fr .9fr; } }
    .list { display:flex; flex-direction:column; gap:10px; }
    .tag { display:inline-block; padding: 4px 10px; border-radius: 999px; font-size: 12px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.10); }
    .line { height:1px; background: rgba(255,255,255,.10); margin: 10px 0; }
    .right { text-align:right; }
  </style>

  <!-- Vue (LOCAL, stable). This MUST exist: assets/vue.global.prod.js -->
  <script src="assets/vue.global.prod.js"></script>

  <!-- Supabase (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="bg-snow">
  <div id="app" class="wrap">
    <!-- If Vue didn't mount, you will still see this raw content.
         When Vue mounts, it will replace everything. -->
    <div class="glass" style="padding:16px;">
      <div class="muted">Loading… 如果你一直見到呢句，就代表 Vue 未 mount。</div>
    </div>
  </div>

  <script>
  ;(() => {
    // -----------------------------
    // 0) Hard fail messages (so you don't see blank + {{}})
    // -----------------------------
    const bootErrors = [];
    if (!window.Vue) bootErrors.push("Vue 未 load：請確認 assets/vue.global.prod.js 路徑存在，而且 GitHub Pages 有成功 serve。");
    if (!window.supabase) bootErrors.push("Supabase SDK 未 load：請確認 CDN 可用，或你公司網絡 block 咗 jsdelivr。");

    // Put your Supabase URL + anon key here
    // Project URL format: https://<project-ref>.supabase.co
    const SUPABASE_URL = "https://qvogojdyykgotuitjkhj.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF2b2dvamR5eWtnb3R1aXRqa2hqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY0NjIwMzksImV4cCI6MjA4MjAzODAzOX0.HTGA2Gjru0smaVU0ZKbHh0-hDr-tL6OcR7EuGPmpfLg";

    // -----------------------------
    // 1) If core libs missing, render error panel without Vue
    // -----------------------------
    if (bootErrors.length) {
      const el = document.getElementById("app");
      el.innerHTML = `
        <div class="glass" style="padding:16px;">
          <div class="h2">Boot Error</div>
          <div class="line"></div>
          <div class="err">${bootErrors.join("\n\n")}</div>
          <div class="line"></div>
          <div class="small muted">
            你可以開 DevTools Console 試：
            <br/>- window.Vue
            <br/>- window.supabase
          </div>
        </div>
      `;
      return;
    }

    // -----------------------------
    // 2) Create Supabase client (avoid name collision!)
    // -----------------------------
    const { createClient } = window.supabase;
    const supa = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // -----------------------------
    // 3) Vue App
    // -----------------------------
    const { createApp, computed } = window.Vue;

    createApp({
      template: `
        <div class="glass" style="padding:16px;">
          <div class="row" style="align-items:flex-start;">
            <div style="min-width: 260px;">
              <div class="muted small" style="letter-spacing:.22em;">SAPPORO • SNOW • FIRST LOVE VIBE</div>
              <div class="title">札幌旅行 App</div>
              <div class="subtitle">行程 / 航程 / 記帳 / 購物</div>
            </div>
            <div class="spacer"></div>

            <div class="pill right" style="min-width: 160px;">
              <div class="small muted">HK Time</div>
              <div style="font-size:26px; font-weight:900;">{{ hkClock }}</div>
              <div class="small muted">{{ statusText }}</div>
            </div>
          </div>

          <div class="line"></div>

          <div class="row">
            <button class="btn" :class="{active:view==='plan'}" @click="view='plan'">行程</button>
            <button class="btn" :class="{active:view==='flight'}" @click="view='flight'">航程</button>
            <button class="btn" :class="{active:view==='expense'}" @click="view='expense'">記帳</button>
            <button class="btn" :class="{active:view==='shop'}" @click="view='shop'">購物</button>

            <div class="spacer"></div>
            <button class="btn" @click="reloadAll()">↻ Reload</button>
          </div>
        </div>

        <div style="height:14px;"></div>

        <div class="grid2">
          <!-- LEFT: main content -->
          <div class="glass" style="padding:16px;">
            <div v-if="view==='plan'">
              <div class="row">
                <div>
                  <div class="h2">行程（按日）</div>
                  <div class="small muted">由 database 讀取；Edit/新增/刪除 之後會直接改 DB。</div>
                </div>
                <div class="spacer"></div>
                <button class="btn" @click="addDay()">+ Day</button>
              </div>

              <div class="line"></div>

              <!-- Slider-like day pills -->
              <div class="row" style="overflow:auto; flex-wrap:nowrap; padding-bottom:6px;">
                <div v-for="d in days" :key="d.id"
                     class="pill"
                     :style="{
                       minWidth: '230px',
                       cursor:'pointer',
                       borderColor: selectedDayId===d.id ? 'rgba(147,197,253,.55)' : 'rgba(255,255,255,.12)',
                       background: selectedDayId===d.id ? 'rgba(59,130,246,.22)' : 'rgba(15,23,42,.30)'
                     }"
                     @click="selectDay(d.id)">
                  <div class="small muted">{{ d.date_short || '—' }}</div>
                  <div style="font-size:18px; font-weight:900; margin-top:2px;">
                    Day {{ d.day_no }} · {{ d.title || d.date_full || '未命名' }}
                  </div>
                </div>

                <div v-if="!days.length" class="pill muted">未有 Day · 按右上角「+ Day」新增。</div>
              </div>

              <div class="line"></div>

              <div v-if="selectedDay">
                <div class="row">
                  <div>
                    <div class="tag">Day {{ selectedDay.day_no }}</div>
                    <div style="font-size:26px; font-weight:950; margin-top:6px;">
                      {{ selectedDay.title || selectedDay.date_full || '未命名' }}
                    </div>
                    <div class="small muted">{{ selectedDay.date_full || '' }}</div>
                  </div>
                  <div class="spacer"></div>
                  <button class="btn" @click="editDay(selectedDay)">Edit</button>
                  <button class="btn" @click="deleteDay(selectedDay)">Delete</button>
                </div>

                <div class="line"></div>

                <!-- Slots -->
                <div class="row">
                  <div class="h2" style="font-size:18px;">時段 / 主要活動</div>
                  <div class="spacer"></div>
                  <button class="btn" @click="addSlot(selectedDay)">+ Add</button>
                </div>

                <div style="height:10px;"></div>

                <div class="list">
                  <div v-for="s in slotsBySelectedDay" :key="s.id" class="card">
                    <div class="row">
                      <div class="tag">{{ s.time_label || '未填時間' }}</div>
                      <div class="spacer"></div>
                      <button class="btn" @click="editSlot(s)">Edit</button>
                      <button class="btn" @click="deleteSlot(s)">Delete</button>
                    </div>

                    <div style="height:8px;"></div>

                    <div style="font-weight:900; font-size:18px;">
                      {{ s.activity || '（未填主要活動）' }}
                    </div>

                    <div style="height:8px;"></div>

                    <!-- Destinations: show pin-link if have google_query -->
                    <div class="small muted" v-if="s.dest_text">
                      <span>📍</span>
                      <a :href="googleMapsLink(s.dest_text)" target="_blank" rel="noopener">
                        {{ s.dest_text }}
                      </a>
                    </div>

                    <div class="small muted" v-if="s.notes" style="margin-top:6px;">
                      📝 {{ s.notes }}
                    </div>

                    <!-- Outfit at bottom (per your request) -->
                    <div class="small" v-if="s.outfit" style="margin-top:10px; opacity:.92;">
                      👕 米衣著：{{ s.outfit }}
                    </div>
                  </div>

                  <div v-if="slotsBySelectedDay.length===0" class="card muted">
                    呢一日未有時段內容。按「+ Add」加 record。
                  </div>
                </div>
              </div>

              <div v-else class="card muted">
                未選 Day。請喺上面揀一日。
              </div>
            </div>

            <div v-else-if="view==='flight'">
              <div class="row">
                <div class="h2">航程</div>
                <div class="spacer"></div>
                <button class="btn" @click="addFlight()">+ Add</button>
              </div>
              <div class="line"></div>

              <div class="list">
                <div v-for="f in flights" :key="f.id" class="card">
                  <div class="row">
                    <div class="tag">{{ f.date || '—' }}</div>
                    <div class="spacer"></div>
                    <button class="btn" @click="editFlight(f)">Edit</button>
                    <button class="btn" @click="deleteFlight(f)">Delete</button>
                  </div>
                  <div style="height:8px;"></div>
                  <div style="font-weight:950; font-size:18px;">
                    {{ f.title || (f.from_airport + " → " + f.to_airport) }}
                  </div>
                  <div class="small muted" style="margin-top:6px;">
                    ✈️ {{ f.flight_no || '—' }} · {{ f.dep_time || '—' }} → {{ f.arr_time || '—' }}
                    <span v-if="f.note"> · {{ f.note }}</span>
                  </div>
                </div>

                <div v-if="!flights.length" class="card muted">未有航程 record。</div>
              </div>
            </div>

            <div v-else-if="view==='expense'">
              <div class="row">
                <div class="h2">記帳</div>
                <div class="spacer"></div>
                <button class="btn" @click="addExpense()">+ Add</button>
              </div>
              <div class="line"></div>

              <div class="row">
                <div class="tag">本月合計：HK$ {{ expenseTotalHKD.toFixed(2) }}</div>
              </div>

              <div style="height:10px;"></div>

              <div class="list">
                <div v-for="e in expenses" :key="e.id" class="card">
                  <div class="row">
                    <div class="tag">{{ e.date || '—' }}</div>
                    <div class="spacer"></div>
                    <button class="btn" @click="editExpense(e)">Edit</button>
                    <button class="btn" @click="deleteExpense(e)">Delete</button>
                  </div>
                  <div style="height:8px;"></div>
                  <div style="font-weight:950; font-size:18px;">{{ e.title || '（未填項目）' }}</div>
                  <div class="small muted" style="margin-top:6px;">
                    💳 {{ e.method || '—' }} · {{ e.ccy || 'HKD' }} {{ (e.amount || 0) }}
                    <span v-if="e.place"> · 📍 {{ e.place }}</span>
                  </div>
                </div>

                <div v-if="!expenses.length" class="card muted">未有記帳 record。</div>
              </div>
            </div>

            <div v-else-if="view==='shop'">
              <div class="row">
                <div class="h2">購物清單</div>
                <div class="spacer"></div>
                <button class="btn" @click="addShop()">+ Add</button>
              </div>
              <div class="line"></div>

              <div class="list">
                <div v-for="it in shopping" :key="it.id" class="card">
                  <div class="row">
                    <input type="checkbox" v-model="it.done" @change="toggleShopDone(it)" />
                    <div style="font-weight:950; font-size:18px;">{{ it.item || '（未填）' }}</div>
                    <div class="spacer"></div>
                    <button class="btn" @click="editShop(it)">Edit</button>
                    <button class="btn" @click="deleteShop(it)">Delete</button>
                  </div>

                  <div class="small muted" style="margin-top:8px;" v-if="it.where">
                    🧭 {{ it.where }}
                  </div>
                  <div class="small muted" style="margin-top:6px;" v-if="it.note">
                    📝 {{ it.note }}
                  </div>
                  <div class="small muted" style="margin-top:6px;" v-if="it.price_text">
                    💴 {{ it.price_text }}
                  </div>
                </div>

                <div v-if="!shopping.length" class="card muted">未有購物 record。</div>
              </div>
            </div>

            <div v-else class="card muted">
              Unknown view: {{ view }}
            </div>
          </div>

          <!-- RIGHT: debug/status -->
          <div class="glass" style="padding:16px;">
            <div class="h2">Debug</div>
            <div class="line"></div>

            <div class="small muted">Vue:</div>
            <div class="tag">{{ vueVersion }}</div>

            <div style="height:10px;"></div>

            <div class="small muted">Supabase connected:</div>
            <div class="tag">{{ supabaseOk ? "YES" : "NO" }}</div>

            <div style="height:10px;"></div>

            <div class="small muted">Last error:</div>
            <div class="err" v-if="lastError">{{ lastError }}</div>
            <div class="card muted" v-else>—</div>

            <div class="line"></div>
            <div class="small muted">
              如果你再見到 <b>{{"{{"}}</b> 文字直接顯示，9成係 Vue 未 mount（script path / cache / JS error）。
            </div>
          </div>
        </div>
      `,

      data() {
        return {
          view: "plan",
          hkClock: "--:--:--",
          statusText: "booting…",
          lastError: "",
          supabaseOk: false,

          days: [],
          slots: [],
          flights: [],
          expenses: [],
          shopping: [],

          selectedDayId: null,
        };
      },

      computed: {
        vueVersion() {
          return (window.Vue && window.Vue.version) ? window.Vue.version : "unknown";
        },
        selectedDay() {
          return this.days.find(d => d.id === this.selectedDayId) || null;
        },
        slotsBySelectedDay() {
          if (!this.selectedDayId) return [];
          return this.slots
            .filter(s => s.day_id === this.selectedDayId)
            .sort((a,b) => (a.sort_order ?? 9999) - (b.sort_order ?? 9999));
        },
        expenseTotalHKD() {
          // If you store HKD already, sum it. Otherwise this is placeholder.
          return this.expenses
            .filter(e => (e.ccy || "HKD") === "HKD")
            .reduce((sum, e) => sum + (Number(e.amount) || 0), 0);
        }
      },

      methods: {
        googleMapsLink(q) {
          return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);
        },

        setError(e) {
          const msg = (e && e.message) ? e.message : String(e || "");
          this.lastError = msg;
          this.statusText = "ERR";
          console.error(e);
        },

        async pingSupabase() {
          try {
            // Simple lightweight call
            const { data, error } = await supa.from("days").select("id").limit(1);
            if (error) throw error;
            this.supabaseOk = true;
            return true;
          } catch (e) {
            this.supabaseOk = false;
            this.setError("Supabase ping failed: " + (e.message || e));
            return false;
          }
        },

        async reloadAll() {
          this.lastError = "";
          this.statusText = "loading…";

          const ok = await this.pingSupabase();
          if (!ok) return;

          try {
            // ---- days
            let r1 = await supa.from("days")
              .select("*")
              .order("day_no", { ascending: true });
            if (r1.error) throw r1.error;
            this.days = r1.data || [];
            if (!this.selectedDayId && this.days.length) this.selectedDayId = this.days[0].id;

            // ---- slots
            let r2 = await supa.from("slots")
              .select("*")
              .order("day_id", { ascending: true })
              .order("sort_order", { ascending: true });
            if (r2.error) throw r2.error;
            this.slots = r2.data || [];

            // ---- flights (include transit as separate record => you can insert 2 rows for transfer)
            let r3 = await supa.from("flights")
              .select("*")
              .order("sort_order", { ascending: true });
            if (r3.error) throw r3.error;
            this.flights = r3.data || [];

            // ---- expenses
            let r4 = await supa.from("expenses")
              .select("*")
              .order("date", { ascending: true })
              .order("created_at", { ascending: true });
            if (r4.error) throw r4.error;
            this.expenses = r4.data || [];

            // ---- shopping
            let r5 = await supa.from("shopping")
              .select("*")
              .order("done", { ascending: true })
              .order("sort_order", { ascending: true });
            if (r5.error) throw r5.error;
            this.shopping = r5.data || [];

            this.statusText = "OK";
          } catch (e) {
            this.setError(e);
          }
        },

        selectDay(id) { this.selectedDayId = id; },

        // ----------------
        // CRUD placeholders (you can keep UI, later we refine forms)
        // ----------------
        async addDay() {
          try {
            const nextNo = (this.days.reduce((m,d)=>Math.max(m, d.day_no||0), 0) || 0) + 1;
            const payload = { day_no: nextNo, title: "", date_full: "", date_short: "" };
            const { data, error } = await supa.from("days").insert(payload).select("*").single();
            if (error) throw error;
            this.days.push(data);
            this.selectedDayId = data.id;
          } catch(e) { this.setError(e); }
        },
        async editDay(d) {
          const title = prompt("Day title / date", d.title || d.date_full || "");
          if (title === null) return;
          try {
            const { error } = await supa.from("days").update({ title }).eq("id", d.id);
            if (error) throw error;
            d.title = title;
          } catch(e) { this.setError(e); }
        },
        async deleteDay(d) {
          if (!confirm("Delete this Day? (will also remove its slots if you set FK cascade)")) return;
          try {
            const { error } = await supa.from("days").delete().eq("id", d.id);
            if (error) throw error;
            this.days = this.days.filter(x => x.id !== d.id);
            if (this.selectedDayId === d.id) this.selectedDayId = this.days[0]?.id || null;
          } catch(e) { this.setError(e); }
        },

        async addSlot(day) {
          try {
            const payload = {
              day_id: day.id,
              sort_order: (this.slotsBySelectedDay.length + 1) * 10,
              time_label: "",
              activity: "",
              dest_text: "",
              notes: "",
              outfit: ""
            };
            const { data, error } = await supa.from("slots").insert(payload).select("*").single();
            if (error) throw error;
            this.slots.push(data);
          } catch(e) { this.setError(e); }
        },
        async editSlot(s) {
          const activity = prompt("主要活動", s.activity || "");
          if (activity === null) return;
          const dest = prompt("目的地（會自動變 Google Maps link）", s.dest_text || "");
          if (dest === null) return;
          const time = prompt("時間/時段", s.time_label || "");
          if (time === null) return;
          const notes = prompt("備註", s.notes || "");
          if (notes === null) return;
          const outfit = prompt("米衣著（放最底）", s.outfit || "");
          if (outfit === null) return;

          try {
            const patch = { activity, dest_text: dest, time_label: time, notes, outfit };
            const { error } = await supa.from("slots").update(patch).eq("id", s.id);
            if (error) throw error;
            Object.assign(s, patch);
          } catch(e) { this.setError(e); }
        },
        async deleteSlot(s) {
          if (!confirm("Delete this slot?")) return;
          try {
            const { error } = await supa.from("slots").delete().eq("id", s.id);
            if (error) throw error;
            this.slots = this.slots.filter(x => x.id !== s.id);
          } catch(e) { this.setError(e); }
        },

        async addFlight() {
          try {
            const payload = { sort_order: (this.flights.length+1)*10, date:"", title:"", flight_no:"", from_airport:"", to_airport:"", dep_time:"", arr_time:"", note:"" };
            const { data, error } = await supa.from("flights").insert(payload).select("*").single();
            if (error) throw error;
            this.flights.push(data);
          } catch(e) { this.setError(e); }
        },
        async editFlight(f) {
          const title = prompt("航程標題 / 路線", f.title || "");
          if (title === null) return;
          try {
            const { error } = await supa.from("flights").update({ title }).eq("id", f.id);
            if (error) throw error;
            f.title = title;
          } catch(e) { this.setError(e); }
        },
        async deleteFlight(f) {
          if (!confirm("Delete this flight record?")) return;
          try {
            const { error } = await supa.from("flights").delete().eq("id", f.id);
            if (error) throw error;
            this.flights = this.flights.filter(x => x.id !== f.id);
          } catch(e) { this.setError(e); }
        },

        async addExpense() {
          try {
            const payload = { date:"", title:"", ccy:"HKD", amount:0, method:"", place:"" };
            const { data, error } = await supa.from("expenses").insert(payload).select("*").single();
            if (error) throw error;
            this.expenses.push(data);
          } catch(e) { this.setError(e); }
        },
        async editExpense(e) {
          const title = prompt("項目", e.title || "");
          if (title === null) return;
          try {
            const { error } = await supa.from("expenses").update({ title }).eq("id", e.id);
            if (error) throw error;
            e.title = title;
          } catch(err) { this.setError(err); }
        },
        async deleteExpense(e) {
          if (!confirm("Delete expense?")) return;
          try {
            const { error } = await supa.from("expenses").delete().eq("id", e.id);
            if (error) throw error;
            this.expenses = this.expenses.filter(x => x.id !== e.id);
          } catch(err) { this.setError(err); }
        },

        async addShop() {
          try {
            const payload = { sort_order:(this.shopping.length+1)*10, done:false, item:"", where:"", note:"", price_text:"" };
            const { data, error } = await supa.from("shopping").insert(payload).select("*").single();
            if (error) throw error;
            this.shopping.push(data);
          } catch(e) { this.setError(e); }
        },
        async editShop(it) {
          const item = prompt("Item", it.item || "");
          if (item === null) return;
          try {
            const { error } = await supa.from("shopping").update({ item }).eq("id", it.id);
            if (error) throw error;
            it.item = item;
          } catch(e) { this.setError(e); }
        },
        async toggleShopDone(it) {
          try {
            const { error } = await supa.from("shopping").update({ done: !!it.done }).eq("id", it.id);
            if (error) throw error;
          } catch(e) { this.setError(e); }
        },
        async deleteShop(it) {
          if (!confirm("Delete shopping item?")) return;
          try {
            const { error } = await supa.from("shopping").delete().eq("id", it.id);
            if (error) throw error;
            this.shopping = this.shopping.filter(x => x.id !== it.id);
          } catch(e) { this.setError(e); }
        },
      },

      async mounted() {
        // HK clock
        const tick = () => {
          const now = new Date();
          // format as HK time (UTC+8) without relying on device tz
          const hk = new Date(now.getTime() + (8 * 60 - now.getTimezoneOffset()) * 60000);
          const hh = String(hk.getHours()).padStart(2,"0");
          const mm = String(hk.getMinutes()).padStart(2,"0");
          const ss = String(hk.getSeconds()).padStart(2,"0");
          this.hkClock = `${hh}:${mm}:${ss}`;
        };
        tick();
        setInterval(tick, 1000);

        // Initial load
        await this.reloadAll();
      }
    }).mount("#app");
  })();
  </script>
</body>

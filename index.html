<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Sapporo Snow — Travel App</title>

  <link rel="stylesheet" href="./assets/app.css" />
  <script src="./assets/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{
      --bg:#081225;
      --panel: rgba(255,255,255,.06);
      --panel2: rgba(255,255,255,.045);
      --stroke: rgba(255,255,255,.10);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.70);
      --ok: rgba(191,255,209,.95);
      --bad: rgba(255,180,180,.95);
      --shadow: 0 18px 60px rgba(0,0,0,.45);
      --r: 22px;
    }
    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      color:var(--text);
      background: var(--bg);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans";
      overflow-x:hidden;
    }

    /* BG image + fallback */
    body::before{
      content:"";
      position:fixed; inset:0;
      background:
        radial-gradient(80% 60% at 70% 20%, rgba(100,180,255,.18), transparent 65%),
        radial-gradient(80% 60% at 20% 30%, rgba(80,255,200,.10), transparent 70%),
        url("./assets/bg.jpg");
      background-size: cover;
      background-position: center;
      opacity:.55;
      z-index:-2;
    }
    body::after{
      content:"";
      position:fixed; inset:0;
      background: linear-gradient(180deg, rgba(5,10,20,.65), rgba(5,10,20,.86));
      z-index:-1;
    }

    .muted{ color:var(--muted); }
    .mono{ font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    a{ color:inherit; text-decoration:none; }

    .shell{
      max-width: 980px;
      margin: 0 auto;
      padding: 12px 12px 94px;
    }
    .card{
      background: var(--panel);
      border: 1px solid var(--stroke);
      border-radius: var(--r);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    /* Header (simplified) */
    .header{ padding: 12px 12px; border-radius: 26px; }
    .headRow{
      display:flex;
      gap:10px;
      align-items:flex-start;
    }
    .brand{ flex:1; min-width:0; }
    .kicker{
      letter-spacing:.28em;
      font-size: 11px;
      color: rgba(255,255,255,.68);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .titleBig{
      font-size: 40px;
      font-weight: 950;
      line-height:1.02;
      margin-top:6px;
    }
    .subtitle{
      margin-top:6px;
      color: rgba(255,255,255,.72);
      font-weight:650;
    }

    .rightCol{
      flex:0 0 auto;
      display:flex;
      flex-direction:column;
      gap:8px;
      align-items:flex-end;
    }
    .pill{
      display:inline-flex;
      gap:8px;
      align-items:center;
      padding: 8px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.05);
      font-size: 12px;
      white-space: nowrap;
    }
    .pill.ok{ border-color: rgba(191,255,209,.35); color: var(--ok); }
    .pill.bad{ border-color: rgba(255,180,180,.35); color: var(--bad); }

    .btn{
      cursor:pointer;
      user-select:none;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      color: var(--text);
      border-radius: 999px;
      padding: 10px 14px;
      font-weight: 900;
      display:inline-flex;
      align-items:center;
      gap:8px;
    }
    .btn.small{ padding: 8px 10px; font-size: 12px; }
    .btn:disabled{ opacity:.45; cursor:not-allowed; }

    /* Panels */
    .panel{ margin-top: 12px; overflow:hidden; }
    .panelHead{
      display:flex;
      align-items:center;
      gap:10px;
      padding: 12px 12px;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .panelTitle{ font-size: 18px; font-weight: 950; }
    .panelActions{ margin-left:auto; display:flex; gap:10px; align-items:center; }

    /* Day slider: thinner */
    .daySlider{
      display:flex;
      gap:10px;
      padding: 10px 10px;
      overflow:auto;
      scroll-snap-type:x mandatory;
      -webkit-overflow-scrolling: touch;
    }
    .dayCard{
      flex: 0 0 auto;
      width: 210px; /* thinner look */
      padding: 10px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.04);
      scroll-snap-align:start;
    }
    .dayCard.active{
      border-color: rgba(191,255,209,.35);
      background: rgba(191,255,209,.06);
    }
    .dayTop{
      display:flex;
      gap:10px;
      align-items:flex-start;
    }
    .dayBadge{
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.04);
      font-weight: 900;
      font-size: 12px;
      min-width: 64px;
      text-align:center;
    }
    .dayMeta{ flex:1; min-width:0; }
    .dayDate{ font-weight: 900; opacity:.82; white-space:nowrap; }
    .dayTitle{
      font-weight: 950;
      font-size: 16px;
      margin-top: 6px;
      line-height: 1.1;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow: hidden;
    }

    /* Small icon button (pen) */
    .iconBtn{
      width: 30px;
      height: 30px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.05);
      display:grid;
      place-items:center;
      cursor:pointer;
      flex:0 0 auto;
    }
    .iconSvg{ width: 16px; height: 16px; opacity:.95; }

    /* Sections */
    .sections{ padding: 10px; display:flex; flex-direction:column; gap:10px; }
    .section{
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.04);
      overflow:hidden;
    }
    .sectionHead{
      display:flex; align-items:center; gap:10px;
      padding: 12px 12px;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .sectionTitle{ font-size: 20px; font-weight: 950; }
    .sectionActions{ margin-left:auto; display:flex; gap:10px; align-items:center; }

    .items{ padding: 10px; display:flex; flex-direction:column; gap:10px; }
    .itemCard{
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.04);
      padding: 12px;
      display:flex;
      gap:10px;
      align-items:flex-start;
    }
    .itemEmoji{
      width: 26px; height: 26px;
      display:grid; place-items:center;
      font-size: 18px;
      margin-top: 2px;
      flex:0 0 auto;
    }
    .itemMain{ flex:1; min-width:0; }
    .itemTitle{
      font-weight: 950;
      font-size: 20px;
      line-height: 1.15;
      word-break: break-word;
    }
    .itemNote{
      margin-top: 8px;
      color: rgba(255,255,255,.74);
      white-space: pre-wrap;
      line-height: 1.35;
    }

    /* Flights */
    .flightList{ padding: 10px; display:flex; flex-direction:column; gap:10px; }
    .flightCard{
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.04);
      padding: 14px;
    }
    .flightTop{
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:space-between;
      flex-wrap:wrap;
    }
    .flightMeta{ font-weight: 900; opacity:.85; }
    .flightRoute{
      margin-top: 10px;
      font-weight: 950;
      font-size: 24px;
      line-height: 1.1;
    }
    .flightGrid{
      margin-top: 12px;
      display:grid;
      grid-template-columns: 1fr auto 1fr;
      gap:10px;
      align-items:center;
    }
    .flightAirport{ font-weight: 950; font-size: 20px; }
    .flightTime{ font-weight: 950; font-size: 32px; line-height:1; margin-top: 6px; }
    .flightTerminal{ margin-top: 4px; opacity:.75; font-weight: 750; }
    .flightLine{
      height: 4px;
      border-radius: 999px;
      background: rgba(255,255,255,.16);
      position:relative;
      width: 140px;
    }
    .flightPlane{
      position:absolute;
      left: 12%;
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      opacity:.9;
    }

    /* Expenses */
    .expenseList{ padding: 10px; display:flex; flex-direction:column; gap:10px; }
    .expenseCard{
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.04);
      padding: 12px;
      display:flex;
      gap:10px;
      align-items:flex-start;
    }
    .expenseMain{ flex:1; min-width:0; }
    .expenseTitle{ font-weight: 950; font-size: 18px; line-height: 1.15; }
    .expenseSub{ margin-top:6px; opacity:.78; font-weight:800; }

    /* Shopping */
    .shopList{ padding: 10px; display:flex; flex-direction:column; gap:10px; }
    .shopRow{
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.04);
      padding: 12px;
      display:flex;
      gap:10px;
      align-items:center;
    }
    .shopRow.done{ opacity: .70; }
    .shopText{ flex:1; min-width:0; }
    .shopName{ font-weight: 950; font-size: 18px; line-height:1.15; }
    .shopName.done{ text-decoration: line-through; opacity:.9; }
    .shopMeta{
      margin-top: 4px;
      opacity:.75;
      font-weight: 800;
      font-size: 12px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    input[type="checkbox"]{ width: 20px; height: 20px; accent-color: #9ef0c1; }

    /* Modal editor (center) */
    .modalMask{
      position:fixed;
      inset:0;
      background: rgba(0,0,0,.55);
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 14px;
      z-index: 50;
    }
    .modal{
      width: min(860px, 96vw);
      max-height: 86vh;
      overflow:auto;
      border-radius: 22px;
      padding: 14px;
    }
    .formGrid{
      margin-top: 12px;
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    label{
      display:block;
      font-size: 12px;
      opacity:.78;
      font-weight: 900;
      margin: 0 0 6px;
    }
    input, textarea, select{
      width:100%;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.22);
      color: var(--text);
      padding: 10px 12px;
      outline:none;
    }
    textarea{ min-height: 98px; resize: vertical; }

    /* Bottom toolbar */
    .bottomBar{
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 14px;
      width: min(980px, calc(100vw - 24px));
      z-index: 20;
      padding: 10px;
      border-radius: 22px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(5,10,20,.55);
      backdrop-filter: blur(12px);
      display:flex;
      gap:10px;
      justify-content: space-between;
      align-items:center;
    }
    .navBtn{
      flex:1;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.04);
      padding: 10px 8px;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:6px;
      cursor:pointer;
      font-weight: 900;
      min-width: 0;
    }
    .navBtn.active{
      background: rgba(255,255,255,.10);
      border-color: rgba(191,255,209,.30);
    }
    .navIcon{ font-size: 18px; }
    .navLabel{ font-size: 12px; opacity:.9; white-space:nowrap; }

    /* Debug: smaller */
    .debugFab{
      position: fixed;
      right: 14px;
      bottom: 86px; /* above bottomBar */
      z-index: 30;
      display:flex;
      flex-direction:column;
      gap:10px;
      align-items:flex-end;
    }
    .debugBtn{
      border-radius: 999px;
      padding: 8px 10px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      font-weight: 950;
      cursor:pointer;
      display:flex;
      align-items:center;
      gap:8px;
      font-size: 12px;
    }
    .debugPanel{
      width: min(320px, calc(100vw - 28px));
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(10,18,34,.85);
      backdrop-filter: blur(12px);
      padding: 12px;
      box-shadow: var(--shadow);
    }
    .debugRow{
      display:flex; justify-content:space-between; gap:10px; align-items:center;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .debugRow:last-child{ border-bottom:none; }

    @media (max-width: 520px){
      .shell{ padding-left: 10px; padding-right: 10px; padding-bottom: 98px; }
      .titleBig{ font-size: 38px; }
      .dayCard{ width: 205px; }
      .flightLine{ width: 120px; }
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <script>
  (() => {
    const { createApp } = Vue;

    const SUPABASE_URL = "https://qvogojdyykgotuitjkhj.supabase.co";
    const SUPABASE_KEY = "sb_publishable_9rQ7sJQ3bZ_uhnT2hxRUKQ_MJv1icIF";

    const sb = window.supabase?.createClient?.(SUPABASE_URL, SUPABASE_KEY);
    if (!sb) console.error("Supabase init failed: window.supabase missing?");

    createApp({
      data(){
        return {
          view: "plan",
          connected: false,
          loading: false,
          statusText: "ready",
          lastError: null,

          geo: { lat: null, lon: null, ok: false },
          wx: { emoji:"⛅", temp:"--°C", wind:"--", loc:"" },

          days: [],
          selectedDayId: null,
          planItems: [],
          flights: [],
          shopping: [],
          expenses: [],

          debugOpen: false,

          editing: null,
          showDelete: false,

          // ✅ put SVG strings INSIDE Vue so v-html works
          penSvg: `
            <svg class="iconSvg" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 20h9"/>
              <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/>
            </svg>
          `,
        };
      },

      computed:{
        selectedDay(){
          return this.days.find(d => d.id === this.selectedDayId) || null;
        },

        planForDay(){
          if (!this.selectedDayId) return [];
          return (this.planItems || []).filter(x => x.day_id === this.selectedDayId);
        },

        periods(){
          const items = this.planForDay.slice().sort((a,b)=> (a.order_no ?? 0) - (b.order_no ?? 0));
          const bucket = { "上午": [], "下午": [], "晚上": [] };
          const wear = [];

          for (const x of items){
            const k = this.safe(x.kind);
            if (k === "wear"){ wear.push(x); continue; }
            const p = this.parsePeriod(x.time_label);
            bucket[p].push(x);
          }

          const out = {};
          for (const p of ["上午","下午","晚上"]){
            const arr = bucket[p] || [];
            const dest = arr.filter(x => this.safe(x.kind) !== "food");
            const meal = arr.filter(x => this.safe(x.kind) === "food");
            out[p] = { dest, meal: meal.length ? [meal[0]] : [] };
          }
          return { ...out, "衣著": { dest: wear, meal: [] } };
        },

        shoppingSorted(){
          const arr = (this.shopping || []).slice().sort((a,b)=> (a.order_no ?? 0) - (b.order_no ?? 0));
          return [...arr.filter(x=>!x.done), ...arr.filter(x=>!!x.done)];
        },
      },

      methods:{
        // ✅ helpers must be here (otherwise flights page can blank)
        safe(v){ return (v == null ? "" : String(v)); },
        encodeQ(s){ return encodeURIComponent(s || ""); },

        parsePeriod(timeLabel){
          const t = this.safe(timeLabel);
          if (t.includes("上午")) return "上午";
          if (t.includes("下午")) return "下午";
          if (t.includes("晚上") || t.includes("夜")) return "晚上";
          return "上午";
        },

        formatDateLabel(d){
          if (!d) return "";
          const dt = new Date(d + "T00:00:00");
          if (Number.isNaN(dt.getTime())) return d;
          const days = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
          return `${days[dt.getDay()]} ${dt.getDate()} ${dt.toLocaleString("en-GB",{month:"short"})} ${dt.getFullYear()}`;
        },

        formatHHMM(ts){
          if (!ts) return "";
          const s = String(ts).replace(" ", "T");
          const dt = new Date(s);
          if (!Number.isNaN(dt.getTime())){
            return dt.toLocaleTimeString("en-GB", { hour:"2-digit", minute:"2-digit", hour12:false });
          }
          const m = String(ts).match(/(\d{2}):(\d{2})/);
          return m ? `${m[1]}:${m[2]}` : String(ts).slice(0,5);
        },

        flightGuessCodes(f){
          const dep = this.safe(f.depart_airport).toUpperCase();
          const arr = this.safe(f.arrive_airport).toUpperCase();
          return { dep: dep || "—", arr: arr || "—" };
        },

        setErr(e){
          const msg = (e && (e.message || e.error_description)) ? (e.message || e.error_description) : String(e);
          this.lastError = { message: msg, raw: e };
          this.statusText = "ERR: " + msg;
          console.error(e);
        },

        async ping(){
          try{
            const { error, status } = await sb.from("days").select("id").limit(1);
            if (error) throw error;
            this.connected = true;
            this.statusText = `OK (${status})`;
          }catch(e){
            this.connected = false;
            this.setErr(e);
          }
        },

        async loadAll(){
          this.loading = true;
          this.lastError = null;
          this.statusText = "loading...";
          try{
            const qDays = await sb.from("days")
              .select("id,day_no,date,title,note,sort_order,created_at,updated_at")
              .order("day_no", { ascending:true });
            if (qDays.error) throw qDays.error;
            this.days = qDays.data || [];
            if (!this.selectedDayId && this.days.length) this.selectedDayId = this.days[0].id;

            const qPlan = await sb.from("plan_items")
              .select("id,day_id,time_label,kind,title,note,maps_query,order_no,created_at,updated_at")
              .order("order_no", { ascending:true });
            if (qPlan.error) throw qPlan.error;
            this.planItems = qPlan.data || [];

            const qFlights = await sb.from("flights")
              .select("id,seg_no,flight_no,carrier,depart_airport,arrive_airport,depart_time,arrive_time,note,created_at,updated_at")
              .order("seg_no", { ascending:true });
            if (qFlights.error) throw qFlights.error;
            this.flights = qFlights.data || [];

            const qShop = await sb.from("shopping_items")
              .select("id,name,location,price_text,note,done,order_no,created_at,updated_at")
              .order("order_no", { ascending:true });
            if (qShop.error) throw qShop.error;
            this.shopping = qShop.data || [];

            const qExp = await sb.from("expenses")
              .select("id,day_id,happened_on,category,merchant,amount,currency,paid_by,note,created_at,updated_at")
              .order("happened_on", { ascending:true });
            if (qExp.error) throw qExp.error;
            this.expenses = qExp.data || [];

            this.connected = true;
            this.statusText = "loaded";
          }catch(e){
            this.connected = false;
            this.setErr(e);
          }finally{
            this.loading = false;
          }
        },

        // Weather (no key)
        async initGeo(){
          try{
            if (!navigator.geolocation) return;
            navigator.geolocation.getCurrentPosition(
              (pos)=>{
                this.geo = { lat: pos.coords.latitude, lon: pos.coords.longitude, ok:true };
                this.fetchWeather();
              },
              ()=>{},
              { enableHighAccuracy:false, timeout:6000, maximumAge: 10*60*1000 }
            );
          }catch(_){}
        },

        async fetchWeather(){
          try{
            if (!this.geo.ok) return;

            const rgUrl = `https://geocoding-api.open-meteo.com/v1/reverse?latitude=${this.geo.lat}&longitude=${this.geo.lon}&language=en&count=1`;
            const rg = await fetch(rgUrl);
            const rgj = await rg.json();
            const place = rgj?.results?.[0];
            const loc = place ? [place.name, place.admin1].filter(Boolean).join(", ") : "";

            const url = `https://api.open-meteo.com/v1/forecast?latitude=${this.geo.lat}&longitude=${this.geo.lon}&current=temperature_2m,weather_code,wind_speed_10m&timezone=Asia%2FHong_Kong`;
            const r = await fetch(url);
            const j = await r.json();
            const cur = j?.current || {};
            const t = cur.temperature_2m;
            const w = cur.weather_code;
            const ws = cur.wind_speed_10m;

            const mapWx = (code)=>{
              if (code == null) return "⛅";
              const c = Number(code);
              if (c===0) return "☀️";
              if ([1,2,3].includes(c)) return "⛅";
              if ([45,48].includes(c)) return "🌫️";
              if ([51,53,55,56,57].includes(c)) return "🌦️";
              if ([61,63,65,66,67,80,81,82].includes(c)) return "🌧️";
              if ([71,73,75,77].includes(c)) return "🌨️";
              if ([95,96,99].includes(c)) return "⛈️";
              return "⛅";
            };

            this.wx = {
              emoji: mapWx(w),
              temp: (t == null ? "--°C" : `${Math.round(t)}°C`),
              wind: (ws == null ? "--" : `風 ${Math.round(ws)} km/h`),
              loc: loc || ""
            };
          }catch(e){
            console.warn("weather failed", e);
          }
        },

        destLink(item){
          const q = this.safe(item.maps_query) || this.safe(item.title);
          if (!q) return null;
          if (this.geo.ok){
            return `https://www.google.com/maps/dir/?api=1&origin=${this.geo.lat},${this.geo.lon}&destination=${this.encodeQ(q)}&travelmode=transit`;
          }
          return `https://www.google.com/maps/dir/?api=1&origin=My+Location&destination=${this.encodeQ(q)}&travelmode=transit`;
        },

        selectDay(id){ this.selectedDayId = id; },

        itemTitleLine(x){
          const tl = this.safe(x.time_label).trim();
          const t = this.safe(x.title);
          if (tl && !["上午","下午","晚上","衣著"].includes(tl)) return `${tl}  ${t}`;
          return t;
        },

        // CRUD (keep same behavior)
        openEdit(table, row){
          this.showDelete = false;
          const cloned = JSON.parse(JSON.stringify(row));
          const day = (table === "plan_items" || table === "expenses")
            ? this.days.find(d => d.id === cloned.day_id)
            : null;

          this.editing = {
            table,
            mode: "update",
            row: cloned,
            day_no_input: day ? day.day_no : (this.selectedDay?.day_no || "")
          };
        },

        openNewDay(){
          this.showDelete = false;
          this.editing = {
            table: "days",
            mode: "insert",
            row: { day_no: 1, date:"", title:"", note:"", sort_order: 1 },
            day_no_input: ""
          };
        },

        openNewFlight(){
          this.showDelete = false;
          this.editing = {
            table:"flights",
            mode:"insert",
            row:{ seg_no: 1, flight_no:"", carrier:"", depart_airport:"", arrive_airport:"", depart_time:"", arrive_time:"", note:"" },
            day_no_input:""
          };
        },

        openNewExpense(){
          if (!this.selectedDay) return;
          this.showDelete = false;
          this.editing = {
            table:"expenses",
            mode:"insert",
            row:{ day_id: this.selectedDayId, happened_on: this.selectedDay.date || "", category:"", merchant:"", amount:null, currency:"JPY", paid_by:"", note:"" },
            day_no_input: this.selectedDay.day_no
          };
        },

        openNewShopping(){
          this.showDelete = false;
          this.editing = {
            table:"shopping_items",
            mode:"insert",
            row:{ name:"", location:"", price_text:"", note:"", done:false, order_no:null },
            day_no_input:""
          };
        },

        openNewPlan(period, kind){
          if (!this.selectedDay) return;
          const row = {
            day_id: this.selectedDayId,
            time_label: period === "衣著" ? "衣著" : period,
            kind: kind,
            title: "",
            note: "",
            maps_query: "",
            order_no: null
          };
          this.showDelete = false;
          this.editing = { table:"plan_items", mode:"insert", row: JSON.parse(JSON.stringify(row)), day_no_input: this.selectedDay.day_no };
        },

        closeEdit(){ this.editing = null; this.showDelete = false; },

        resolveDayIdFromDayNo(dayNo){
          const n = Number(dayNo);
          if (!Number.isFinite(n)) return null;
          const d = this.days.find(x => Number(x.day_no) === n);
          return d ? d.id : null;
        },

        async saveEdit(){
          if (!this.editing) return;
          this.loading = true;
          this.lastError = null;
          try{
            const t = this.editing.table;
            const payload = { ...this.editing.row };
            delete payload.created_at;
            delete payload.updated_at;

            if (t === "plan_items" || t === "expenses"){
              const resolved = this.resolveDayIdFromDayNo(this.editing.day_no_input);
              if (!resolved) throw new Error("搵唔到呢個 Day number（請先確保 Days 表有呢個 day_no）");
              payload.day_id = resolved;
            }

            if (t === "plan_items" && (payload.order_no == null || payload.order_no === "")){
              const max = this.planForDay.reduce((m,x)=>Math.max(m, x.order_no||0), 0);
              payload.order_no = max + 1;
            }
            if (t === "shopping_items" && (payload.order_no == null || payload.order_no === "")){
              const max = (this.shopping || []).reduce((m,x)=>Math.max(m, x.order_no||0), 0);
              payload.order_no = max + 1;
            }
            if (t === "shopping_items") payload.done = !!payload.done;

            const { error } = await sb.from(t).upsert(payload);
            if (error) throw error;

            this.statusText = "saved";
            this.closeEdit();
            await this.loadAll();
          }catch(e){
            this.setErr(e);
          }finally{
            this.loading = false;
          }
        },

        async delCurrentEdit(){
          if (!this.editing) return;
          const t = this.editing.table;
          const id = this.editing.row?.id;
          if (!id) return;
          this.loading = true;
          try{
            const { error } = await sb.from(t).delete().eq("id", id);
            if (error) throw error;
            this.statusText = "deleted";
            this.closeEdit();
            await this.loadAll();
          }catch(e){
            this.setErr(e);
          }finally{
            this.loading = false;
          }
        },

        async toggleShopping(item){
          try{
            const newVal = !item.done;
            const { error } = await sb.from("shopping_items").upsert({ id: item.id, done: newVal });
            if (error) throw error;
            item.done = newVal;
            this.shopping = this.shopping.slice();
          }catch(e){
            this.setErr(e);
          }
        },
      },

      async mounted(){
        await this.ping();
        await this.loadAll();
        this.initGeo();
        setInterval(()=>this.fetchWeather(), 10*60*1000);
      },

            </template>

            <div style="display:flex; gap:10px; margin-top:14px; align-items:center;">
              <button class="btn" @click="saveEdit()" :disabled="loading">{{ loading ? '儲存中...' : '儲存' }}</button>
              <button class="btn" @click="closeEdit()">取消</button>

              <button
                class="btn"
                style="margin-left:auto; border-color: rgba(255,180,180,.35); color: rgba(255,180,180,.95); background: rgba(255,180,180,.06);"
                v-if="editing.mode==='update' && showDelete"
                @click="delCurrentEdit()"
                :disabled="loading"
              >
                刪除
              </button>
            </div>
          </div>
        </div>
      `,
    }).mount("#app");
  })();
  </script>
</body>
</html>

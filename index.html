<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sapporo Snow — Travel App</title>

  <!-- optional: keep your existing css (can be empty) -->
  <link rel="stylesheet" href="./assets/app.css" />

  <!-- Vue (global build) -->
  <script src="./assets/vue.global.prod.js"></script>

  <!-- Supabase JS v2 (UMD global: window.supabase) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{
      --bg0:#08101f;
      --card: rgba(255,255,255,.06);
      --card2: rgba(255,255,255,.08);
      --line: rgba(255,255,255,.12);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.72);
      --ok: rgba(191,255,209,.35);
      --danger: rgba(255,180,180,.35);
      --shadow: 0 12px 30px rgba(0,0,0,.35);
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      color:var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans TC", "PingFang HK", "Microsoft JhengHei", sans-serif;
      background:
        radial-gradient(1200px 600px at 20% 0%, rgba(120,180,255,.18), transparent 60%),
        radial-gradient(900px 500px at 90% 10%, rgba(255,255,255,.10), transparent 60%),
        linear-gradient(180deg, rgba(8,16,31,.92), rgba(6,10,20,.92)),
        url("./assets/bg.jpg");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    .wrap{ max-width:980px; margin:0 auto; padding:12px; }
    .glass{
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .topbar{
      padding:14px 14px 12px;
      display:flex;
      gap:12px;
      align-items:flex-start;
      justify-content:space-between;
      flex-wrap:wrap;
    }

    .brandSmall{
      letter-spacing:.22em;
      font-size:11px;
      color:var(--muted);
    }
    .brandTitle{
      font-size:36px;
      font-weight:900;
      line-height:1.1;
      margin-top:4px;
    }
    .brandSub{
      color:var(--muted);
      margin-top:6px;
      font-size:13px;
    }

    .clockCard{
      min-width:160px;
      padding:12px 12px 10px;
      border-radius:18px;
      background: rgba(0,0,0,.20);
      border:1px solid rgba(255,255,255,.10);
      text-align:right;
    }
    .clockLabel{ color:var(--muted); font-size:12px; }
    .clockTime{ font-size:24px; font-weight:900; margin-top:4px; }
    .clockStatus{ color:var(--muted); margin-top:6px; font-size:12px; }

    .tabs{
      padding:0 14px 12px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
    }
    .tab{
      border:1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      padding:8px 12px;
      border-radius:999px;
      font-weight:700;
      font-size:13px;
      user-select:none;
      cursor:pointer;
    }
    .tab.active{
      background: rgba(255,255,255,.14);
    }
    .pill{
      border:1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      padding:6px 10px;
      border-radius:999px;
      font-size:12px;
      color:var(--muted);
    }
    .pill.ok{ border-color: var(--ok); color: rgba(191,255,209,.95); }
    .pill.bad{ border-color: var(--danger); color: rgba(255,180,180,.95); }
    .right{ margin-left:auto; }

    /* day slider */
    .dayBar{
      padding:12px;
      overflow:auto hidden;
      display:flex;
      gap:10px;
      scroll-snap-type:x mandatory;
      -webkit-overflow-scrolling: touch;
    }
    .dayChip{
      min-width:220px;
      scroll-snap-align:start;
      padding:12px;
      border-radius:18px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.05);
      cursor:pointer;
      position:relative;
    }
    .dayChip.active{
      border-color: var(--ok);
      background: rgba(191,255,209,.06);
    }
    .dayChipTop{
      display:flex;
      align-items:center;
      gap:10px;
      color:var(--muted);
      font-size:13px;
      font-weight:700;
    }
    .dayBadge{
      border:1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      padding:4px 10px;
      border-radius:999px;
      font-weight:800;
      color:var(--text);
      font-size:13px;
    }
    .dayChipTitle{
      margin-top:8px;
      font-size:18px;
      font-weight:900;
      line-height:1.2;
    }
    .miniBtn{
      border:1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.20);
      width:34px;
      height:34px;
      border-radius:12px;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      user-select:none;
    }
    .miniBtn:active{ transform: scale(.98); }
    .dayChip .miniBtn{
      position:absolute;
      top:10px;
      right:10px;
    }

    .actionsRow{
      padding:0 14px 14px;
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
    }

    .btn{
      border:1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.08);
      padding:10px 14px;
      border-radius:999px;
      font-weight:900;
      cursor:pointer;
      user-select:none;
      display:inline-flex;
      gap:10px;
      align-items:center;
    }
    .btn:active{ transform: scale(.99); }
    .btn.ghost{
      background: rgba(0,0,0,.18);
    }

    /* sections */
    .section{
      padding:14px;
      margin:0 12px 12px;
      border-radius:22px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.18);
    }
    .sectionHead{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:12px;
    }
    .sectionTitle{
      font-size:22px;
      font-weight:900;
    }

    .cards{
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .planCard{
      position:relative;
      padding:12px 12px 12px;
      border-radius:18px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.05);
    }
    .planCard.meal{
      background: rgba(255,255,255,.075);
    }
    .planMain{
      font-size:15px;
      font-weight:900;
      line-height:1.3;
      padding-right:42px;
    }
    .planNote{
      margin-top:7px;
      font-size:13px;
      color:var(--muted);
      white-space:pre-wrap;
      padding-right:42px;
    }
    .editIcon{
      position:absolute;
      top:10px;
      right:10px;
      width:32px;
      height:32px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.22);
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      user-select:none;
    }
    .editIcon svg{ width:16px; height:16px; opacity:.9; }

    /* shopping */
    .shoppingCard{
      display:flex;
      gap:10px;
      align-items:flex-start;
      padding:12px;
      border-radius:18px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.05);
      position:relative;
    }
    .shopText{ flex:1; padding-right:42px; }
    .shopName{ font-weight:900; }
    .shopMeta{ margin-top:4px; font-size:13px; color:var(--muted); }
    .shoppingCard input[type="checkbox"]{
      width:20px; height:20px;
      margin-top:2px;
      accent-color: rgba(191,255,209,.95);
    }

    /* flights */
    .flightCard{
      border:1px solid rgba(255,255,255,.12);
      border-radius:18px;
      padding:12px;
      background:rgba(255,255,255,.05);
      position:relative;
    }
    .flightTop{
      font-weight:900;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      padding-right:42px;
    }
    .flightRoute{
      margin-top:6px;
      font-size:14px;
      color:var(--muted);
      padding-right:42px;
    }
    .flightTime{
      margin-top:4px;
      font-size:13px;
      color:var(--muted);
      padding-right:42px;
    }
    .flightNote{
      margin-top:7px;
      font-size:13px;
      color:var(--muted);
      white-space:pre-wrap;
      padding-right:42px;
    }

    /* modal */
    .modalMask{
      position:fixed;
      inset:0;
      background: rgba(0,0,0,.58);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:16px;
      z-index:50;
    }
    .modal{
      width:min(720px, 96vw);
      max-height:88vh;
      overflow:auto;
      border-radius:22px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(10,16,28,.92);
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow);
      padding:14px;
    }
    .modalTop{
      display:flex;
      align-items:center;
      gap:10px;
      justify-content:space-between;
      margin-bottom:12px;
    }
    .modalTitle{
      font-weight:900;
      font-size:18px;
    }
    .formGrid{
      display:grid;
      gap:10px;
      grid-template-columns: 1fr;
    }
    @media (min-width: 680px){
      .formGrid.two{ grid-template-columns: 1fr 1fr; }
    }
    label{ display:block; font-size:12px; color:var(--muted); margin:2px 0 6px; }
    input, textarea, select{
      width:100%;
      background: rgba(255,255,255,.06);
      color: var(--text);
      border:1px solid rgba(255,255,255,.14);
      border-radius:14px;
      padding:10px 12px;
      outline:none;
    }
    textarea{ min-height:96px; resize:vertical; }

    .modalActions{
      display:flex;
      gap:10px;
      margin-top:12px;
      flex-wrap:wrap;
    }
    .dangerBtn{
      border-color: rgba(255,180,180,.42) !important;
      color: rgba(255,180,180,.95);
      background: rgba(255,180,180,.10);
    }

    /* debug button */
    .dbgBtn{
      position:fixed;
      right:14px;
      bottom:14px;
      width:46px;
      height:46px;
      border-radius:16px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.30);
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      user-select:none;
      z-index:60;
      box-shadow: var(--shadow);
    }
    .dbgBtn:active{ transform: scale(.99); }

    .mono{ font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono","Courier New", monospace; font-size:12px; color:var(--muted); }
    .muted{ color:var(--muted); }
  </style>
</head>

<body>
  <div id="app"></div>

<script>
(() => {
  const { createApp } = Vue;

  // ============
  // CONFIG: 你只需要改呢兩個
  // ============
  const SUPABASE_URL = "https://qvogojdyykgotuitjkhj.supabase.co";
  const SUPABASE_KEY = "sb_publishable_9rQ7sJQ3bZ_uhnT2hxRUKQ_MJv1icIF";

  const sb = window.supabase?.createClient?.(SUPABASE_URL, SUPABASE_KEY);
  if (!sb) console.error("Supabase client init failed: window.supabase missing?");

  const hkTimeStr = () => {
    try {
      return new Intl.DateTimeFormat("en-GB", {
        timeZone: "Asia/Hong_Kong",
        hour12: false,
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      }).format(new Date());
    } catch (e) {
      return new Date().toTimeString().slice(0,8);
    }
  };

  const safeStr = (v) => (v == null ? "" : String(v));

  // small pen icon (better than yellow pencil)
  const penSvg = () => `
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12.3 6.3l5.4 5.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <path d="M4 20l4.5-1 10.8-10.8a2.2 2.2 0 0 0 0-3.1l-.4-.4a2.2 2.2 0 0 0-3.1 0L5 15.5 4 20z"
            stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
    </svg>
  `;

  const mapPeriod = (timeLabel) => {
    const t = (timeLabel || "").toLowerCase();
    // try match chinese keywords
    if (timeLabel?.includes("上午") || timeLabel?.includes("早") || timeLabel?.includes("凌") ) return "上午";
    if (timeLabel?.includes("下午") || timeLabel?.includes("中午") || timeLabel?.includes("午") ) return "下午";
    if (timeLabel?.includes("晚上") || timeLabel?.includes("夜") ) return "晚上";
    // fallback
    if (t.includes("mor")) return "上午";
    if (t.includes("aft") || t.includes("noon")) return "下午";
    if (t.includes("night") || t.includes("eve")) return "晚上";
    return "上午";
  };

  createApp({
    data() {
      return {
        view: "plan", // plan | flights | expenses | shopping
        hkClock: hkTimeStr(),
        statusText: "ready",
        lastError: null,
        connected: false,
        loading: false,

        days: [],
        selectedDayId: null,

        planItems: [],
        flights: [],
        shopping: [],
        expenses: [],

        // UI
        editing: null, // {table, mode, row, isNew}
        debugOpen: false
      };
    },

    computed: {
      selectedDay() {
        return this.days.find(d => d.id === this.selectedDayId) || null;
      },

      // Plan items for selected day only
      planForDay() {
        if (!this.selectedDayId) return [];
        return (this.planItems || []).filter(x => x.day_id === this.selectedDayId);
      },

      // Bucketed plan: 上午/下午/晚上 + 衣著(獨立)
      planBuckets() {
        const list = this.planForDay.slice().sort((a,b)=> (a.order_no??0)-(b.order_no??0));
        const buckets = {
          "上午": { dest: [], meal: null },
          "下午": { dest: [], meal: null },
          "晚上": { dest: [], meal: null },
        };
        const wear = [];

        for (const x of list) {
          const kind = x.kind || "activity";
          if (kind === "wear") {
            wear.push(x);
            continue;
          }
          const period = mapPeriod(x.time_label || "");
          const isMeal = (kind === "food") || (String(x.title||"").includes("午餐") || String(x.title||"").includes("晚餐") || String(x.title||"").includes("早餐"));
          if (isMeal) {
            if (!buckets[period].meal) buckets[period].meal = x; // only one meal displayed
          } else {
            buckets[period].dest.push(x);
          }
        }
        return { buckets, wear };
      },

      // day no map
      dayNoToIdMap() {
        const m = new Map();
        for (const d of (this.days||[])) m.set(Number(d.day_no), d.id);
        return m;
      }
    },

    methods: {
      penIcon(){ return penSvg(); },

      setErr(e) {
        this.lastError = (e && (e.message || e.error_description)) ? e : { message: String(e) };
        this.statusText = "ERR: " + safeStr(this.lastError.message || this.lastError);
        console.error(e);
      },

      async ping() {
        try {
          const { data, error, status } = await sb
            .from("days")
            .select("id,day_no")
            .order("day_no", { ascending: true })
            .limit(1);

          if (error) throw error;
          this.connected = true;
          this.statusText = `OK (${status})`;
          return data;
        } catch (e) {
          this.connected = false;
          this.setErr(e);
          return null;
        }
      },

      async loadAll() {
        this.loading = true;
        this.lastError = null;
        this.statusText = "loading...";

        try {
          const qDays = await sb
            .from("days")
            .select("id,day_no,date,title,note,sort_order,created_at,updated_at")
            .order("day_no", { ascending: true });

          if (qDays.error) throw qDays.error;
          this.days = qDays.data || [];
          if (!this.selectedDayId && this.days.length) this.selectedDayId = this.days[0].id;

          const qPlan = await sb
            .from("plan_items")
            .select("id,day_id,time_label,kind,title,note,maps_query,order_no,created_at,updated_at")
            .order("order_no", { ascending: true });

          if (qPlan.error) throw qPlan.error;
          this.planItems = qPlan.data || [];

          const qFlights = await sb
            .from("flights")
            .select("id,seg_no,flight_no,carrier,depart_airport,arrive_airport,depart_time,arrive_time,note,created_at,updated_at")
            .order("seg_no", { ascending: true });

          if (qFlights.error) throw qFlights.error;
          this.flights = qFlights.data || [];

          const qShop = await sb
            .from("shopping_items")
            .select("id,name,location,price_text,note,done,order_no,created_at,updated_at")
            .order("order_no", { ascending: true });

          if (qShop.error) throw qShop.error;
          this.shopping = qShop.data || [];

          const qExp = await sb
            .from("expenses")
            .select("id,day_id,happened_on,category,merchant,amount,currency,paid_by,note,created_at,updated_at")
            .order("happened_on", { ascending: true });

          if (qExp.error) throw qExp.error;
          this.expenses = qExp.data || [];

          this.connected = true;
          this.statusText = "loaded";
        } catch (e) {
          this.connected = false;
          this.setErr(e);
        } finally {
          this.loading = false;
        }
      },

      viewLabel(v) {
        return ({ plan:"行程", flights:"航程", expenses:"記帳", shopping:"購物" })[v] || v;
      },

      // ============
      // OPEN EDIT (mobile friendly)
      // ============
      openNew(table) {
        const blank = {
          days: { day_no: 1, date: "", title: "", note: "", sort_order: 1 },
          plan_items: { day_no: this.selectedDay?.day_no || 1, period: "上午", kind: "activity", title: "", note: "", maps_query: "" },
          flights: { seg_no: 1, carrier: "", flight_no: "", depart_airport: "", arrive_airport: "", depart_time: "", arrive_time: "", note: "" },
          shopping_items: { name: "", location: "", price_text: "", note: "" },
          expenses: { day_no: this.selectedDay?.day_no || 1, happened_on: "", category: "", merchant: "", amount: null, currency: "JPY", paid_by: "", note: "" }
        }[table] || {};

        this.editing = { table, isNew: true, row: JSON.parse(JSON.stringify(blank)) };
      },

      openEdit(table, row) {
        const r = JSON.parse(JSON.stringify(row));

        // show day_no instead of day_id for plan_items/expenses
        if (table === "plan_items") {
          const day = this.days.find(d => d.id === r.day_id);
          r.day_no = day ? Number(day.day_no) : "";
          r.period = mapPeriod(r.time_label || "上午"); // show as dropdown
          delete r.day_id;
          delete r.order_no; // hide
        }
        if (table === "expenses") {
          const day = this.days.find(d => d.id === r.day_id);
          r.day_no = day ? Number(day.day_no) : "";
          delete r.day_id;
        }
        if (table === "shopping_items") {
          // don't edit done here (checkbox on card)
          delete r.done;
          delete r.order_no;
        }
        if (table === "days") {
          // ok
        }

        this.editing = { table, isNew: false, row: r };
      },

      closeEdit() { this.editing = null; },

      // ============
      // SAVE (with day_no -> day_id)
      // ============
      async saveEdit() {
        if (!this.editing) return;
        const { table } = this.editing;
        const row = this.editing.row;

        this.loading = true;
        this.lastError = null;

        try {
          const payload = { ...row };
          // never send created/updated
          delete payload.created_at;
          delete payload.updated_at;

          if (table === "plan_items") {
            // convert day_no -> day_id
            const dayNo = Number(payload.day_no);
            const dayId = this.dayNoToIdMap.get(dayNo);
            if (!dayId) throw new Error("搵唔到呢個「第幾日」：請先新增 Day。");
            payload.day_id = dayId;
            delete payload.day_no;

            // convert period -> time_label (simple)
            const p = payload.period || "上午";
            payload.time_label = p; // store chinese label
            delete payload.period;

            // kind values: activity / food / wear
            // ok
          }

          if (table === "expenses") {
            const dayNo = Number(payload.day_no);
            const dayId = this.dayNoToIdMap.get(dayNo);
            if (!dayId) throw new Error("搵唔到呢個「第幾日」：請先新增 Day。");
            payload.day_id = dayId;
            delete payload.day_no;
          }

          // shopping_items: done/order_no not here
          // days/flights ok

          const { error } = await sb.from(table).upsert(payload);
          if (error) throw error;

          this.statusText = "saved";
          this.closeEdit();
          await this.loadAll();
        } catch (e) {
          this.setErr(e);
        } finally {
          this.loading = false;
        }
      },

      async delEditingRow() {
        if (!this.editing || this.editing.isNew) return;
        const { table, row } = this.editing;
        if (!row.id) return;

        this.loading = true;
        this.lastError = null;
        try {
          const { error } = await sb.from(table).delete().eq("id", row.id);
          if (error) throw error;

          this.statusText = "deleted";
          this.closeEdit();
          await this.loadAll();
        } catch (e) {
          this.setErr(e);
        } finally {
          this.loading = false;
        }
      },

      async toggleShoppingDone(s) {
        try {
          const { error } = await sb
            .from("shopping_items")
            .update({ done: !s.done })
            .eq("id", s.id);
          if (error) throw error;
          s.done = !s.done;
        } catch (e) {
          this.setErr(e);
        }
      },

      // quick add buttons
      addItemForPeriod(period, kind){
        this.openNew("plan_items");
        this.editing.row.period = period;
        this.editing.row.kind = kind || "activity";
      }
    },

    async mounted() {
      setInterval(() => { this.hkClock = hkTimeStr(); }, 1000);
      await this.ping();
      await this.loadAll();

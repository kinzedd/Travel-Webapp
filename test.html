<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Supabase Minimal Test</title>
</head>
<body>
  <h2>Supabase Minimal Test</h2>
  <pre id="out">running...</pre>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const out = (msg) => (document.getElementById('out').textContent += "\n" + msg);

    const SUPABASE_URL = "https://qvogojdyykgotuitjkhj.supabase.co";
    const SUPABASE_KEY = "sb_publishable_9rQ7sJQ3bZ_uhnT2hxRUKQ_MJv1icIF";

    (async () => {
      try {
        const { createClient } = window.supabase;
        const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

        out("client created ✅");

        const { data, error, status } = await sb.from("expenses").select("*").limit(1);
        out("status=" + status);
        out("data=" + JSON.stringify(data));
        out("error=" + JSON.stringify(error));

      } catch (e) {
        out("EXCEPTION=" + (e && e.message ? e.message : String(e)));
        console.error(e);
      }
    })();
  </script>
</body>
</html>
